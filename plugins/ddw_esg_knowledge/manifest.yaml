name: ddw-esg-knowledge
tier: beta
version: 1.0.0
description: "ESG Knowledge Base Plugin - Document management, full-text search, semantic search, and RAG retrieval for ESG compliance knowledge."
author: DDW Team
license: commercial
category: esg
tags:
  - esg
  - knowledge-base
  - rag
  - search
  - compliance
dependencies:
  plugins: {}
config_schema:
  db_url:
    type: string
    default: "sqlite:///esg_knowledge.db"
    description: "Database connection URL"
  embedding_model:
    type: string
    default: "local"
    description: "Embedding model provider"
  chunk_size:
    type: integer
    default: 512
    description: "Text chunk size in tokens"
  chunk_overlap:
    type: integer
    default: 128
    description: "Overlap between chunks in tokens"
