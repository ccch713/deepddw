# DDW LLM Gateway 渠道配置
# 映射: One API model/channel.go + model/channel_cache.go
# 支持环境变量替换: ${VAR_NAME}

channels:
  # ── MiniMax 主渠道 ──
  - id: 1
    name: "minimax-m3-primary"
    type: 25                    # ChannelType.MINIMAX
    base_url: "https://api.minimax.chat"
    api_keys:
      - "sk-${MINIMAX_KEY_1}"
      - "sk-${MINIMAX_KEY_2}"  # 多 Key 轮转
    models:
      - "MiniMax-Text-01"
      - "MiniMax-Text-01-40k"
    status: 1                   # 1=Enabled
    priority: 10                # 高优先级
    weight: 100                 # 权重
    group: "default"
    config:
      temperature: 0.7
      top_p: 0.9
      max_tokens: 4096

  # ── DeepSeek V4 Pro（2026-08-17 涨价后降级为兜底）──
  - id: 2
    name: "deepseek-v4-pro"
    type: 24                    # ChannelType.DEEPSEEK
    base_url: "https://api.deepseek.com"
    api_keys:
      - "sk-${DEEPSEEK_KEY}"
    models:
      - "deepseek-chat"
      - "deepseek-reasoner"
    status: 1
    priority: 2                 # 降级：涨价后仅作思考型兜底
    weight: 10                  # 权重降到最低，流量几乎不再命中
    group: "default"

  # ── 阿里通义千问 ──
  - id: 3
    name: "dashscope-qwen"
    type: 42                    # ChannelType.DASHSCOPE
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_keys:
      - "sk-${DASHSCOPE_KEY}"
    models:
      - "qwen-max"
      - "qwen-plus"
      - "qwen-turbo"
    status: 1
    priority: 8
    weight: 90
    group: "default"

  # ── OpenAI ──
  - id: 4
    name: "openai-gpt4"
    type: 1                     # ChannelType.OPENAI
    base_url: "https://api.openai.com/v1"
    api_keys:
      - "sk-${OPENAI_KEY}"
    models:
      - "gpt-4o"
      - "gpt-4o-mini"
      - "gpt-4-turbo"
    status: 1
    priority: 7
    weight: 70
    group: "default"

  # ── Ollama 本地 ──
  - id: 5
    name: "ollama-local"
    type: 11                    # ChannelType.OLLAMA
    base_url: "http://localhost:11434"
    api_keys:
      - "ollama"                # Ollama 不需要真实 Key
    models:
      - "deepseek-coder-v2:16b-lite-instruct-q4_K_M"
      - "qwen2.5:14b"
      - "llama3.1:8b"
    status: 1
    priority: 1                 # 低优先级（本地备选）
    weight: 50
    group: "default"

  # ── 硅基流动 ──
  - id: 6
    name: "siliconflow-primary"
    type: 48                    # ChannelType.SILICONFLOW
    base_url: "https://api.siliconflow.cn/v1"
    api_keys:
      - "sk-${SILICONFLOW_KEY}"
    models:
      - "Qwen/Qwen2.5-72B-Instruct"
      - "deepseek-ai/DeepSeek-V3"
    status: 1
    priority: 6
    weight: 85
    group: "default"

  # ── 智谱 GLM ──
  - id: 7
    name: "zhipu-glm4"
    type: 15                    # ChannelType.ZHIPU
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    api_keys:
      - "sk-${ZHIPU_KEY}"
    models:
      - "glm-4"
      - "glm-4-flash"
    status: 1
    priority: 6
    weight: 75
    group: "default"
