name: ddw-voice-capture
license: commercial
tier: beta
version: 1.0.0
display_name: DDW 录音与语音输入
description: 销售端 CRM 录音管理插件。统一管理销售/客户经理在跟进过程中产生的多源录音（本地/电话/会议/随手记）元数据，支持与企业/联系人/商机建立可选关联，状态机由本插件维护（uploaded→transcribed→processed），转写处理由 P3-3 ddw_voice_transcribe 写入。本插件不实现语音转写逻辑，只管理 file_url + 时长/大小/来源 + 业务关联 + 统计。
engine: plugin_base
isolation: inline

permissions:
  - database.read
  - database.write

dependencies:
  plugins:
    - ddw-company-profile
    - ddw-contact-hub
    - ddw-opportunity

config_schema:
  type: object
  properties:
    default_tenant_id:
      type: integer
      default: 1
    default_page_size:
      type: integer
      default: 20
    source_types:
      type: array
      default: [local, phone, meeting, memo]
      description: 录音来源类型枚举
    statuses:
      type: array
      default: [uploaded, transcribed, processed, failed]
      description: 录音状态机枚举
    max_file_size_mb:
      type: integer
      default: 200
      description: 单条录音文件大小上限（MB），仅作为元数据校验参考
    max_duration_seconds:
      type: integer
      default: 7200
      description: 单条录音时长上限（秒，默认 2 小时），仅作为元数据校验参考

router_prefix: /api/v1/plugins/ddw-voice-capture
