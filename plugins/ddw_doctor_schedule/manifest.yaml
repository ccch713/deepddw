name: ddw_doctor_schedule
tier: beta
version: "0.1.0"
description: "医生档案 + 排班管理（武汉东华口腔 14 医生）"
author: "DDW Team"
license: commercial
type: plugin
entry: plugin:Plugin
endpoints:
  - path: /api/v1/plugins/ddw_doctor_schedule/health
    method: GET
  - path: /api/v1/plugins/ddw_doctor_schedule/doctors
    method: POST
  - path: /api/v1/plugins/ddw_doctor_schedule/doctors
    method: GET
  - path: /api/v1/plugins/ddw_doctor_schedule/doctors/{id}
    method: GET
  - path: /api/v1/plugins/ddw_doctor_schedule/doctors/{id}
    method: PATCH
  - path: /api/v1/plugins/ddw_doctor_schedule/slots
    method: POST
  - path: /api/v1/plugins/ddw_doctor_schedule/slots
    method: GET
  - path: /api/v1/plugins/ddw_doctor_schedule/slots/{id}
    method: PATCH
  - path: /api/v1/plugins/ddw_doctor_schedule/doctors/{id}/slots
    method: GET
