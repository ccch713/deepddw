name: ddw-docs-portal
license: free
tier: core
version: 0.2.0
display_name: 文档栏目
description: deepDDW 文档栏目 —— 正式文档资产（白皮书/手册/方案/规章制度）的统一存放、展示、检索、版本管理与发布。目录树 + 可见性 + 版本管理 + publish 联动记忆 + 检索 API + 离线部署包（export/import）。正文内联存储于 SQLite（deepDDW 开源版，不再依赖 ddw-doc-assistant / ddw-memory）。
engine: plugin_base
isolation: inline

permissions:
  - database.read
  - database.write

dependencies:
  python:
    - fastapi>=0.110
    - sqlalchemy>=2.0
    - pydantic>=2.0

events:
  produces:
    - "docs.portal.published"
    - "docs.portal.archived"
    - "docs.portal.searched"
  consumes: []

config_schema:
  type: object
  properties:
    memory_upsert_enabled:
      type: boolean
      default: true
      description: publish 时是否写 deepDDW 记忆（失败不阻塞发布）
    export_dir:
      type: string
      default: "data/docs_portal_exports"
      description: export 快照输出目录

router_prefix: /api/v1/plugins/ddw-docs-portal
