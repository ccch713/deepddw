<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<link rel="icon" type="image/svg+xml" href="assets/logo-ju.svg">
<style>
  /* === CSS Variables (P0-1: 2026-08-11 主题切换合规) === */
  :root {
    --bg-base: #F0F2F5;
    --bg-card: #FFFFFF;
    --bg-elevated: #FAFAFA;
    --bg-hover: #F5F7FA;
    --bg-sidebar: #001529;
    --text-primary: #333333;
    --text-secondary: #666666;
    --text-muted: #999999;
    --text-placeholder: #BBBBBB;
    --text-inverse: #FFFFFF;
    --brand: #1890FF;
    --brand-hover: #40A9FF;
    --brand-light: #E6F4FF;
    --border: #E8E8E8;
    --border-light: #F0F0F0;
    --border-input: #D9D9D9;
    --border-focus: #1890FF;
    --success: #52C41A;
    --success-bg: #F6FFED;
    --success-border: #B7EB8F;
    --warning: #FAAD14;
    --warning-bg: #FFFBE6;
    --warning-border: #FFE58F;
    --danger: #F5222D;
    --danger-bg: #FFF1F0;
    --danger-border: #FFA39E;
    --info: #1890FF;
    --info-bg: #E6F7FF;
    --info-border: #91D5FF;
    --shadow-dropdown: 0 8px 24px rgba(0,0,0,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--text-primary); background: var(--bg-base); -webkit-font-smoothing: antialiased; }
  a { color: var(--brand); text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; }

  /* === Layout === */
  .app { display: flex; min-height: 100vh; }
  .sidebar { width: 200px; background: var(--bg-sidebar); color: rgba(255,255,255,0.85); flex-shrink: 0; }
  .sidebar-logo { display: flex; align-items: center; height: 56px; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .logo-char { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; background: #000; color: var(--text-inverse); font-size: 18px; font-weight: bold; font-family: "PingFang SC", "Microsoft YaHei", serif; border-radius: 2px; margin-right: 8px; }
  .logo-text { color: var(--text-inverse); font-size: 15px; font-weight: 500; }
  .nav-group { padding: 12px 0; }
  .nav-title { color: rgba(255,255,255,0.45); font-size: 12px; padding: 0 16px 8px; }
  .nav-item { display: flex; align-items: center; height: 40px; padding: 0 16px; color: rgba(255,255,255,0.85); font-size: 14px; cursor: pointer; }
  .nav-item:hover { color: var(--text-inverse); background: rgba(255,255,255,0.04); }
  .nav-item.active { color: var(--text-inverse); background: var(--brand); }
  .nav-icon { width: 16px; height: 16px; margin-right: 10px; flex-shrink: 0; }

  /* === P1-4 侧栏 16 频道扩展：状态标 + 规划中灰显 === */
  .nav-label { flex: 1; }
  .status-tag { display: inline-block; padding: 0 6px; height: 16px; line-height: 16px; font-size: 10px; border-radius: 2px; margin-left: auto; flex-shrink: 0; }
  .status-live { background: rgba(82,196,26,0.2); color: var(--success); border: 1px solid rgba(82,196,26,0.5); }
  .status-soon { background: rgba(250,173,20,0.2); color: var(--warning); border: 1px solid rgba(250,173,20,0.5); }
  .status-plan { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.35); border: 1px solid rgba(255,255,255,0.15); }
  .nav-item.disabled { color: rgba(255,255,255,0.35); cursor: not-allowed; pointer-events: auto; }
  .nav-item.disabled:hover { background: transparent; color: rgba(255,255,255,0.35); }

  /* === 频道页通用框架（规划中占位） === */
  .empty-plan { background: var(--bg-card); border: 1px dashed var(--border-input); border-radius: 2px; padding: 60px 20px; text-align: center; }
  .empty-plan .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
  .empty-plan h3 { color: var(--text-primary); font-size: 18px; margin-bottom: 8px; font-weight: 500; }
  .empty-plan p { color: var(--text-muted); font-size: 13px; margin-bottom: 4px; }
  .empty-plan .meta { color: var(--text-placeholder); font-size: 12px; margin-top: 12px; }
  .channel-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 2px; padding: 20px; margin-bottom: 16px; }
  .channel-card h3 { font-size: 15px; margin-bottom: 12px; color: var(--text-primary); }
  .channel-card .hint { color: var(--text-muted); font-size: 13px; line-height: 1.6; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { background: var(--bg-card); border-bottom: 1px solid var(--border); height: 56px; display: flex; align-items: center; padding: 0 24px; }
  .crumb { color: var(--text-primary); font-size: 14px; }
  .crumb .sep { color: var(--text-muted); margin: 0 6px; }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
  .user-chip { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-primary); }
  .user-avatar { width: 28px; height: 28px; background: var(--brand); color: var(--text-inverse); border-radius: 2px; display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .user-chip a { color: var(--text-secondary); font-size: 12px; }
  .user-chip a:hover { color: var(--brand); }
  .user-menu { position: relative; }
  .user-chip-btn { display: flex; align-items: center; gap: 8px; background: none; border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; font-size: 14px; color: var(--text-primary); cursor: pointer; }
  .user-chip-btn:hover { border-color: var(--brand); }
  .user-dropdown { position: absolute; right: 0; top: calc(100% + 6px); min-width: 250px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-dropdown); z-index: 100; padding: 6px; }
  .dd-head { padding: 8px 10px; font-size: 13px; color: var(--text-secondary); border-bottom: 1px solid #f0f0f0; margin-bottom: 4px; word-break: break-all; }
  .dd-tenants { max-height: 200px; overflow-y: auto; }
  .dd-item { display: flex; align-items: center; gap: 6px; padding: 8px 10px; font-size: 13px; color: var(--text-primary); text-decoration: none; border-radius: 6px; cursor: pointer; }
  .dd-item:hover { background: var(--bg-hover); }
  .dd-item.danger { color: var(--danger); }
  .dd-item.danger:hover { background: var(--danger-bg); }
  .dd-tenant { justify-content: space-between; }
  .dd-tenant.active { background: var(--brand-light); color: #1890FF; }
  .dd-tenant-role { font-size: 11px; color: var(--text-muted); }
  .dd-check { color: var(--brand); font-size: 12px; }
  .dd-empty { padding: 8px 10px; font-size: 12px; color: var(--text-muted); }
  .dd-sep { height: 1px; background: var(--border-light); margin: 4px 0; }

  .content { flex: 1; padding: 24px; overflow: auto; }

  /* === Cards === */
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 2px; }
  .card-head { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; }
  .card-title { font-size: 15px; color: var(--text-primary); font-weight: 500; }
  .card-extra { margin-left: auto; }
  .card-body { padding: 20px; }

  .row { display: grid; gap: 16px; }
  .row.c4 { grid-template-columns: repeat(4, 1fr); }
  .row.c2 { grid-template-columns: repeat(2, 1fr); }
  .row.c3 { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 900px) { .row.c4, .row.c3, .row.c2 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 600px) { .row.c4, .row.c3, .row.c2 { grid-template-columns: 1fr; } }

  .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 2px; padding: 18px 20px; }
  .stat-label { color: var(--text-muted); font-size: 13px; margin-bottom: 8px; }
  .stat-value { color: var(--text-primary); font-size: 24px; font-weight: 500; }
  .stat-extra { color: var(--success); font-size: 12px; margin-top: 4px; }
  .stat-extra.warn { color: var(--warning); }
  .stat-extra.err { color: var(--danger); }

  /* === Bar chart (纯 CSS) === */
  .bar-chart { display: flex; align-items: flex-end; height: 200px; padding: 0 8px; gap: 12px; border-bottom: 1px solid var(--border); }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; }
  .bar-fill { width: 100%; max-width: 40px; background: var(--brand); transition: height 0.4s; min-height: 2px; }
  .bar-label { color: var(--text-muted); font-size: 12px; margin-top: 8px; }
  .bar-value { color: var(--text-primary); font-size: 12px; margin-bottom: 4px; }

  /* === Table === */
  .table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .table th { background: var(--bg-elevated); color: var(--text-primary); font-weight: 500; text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .table td { padding: 12px 16px; border-bottom: 1px solid var(--border-light); color: var(--text-primary); }
  .table tr:hover td { background: var(--bg-elevated); }
  .tag { display: inline-block; padding: 2px 8px; font-size: 12px; border-radius: 2px; }
  .tag.ok { background: var(--success-bg); color: var(--success); border: 1px solid var(--success-border); }
  .tag.warn { background: var(--warning-bg); color: var(--warning); border: 1px solid var(--warning-border); }
  .tag.err { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); }
  .tag.info { background: var(--info-bg); color: #1890FF; border: 1px solid var(--info-border); }

  .btn { display: inline-block; height: 30px; line-height: 30px; padding: 0 14px; font-size: 13px; border-radius: 2px; border: 1px solid var(--border-input); background: var(--bg-card); color: var(--text-primary); cursor: pointer; }
  .btn:hover { border-color: var(--brand); color: #1890FF; }
  .btn.primary { background: var(--brand); color: var(--text-inverse); border-color: var(--brand); }
  .btn.primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); color: var(--text-inverse); }
  .btn.danger { color: var(--danger); border-color: var(--danger-border); }
  .btn.danger:hover { background: var(--danger); color: var(--text-inverse); border-color: var(--danger); }
  .btn.sm { height: 24px; line-height: 24px; padding: 0 10px; font-size: 12px; }

  .form-row { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
  .form-row label { width: 100px; color: var(--text-primary); font-size: 13px; }
  .form-row input, .form-row select, .form-row textarea { flex: 1; height: 32px; padding: 4px 11px; border: 1px solid var(--border-input); border-radius: 2px; font-size: 13px; color: var(--text-primary); outline: none; }
  .form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: var(--brand); }
  .form-row textarea { height: auto; min-height: 80px; padding: 8px 11px; }

  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal-mask.show { display: flex; }
  .modal { background: var(--bg-card); width: 460px; max-width: 90vw; border-radius: 2px; }
  .modal-head { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; }
  .modal-title { font-size: 15px; color: var(--text-primary); font-weight: 500; }
  .modal-close { margin-left: auto; cursor: pointer; color: var(--text-muted); font-size: 18px; background: none; border: none; }
  .modal-body { padding: 20px; }
  .modal-foot { padding: 12px 20px; border-top: 1px solid var(--border); text-align: right; }
  .modal-foot .btn { margin-left: 8px; }

  .toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.78); color: var(--text-inverse); padding: 10px 20px; font-size: 13px; border-radius: 2px; display: none; z-index: 200; }
  .toast.show { display: block; }

  .empty { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 13px; }
  .key-cell { font-family: monospace; font-size: 12px; color: var(--text-secondary); }

  .progress { height: 6px; background: var(--bg-base); border-radius: 2px; overflow: hidden; margin-top: 8px; }
  .progress-bar { height: 100%; background: var(--brand); }
  .progress-bar.warn { background: var(--warning); }
  .progress-bar.err { background: var(--danger); }

  /* Footer */
  .app-footer { text-align: center; padding: 14px 0; color: var(--text-muted); font-size: 12px; border-top: 1px solid #E8E8E8; background: var(--bg-card); }
  .app-footer a { color: var(--text-muted); }
  .app-footer a:hover { color: var(--brand); }
  .footer-sep { margin: 0 8px; color: var(--border-input); }

  /* Mobile */
  .menu-toggle { display: none; background: none; border: none; color: var(--text-inverse); font-size: 20px; margin-right: 8px; }
  .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 49; }
  .sidebar-overlay.active { display: block; }

  /* 768px 平板/小屏：侧栏变抽屉 */
  @media (max-width: 768px) {
    .sidebar { position: fixed; left: -200px; top: 0; bottom: 0; z-index: 50; transition: left 0.2s; box-shadow: 2px 0 12px rgba(0,0,0,0.15); }
    .sidebar.open { left: 0; }
    .menu-toggle { display: inline-block; }
    .topbar { padding: 0 12px; height: 52px; }
    .crumb { font-size: 13px; max-width: 60vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .content { padding: 12px; }
  }

  /* 480px 手机：顶部栏简化、面包屑缩略、表格横向滚动 */
  @media (max-width: 480px) {
    .topbar { padding: 0 10px; height: 48px; gap: 8px; }
    .topbar-right { gap: 8px; }
    .user-chip-btn { padding: 3px 8px; font-size: 12px; }
    .user-chip-btn .tag { display: none; }
    .crumb { font-size: 12px; max-width: 50vw; }
    .crumb .sep { margin: 0 3px; }
    .content { padding: 8px; }
    .card { padding: 12px; border-radius: 4px; }
    .card h3 { font-size: 14px; }
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .table-wrap table { min-width: 480px; }
    .modal { width: 96%; padding: 16px; }
    .modal h3 { font-size: 15px; }
  }

  /* 360px 极小屏：卡片单列，按钮全宽，表单堆叠 */
  @media (max-width: 360px) {
    .topbar { padding: 0 8px; }
    .crumb { font-size: 11.5px; max-width: 45vw; }
    .sidebar { width: 180px; left: -180px; }
    .content { padding: 6px; }
    .card { padding: 10px; }
    .btn { width: 100%; padding: 10px 12px; }
    .btn + .btn { margin-top: 8px; }
    .form-group { margin-bottom: 12px; }
    .form-row { flex-direction: column; align-items: stretch; }
    .form-row label { width: 100%; margin-bottom: 4px; }
    .modal-actions { flex-direction: column-reverse; gap: 8px; }
    .modal-actions .btn { width: 100%; }
    .user-dropdown { min-width: 220px; right: -8px; }
  }
</style>

<script>
const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'http://localhost:8500' : '';
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const toast = (m, t=2000) => { const el = $('#toast'); el.textContent = m; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'), t); };

// ====== Auth ======
const TOKEN = localStorage.getItem('ddw_token');
const USER_STR = localStorage.getItem('ddw_user');
const TENANT_STR = localStorage.getItem('ddw_tenant');
// 2026-08-11：无 token 静默跳登录页，禁止 confirm 弹窗（退出死循环根因）
if (!TOKEN) { location.href = '/login.html'; }
const USER = USER_STR ? JSON.parse(USER_STR) : { name: '?', role: 'member' };
const TENANT = TENANT_STR ? JSON.parse(TENANT_STR) : { name: '?', plan: 'free' };

async function api(path, opts = {}) {
  const r = await fetch(API_BASE + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + TOKEN,
      ...(opts.headers || {})
    }
  });
  if (r.status === 401) { localStorage.clear(); location.href = '/login.html'; return; }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || ('HTTP ' + r.status));
  return d;
}

// ====== User Chip（含租户切换下拉，2026-08-11）======
function roleLabel(role) {
  const m = { superadmin: '超级管理员', owner: '公司管理员', admin: '部门管理员', partner: '经销商', member: '成员', user: '成员' };
  return m[role] || role || '成员';
}
function renderUserChip(u) {
  var name = u.name || '?';
  var phoneTail = u.phone ? u.phone.slice(-6) : '';
  var display = name + (phoneTail ? ' · ' + phoneTail : '');
  $('#userChip').innerHTML =
    '<div class="user-menu" id="userMenu">' +
      '<button class="user-chip-btn" id="userChipBtn">' +
        '<span class="user-avatar">' + name.charAt(0) + '</span>' +
        '<span>' + display + '</span>' +
        '<span class="tag info" style="margin-left:4px">' + roleLabel(u.role) + '</span>' +
        '<span class="caret">▾</span>' +
      '</button>' +
      '<div class="user-dropdown" id="userDropdown" style="display:none">' +
        '<div class="dd-head">' + display + ' · ' + roleLabel(u.role) + '</div>' +
        '<div class="dd-tenants" id="ddTenants"></div>' +
        '<div class="dd-sep"></div>' +
        '<a href="/pal.html" class="dd-item">🤖 DDW Pal</a>' +
        '<a href="/saas-admin.html" class="dd-item">⚙️ 控制台</a>' +
        '<a href="javascript:void(0)" class="dd-item danger" id="btnLogout">退出登录</a>' +
      '</div>' +
    '</div>';
  $('#userChipBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    var dd = $('#userDropdown');
    dd.style.display = dd.style.display === 'none' ? 'block' : 'none';
    loadTenantOptions();
  });
  document.addEventListener('click', function () { $('#userDropdown').style.display = 'none'; });
  $('#btnLogout').addEventListener('click', function (e) {
    e.stopPropagation();
    localStorage.clear();
    try { document.cookie = 'ddw_logged_in=; Domain=.9cio.com; Path=/; Max-Age=0'; } catch (err) {}
    location.href = '/index.html';
  });
}
// 拉取同手机号全部租户，渲染切换选项
async function loadTenantOptions() {
  var box = $('#ddTenants');
  try {
    var d = await api('/api/v1/auth/me');
    var list = (d && d.tenants) || [];
    if (!list.length) { box.innerHTML = '<div class="dd-empty">无其他身份</div>'; return; }
    var curId = (d.tenant && d.tenant.id);
    box.innerHTML = list.map(function (t) {
      var active = t.tenant_id === curId ? ' class="active"' : '';
      return '<a href="javascript:void(0)" class="dd-item dd-tenant"' + active + ' data-tid="' + t.tenant_id + '">' +
        '<span class="dd-tenant-name">' + t.name + '</span>' +
        '<span class="dd-tenant-role">' + roleLabel(t.role) + '</span>' +
        (t.tenant_id === curId ? '<span class="dd-check">✓</span>' : '') +
      '</a>';
    }).join('');
    box.querySelectorAll('.dd-tenant').forEach(function (el) {
      el.addEventListener('click', async function (e) {
        e.stopPropagation();
        var tid = parseInt(el.dataset.tid, 10);
        if (tid === curId) return;
        try {
          var r = await api('/api/v1/auth/switch-tenant', { method: 'POST', body: JSON.stringify({ tenant_id: tid }) });
          if (r && r.access_token) {
            localStorage.setItem('ddw_token', r.access_token);
            localStorage.setItem('ddw_user', JSON.stringify(r.user));
            localStorage.setItem('ddw_tenant', JSON.stringify(r.tenant));
            toast('已切换身份，正在刷新…', 1500);
            setTimeout(function () { location.reload(); }, 600);
          } else { toast('切换失败：' + (r.detail || '未知错误')); }
        } catch (err) { toast('切换失败：' + err.message); }
      });
    });
  } catch (err) {
    box.innerHTML = '<div class="dd-empty">加载身份失败</div>';
  }
}
renderUserChip(USER);

// 异步刷新 /auth/me 并缓存
api('/api/v1/auth/me').then(function (d) {
  if (d && d.user) {
    localStorage.setItem('ddw_user', JSON.stringify(d.user));
    localStorage.setItem('ddw_tenant', JSON.stringify(d.tenant));
    renderUserChip(d.user);
  }
  // 权限矩阵过滤侧栏（2026-08-11：经销商/财务频道按 permissions 显示，企业租户不显示经销商频道）
  const perms = (d && d.permissions) || {};
  document.querySelectorAll('.nav-item[data-perm]').forEach(function (el) {
    const need = el.dataset.perm;
    const has = need === 'partner' ? !!perms.can_manage_partner_demo
      : (need === 'finance' ? !!perms.can_view_finance
        : (need === 'admin' ? !!perms.can_access_admin : true));
    el.style.display = has ? '' : 'none';
  });
}).catch(function () {});

const NAV_ITEMS = {

  users:      { title: '成员管理',     render: renderUsers },

  // P1-4 新增：LLM 已实装、其它占位
  llm:        { title: 'LLM 配置',     render: renderLLM },
  knowledge:  { title: '知识库',       render: renderKnowledge },
  agents:     { title: '数字员工',     render: renderOrgAgents },

  plugins:    { title: '插件管理',     render: renderPlugins },
  partners:   { title: '经销商',       render: renderPartners },
  'demo-accounts': { title: '客户 Demo 账号', render: renderDemoAccounts },

function showChannel(route) {
  document.querySelectorAll('.channel-page').forEach(p => p.style.display = 'none');
  const el = document.getElementById('page-' + route);
  if (el) el.style.display = 'block';
  document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));

}

function route() {
  const hash = location.hash.replace(/^#\/?/, '') || 'overview';
  const r = ROUTES[hash] || ROUTES.overview;
  $('#crumb').textContent = r.title;
  // 规划中频道（status=plan 且渲染函数返回占位）不调真实 API
  const isPlan = NAV_ITEMS[hash] && NAV_ITEMS[hash].status === 'plan';
  $$('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.route === (ROUTES[hash] ? hash : 'overview')));
  $('#content').innerHTML = '<div class="empty">加载中…</div>';
  Promise.resolve(r.render()).then(html => { $('#content').innerHTML = html; bindPage(hash); });
  // 移动端关闭
  $('#sidebar').classList.remove('open');
}

document.querySelectorAll('.nav-item.disabled').forEach(el => {

    e.preventDefault();

});
// 2026-08-11 修复：live 频道点击无反应（此前从未绑定 click）
document.querySelectorAll('.nav-item[data-route]:not(.disabled)').forEach(el => {

    location.hash = route;
  });
});
window.addEventListener('hashchange', route);

// ====== Modal ======
function modal({ title, body, onOk, okText='确定', cancelText='取消' }) {
  return new Promise((resolve) => {
    $('#modalTitle').textContent = title;
    $('#modalBody').innerHTML = body;
    $('#modalOk').textContent = okText;
    $('#modalCancel').textContent = cancelText;
    const close = (val) => { $('#modal').classList.remove('show'); resolve(val); };
    $('#modalOk').onclick = async () => { const v = onOk ? await onOk() : true; close(v); };
    $('#modalCancel').onclick = () => close(false);
    $('#modalClose').onclick = () => close(false);
    $('#modal').classList.add('show');
  });
}

// ====== Pages ======

// 概览
async function renderOverview() {
  let data;
  try { data = await api('/api/v1/admin/overview'); } catch (e) { return '<div class="card"><div class="empty">加载失败：' + e.message + '</div></div>'; }
  let usage;
  try { usage = await api('/api/v1/admin/llm/usage?days=7'); } catch (e) { usage = null; }
  const max = Math.max(1, ...data.trend_7d.map(t => t.tokens));
  const bars = data.trend_7d.map(t => {
    const h = Math.round(t.tokens / max * 160);
    return '<div class="bar-col"><div class="bar-value">' + (t.tokens >= 10000 ? (t.tokens/10000).toFixed(1) + 'w' : t.tokens) + '</div><div class="bar-fill" style="height:' + h + 'px"></div><div class="bar-label">' + t.date.slice(5) + '</div></div>';
  }).join('');
  const usageRatio = data.token_limit ? (data.tokens_used / data.token_limit) : 0;
  const ratioPct = Math.min(100, Math.round(usageRatio * 100));
  const ratioCls = ratioPct > 80 ? 'err' : ratioPct > 60 ? 'warn' : '';
  return `
    <div class="row c4" style="margin-bottom:16px">
      <div class="stat-card"><div class="stat-label">活跃用户</div><div class="stat-value">${data.user}</div><div class="stat-extra">+0 本周</div></div>
      <div class="stat-card"><div class="stat-label">API Key</div><div class="stat-value">${data.api_key_count}</div><div class="stat-extra">活跃</div></div>
      <div class="stat-card"><div class="stat-label">本月 Token</div><div class="stat-value">${(data.tokens_used/10000).toFixed(1)}w</div><div class="stat-extra ${ratioCls}">${ratioPct}% 已用</div><div class="progress"><div class="progress-bar ${ratioCls}" style="width:${ratioPct}%"></div></div></div>
      <div class="stat-card"><div class="stat-label">当前套餐</div><div class="stat-value">${TENANT.plan}</div><div class="stat-extra">${data.token_limit ? (data.token_limit/10000).toFixed(0) + 'w Token / 月' : ''}</div></div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="card-head"><div class="card-title">Token 消耗趋势（近 7 天）</div></div>
      <div class="card-body">${'<div class="bar-chart">' + bars + '</div>'}</div>
    </div>

    <div class="row c2">
      <div class="card">
        <div class="card-head"><div class="card-title">API 调用统计</div></div>
        <div class="card-body"><div id="apiStats">${data.plugin_ranking.map(p => '<div class="form-row"><label>' + p.name + '</label><div style="flex:1"><div class="progress"><div class="progress-bar" style="width:' + Math.min(100, p.calls/20) + '%"></div></div><div style="font-size:12px;color:var(--text-muted);margin-top:4px">' + p.calls + ' 次调用</div></div></div>').join('')}</div></div>
      </div>
      <div class="card">
        <div class="card-head"><div class="card-title">插件调用排行</div></div>
        <div class="card-body"><table class="table"><thead><tr><th>插件</th><th>调用次数</th></tr></thead><tbody>${data.plugin_ranking.map(p => '<tr><td>' + p.name + '</td><td>' + p.calls + '</td></tr>').join('')}</tbody></table></div>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="card-head"><div class="card-title">LLM 网关消耗（近 7 天 · 真实数据）</div></div>
      <div class="card-body">${usage ? `
        ${usage.cloud || usage.selfhosted ? `
        <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap">
          ${usage.cloud && usage.cloud.tokens > 0 ? `
          <div style="flex:1;min-width:200px;padding:14px 16px;border:1px solid var(--info-border);border-radius:4px;background:var(--info-bg)">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span class="tag info">云端</span><span style="font-size:13px;color:#666">${(usage.cloud.providers||[]).join(' / ') || '—'}</span></div>
            <div style="font-size:20px;font-weight:500;color:#333">${(usage.cloud.tokens/10000).toFixed(1)}w tokens</div>
            <div style="font-size:12px;color:#999;margin-top:4px">预估支出 ¥${usage.cloud.cost_cny.toFixed(4)}</div>
          </div>` : ''}
          ${usage.selfhosted && usage.selfhosted.tokens > 0 ? `
          <div style="flex:1;min-width:200px;padding:14px 16px;border:1px solid #B7EB8F;border-radius:4px;background:#F6FFED">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span class="tag ok">自建</span><span style="font-size:13px;color:#666">${(usage.selfhosted.providers||[]).join(' / ') || '—'}</span></div>
            <div style="font-size:20px;font-weight:500;color:#333">${(usage.selfhosted.tokens/10000).toFixed(1)}w tokens</div>
            <div style="font-size:12px;color:#999;margin-top:4px">预估节约 ¥${usage.selfhosted.saved_cny.toFixed(4)}</div>
          </div>` : ''}
        </div>` : ''}
        <div class="row c4" style="margin-bottom:12px">
          <div class="stat-card"><div class="stat-label">网关调用</div><div class="stat-value">${usage.total.calls}</div><div class="stat-extra">次</div></div>
          <div class="stat-card"><div class="stat-label">输入 Tokens</div><div class="stat-value">${usage.total.tokens_in}</div></div>
          <div class="stat-card"><div class="stat-label">输出 Tokens</div><div class="stat-value">${usage.total.tokens_out}</div></div>
          <div class="stat-card"><div class="stat-label">消耗成本</div><div class="stat-value">¥${usage.total.cost.toFixed(4)}</div><div class="stat-extra">按网关记录</div></div>
        </div>
        ${(usage.by_provider || []).map(p => '<div class="form-row"><label>' + p.provider + ' / ' + p.model + '</label><div style="flex:1"><div class="progress"><div class="progress-bar" style="width:' + Math.min(100, p.calls * 5) + '%"></div></div><div style="font-size:12px;color:#999;margin-top:4px">' + p.calls + ' 次 · ' + p.tokens_in + ' in / ' + p.tokens_out + ' out · ¥' + p.cost.toFixed(4) + '</div></div></div>').join('')}
        <table class="table" style="margin-top:8px"><thead><tr><th>时间</th><th>Provider</th><th>模型</th><th>In/Out</th><th>成本</th></tr></thead><tbody>${(usage.recent || []).slice(0,8).map(r => '<tr><td>' + String(r.created_at||'').slice(0,16).replace('T',' ') + '</td><td>' + r.provider + '</td><td>' + r.model + '</td><td>' + r.tokens_in + '/' + r.tokens_out + '</td><td>¥' + r.cost.toFixed(4) + '</td></tr>').join('')}</tbody></table>`
        : '<div class="empty">暂无网关消耗记录——AI 客服问答后将自动统计</div>'}
      </div>
    </div>
  `;
}

function bindUsers() {
  $('#btnInvite').addEventListener('click', async () => {

function renderKBTree(kbs) {
  if (!kbs || !kbs.length) return '<div class="empty" style="font-size:12px">暂无知识库</div>';
  const groups = { company: [], department: [], personal: [] };
  kbs.forEach(kb => { const s = kb.scope || 'company'; if (groups[s]) groups[s].push(kb); });
  const names = { company: '企业知识库', department: '部门知识库', personal: '个人知识库' };
  let html = '';
  for (const [scope, items] of Object.entries(groups)) {
    if (!items.length) continue;
    html += '<div style="margin-bottom:12px"><div style="font-size:12px;font-weight:600;color:var(--text-primary);margin-bottom:4px">' + names[scope] + ' (' + items.length + ')</div>';
    items.forEach(kb => {
      html += '<div class="kb-tree-item" onclick="selectKB(' + kb.id + ',this)" style="padding:6px 12px;font-size:13px;color:var(--text-secondary);cursor:pointer;border-radius:var(--radius-sm);margin:2px 0">' + (kb.name || '未命名') + '</div>';
    });
    html += '</div>';
  }
  return html;
}

let currentKBId = null;
async function selectKB(id, el) {
  currentKBId = id;
  document.querySelectorAll('.kb-tree-item').forEach(e => e.style.background = '');
  if (el) el.style.background = 'var(--bg-hover)';
  try {
    const r = await api('/api/v1/plugins/ddw-knowledge-hierarchy/documents?kb_id=' + id);
    const docs = r.items || r || [];
    const list = document.getElementById('kbDocList');
    if (!docs.length) { list.innerHTML = '<div class="empty">该知识库暂无文档</div>'; return; }
    list.innerHTML = '<table class="table"><thead><tr><th>文档名</th><th>大小</th><th>操作</th></tr></thead><tbody>' +
      docs.map(d => '<tr><td>' + (d.file_name || d.title || '未命名') + '</td><td>' + formatSize(d.file_size || 0) + '</td><td><button class="btn sm" onclick="deleteDoc(' + d.id + ')">删除</button></td></tr>').join('') +
      '</tbody></table>';
  } catch (e) {
    document.getElementById('kbDocList').innerHTML = '<div class="empty">加载失败：' + e.message + '</div>';
  }
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

async function searchKB() {
  const q = document.getElementById('kbSearch').value.trim();
  if (!q) return;
  try {
    const r = await api('/api/v1/plugins/ddw-knowledge-hierarchy/search/flat', { method: 'POST', body: JSON.stringify({ query: q, kb_id: currentKBId }) });
    const results = r.results || r || [];
    const list = document.getElementById('kbDocList');
    if (!results.length) { list.innerHTML = '<div class="empty">未找到相关内容</div>'; return; }
    list.innerHTML = results.map(r => '<div style="padding:10px;border-bottom:1px solid var(--border-light)"><b>' + (r.title || '文档') + '</b><div style="font-size:12px;color:var(--text-muted);margin-top:4px">' + (r.content || r.text || '').slice(0, 200) + '</div></div>').join('');
  } catch (e) {
    document.getElementById('kbDocList').innerHTML = '<div class="empty">搜索失败：' + e.message + '</div>';
  }
}

  const mask = document.createElement('div');

function escapeHtml(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function fmtLogTime(iso) {
  if (!iso) return '-';
  try {
    const d = new Date(String(iso).endsWith('Z') ? iso : iso + 'Z');
    d.setHours(d.getHours() + 8);
    return d.toISOString().slice(0, 16).replace('T', ' ');
  } catch (e) { return String(iso).slice(0, 16).replace('T', ' '); }
}
async function renderWorkLogs() {
  window.wlType = window.wlType || 'all';
  window.wlDays = window.wlDays || 7;
  const curType = window.wlType;
  const curDays = window.wlDays;
  async function load() {
    const r = await api('/api/v1/admin/work-logs?days=' + curDays + '&log_type=' + curType + '&limit=100');
    return r.items || r || [];
  }
  let logs = [];
  try { logs = await load(); } catch (e) {
    return '<div class="card"><div class="empty">加载失败：' + e.message + '</div></div>';
  }
  const typeBadge = (t) => t === 'chat' ? '<span class="tag info">对话</span>' : '<span class="tag warn">流程</span>';
  const rows = logs.map((l, i) => {
    if (l.type === 'chat') {
      return `<tr>
        <td>${fmtLogTime(l.created_at)}</td>
        <td>${typeBadge('chat')}</td>
        <td>${l.user || '-'}${l.user_role ? ' <span class="tag muted">' + l.user_role + '</span>' : ''}</td>
        <td style="max-width:380px"><span class="log-role ${l.role === 'user' ? 'log-u' : 'log-a'}">${l.role === 'user' ? '问' : '答'}</span> <span class="log-content" data-log="${i}">${escapeHtml(String(l.content || '').slice(0, 80))}</span></td>
        <td>${l.model || '-'}</td>
        <td>${l.tokens_in || 0}/${l.tokens_out || 0} · ¥${(l.cost || 0).toFixed(4)}</td>
      </tr>`;
    }
    return `<tr>
      <td>${fmtLogTime(l.created_at)}</td>
      <td>${typeBadge('flow')}</td>
      <td>${l.user || '-'}</td>
      <td style="max-width:380px"><b>${l.flow_name || '-'}</b> <span class="tag ${l.status === 'success' ? 'ok' : 'err'}">${l.status === 'success' ? '成功' : '失败'}</span> <span class="log-content" data-log="${i}">${escapeHtml(String(l.result || l.error || '').slice(0, 60))}</span></td>
      <td>v${l.flow_version || '-'}</td>
      <td>-</td>
    </tr>`;
  }).join('');
  const full = logs.map(l => l.type === 'chat' ? ('【' + (l.user || '') + ' · ' + (l.role === 'user' ? '提问' : '回答') + '】\n' + (l.content || '')) : ('【流程 ' + (l.flow_name || '') + ' v' + (l.flow_version || '') + ' · ' + (l.status || '') + '】\n' + (l.result || l.error || ''))).join('\n\n=====\n\n');
  return `
    <div class="card">
      <div class="card-head">
        <div class="card-title">企业工作日志（${logs.length}）</div>
        <div class="card-extra">
          <select id="wl_type" style="margin-right:8px">
            <option value="all" ${curType === 'all' ? 'selected' : ''}>全部</option>
            <option value="chat" ${curType === 'chat' ? 'selected' : ''}>仅对话</option>
            <option value="flow" ${curType === 'flow' ? 'selected' : ''}>仅流程执行</option>
          </select>
          <select id="wl_days">
            <option value="7" ${curDays === 7 ? 'selected' : ''}>近 7 天</option>
            <option value="30" ${curDays === 30 ? 'selected' : ''}>近 30 天</option>
            <option value="90" ${curDays === 90 ? 'selected' : ''}>近 90 天</option>
          </select>
        </div>
      </div>
      <div class="card-body" style="padding:0">
        <table class="table">
          <thead><tr><th>时间</th><th>类型</th><th>用户</th><th>内容</th><th>模型/流程</th><th>消耗</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="6" class="empty">暂无日志——员工使用 DDW Pal 对话或执行碳硅流程后自动记录</td></tr>'}</tbody>
        </table>
      </div>
      <div style="margin-top:12px;text-align:right"><button class="btn sm" id="wlExport">复制全部日志</button></div>
    </div>`;
}

function bindWorkLogs() {
  $('#wl_type').addEventListener('change', (e) => { window.wlType = e.target.value; route(); });
  $('#wl_days').addEventListener('change', (e) => { window.wlDays = parseInt(e.target.value, 10); route(); });
  const exp = $('#wlExport');

    // 从表格重建文本
    const texts = [];
    document.querySelectorAll('#content tbody tr').forEach(tr => {
      texts.push(Array.from(tr.querySelectorAll('td')).map(td => td.innerText.trim()).join(' | '));
    });
    const blob = new Blob([texts.join('\n')], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'work-logs-' + new Date().toISOString().slice(0, 10) + '.txt';
    a.click();
    toast('日志已导出');
  });
}

      </table>
    </div>
    <div style="font-size:12px;color:#999;margin-top:8px">填写每行的发票号和文件 URL 后点确定，系统将批量更新这些申请为已开票状态。</div>
  `;
  const ok = await modal({ title: '批量上传发票文件（' + pending.length + ' 张待开票）', body, okText: '提交批量上传', cancelText: '取消' });
  if (!ok) return;

  const items = pending.map(p => ({
    invoice_id: p.id,
    invoice_no: document.querySelector('.batch-no[data-id="' + p.id + '"]').value.trim(),
    invoice_url: document.querySelector('.batch-url[data-id="' + p.id + '"]').value.trim(),
    file_type: 'pdf',
  })).filter(i => i.invoice_no && i.invoice_url);

  if (items.length === 0) { toast('请至少填写一行有效的发票号与文件 URL', 2500, 'err'); return; }

  try {
    const r = await api('/api/v1/plugins/ddw-invoice/invoices/batch-upload', {
      method: 'POST',
      body: JSON.stringify({ items, notify: true }),
    });
    let msg = '提交完成：成功 ' + r.succeeded + '，失败 ' + r.failed;
    if (r.failed > 0) {
      const firstErr = (r.results || []).find(x => !x.ok);
      if (firstErr) msg += '（首条失败原因：' + firstErr.error + '）';
    }
    toast(msg, 3500, r.failed === 0 ? 'ok' : 'err');
    route();
  } catch (e) { toast('批量上传失败：' + e.message, 3000, 'err'); }
}

function bindPage(name) {
  if (name === 'users') bindUsers();
  else if (name === 'billing') bindBilling();
  else if (name === 'invoices') bindInvoices();
  else if (name === 'settings') bindSettings();
  else if (name === 'llm') bindLLM();
  else if (name === 'worklogs') bindWorkLogs();
  // P1-4 新增频道暂无交互绑定，保留扩展位
}

route();
</script>
</body>
</html>
