<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>碳硅协同 · 流程设计器</title>
<style>
  :root {
    --bg-base: #F0F2F5;
    --bg-card: #FFFFFF;
    --bg-elevated: #FAFAFA;
    --bg-hover: #F5F7FA;
    --bg-sidebar: #001529;
    --text-primary: #333333;
    --text-secondary: #666666;
    --text-muted: #999999;
    --text-placeholder: #BBBBBB;
    --text-inverse: #FFFFFF;
    --brand: #1890FF;
    --brand-hover: #40A9FF;
    --brand-light: #E6F4FF;
    --border: #E8E8E8;
    --border-light: #F0F0F0;
    --border-input: #D9D9D9;
    --border-focus: #1890FF;
    --success: #52C41A;
    --success-bg: #F6FFED;
    --success-border: #B7EB8F;
    --warning: #FAAD14;
    --warning-bg: #FFFBE6;
    --warning-border: #FFE58F;
    --danger: #F5222D;
    --danger-bg: #FFF1F0;
    --danger-border: #FFA39E;
    --info: #1890FF;
    --info-bg: #E6F7FF;
    --info-border: #91D5FF;
    --shadow-dropdown: 0 8px 24px rgba(0,0,0,0.12);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg-base); color:var(--text-primary); -webkit-font-smoothing:antialiased; }

  /* === Layout === */
  .app { display:flex; min-height:100vh; }
  .sidebar { width:200px; background:var(--bg-sidebar); color:rgba(255,255,255,0.85); flex-shrink:0; }
  .sidebar-logo { display:flex; align-items:center; height:56px; padding:0 16px; border-bottom:1px solid rgba(255,255,255,0.08); }
  .logo-char { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; background:#000; color:var(--text-inverse); font-size:18px; font-weight:bold; font-family:"PingFang SC","Microsoft YaHei",serif; border-radius:2px; margin-right:8px; }
  .logo-text { color:var(--text-inverse); font-size:15px; font-weight:500; }
  .nav-group { padding:12px 0; }
  .nav-title { color:rgba(255,255,255,0.45); font-size:12px; padding:0 16px 8px; }
  .nav-item { display:flex; align-items:center; height:40px; padding:0 16px; color:rgba(255,255,255,0.85); font-size:14px; cursor:pointer; text-decoration:none; border-left:3px solid transparent; }
  .nav-item:hover { color:var(--text-inverse); background:rgba(255,255,255,0.04); }
  .nav-item.active { color:var(--text-inverse); background:rgba(24,144,255,0.15); border-left-color:var(--text-inverse); }
  .nav-icon { width:16px; height:16px; margin-right:10px; flex-shrink:0; }
  .nav-label { flex:1; }
  .nav-action { display:flex; align-items:center; justify-content:center; height:40px; margin:4px 12px; border-radius:4px; font-size:13px; cursor:pointer; color:var(--brand); border:1px dashed rgba(24,144,255,0.4); text-decoration:none; }
  .nav-action:hover { background:rgba(24,144,255,0.1); border-color:var(--brand); color:var(--brand-hover); }

  .main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .topbar { background:var(--bg-card); border-bottom:1px solid var(--border); height:56px; display:flex; align-items:center; padding:0 24px; }
  .crumb { color:var(--text-primary); font-size:14px; }
  .crumb .sep { color:var(--text-muted); margin:0 6px; }
  .topbar-right { margin-left:auto; display:flex; align-items:center; gap:16px; }
  .user-chip { font-size:13px; color:var(--text-secondary); display:flex; align-items:center; gap:8px; }
  .user-avatar { width:28px; height:28px; background:var(--brand); color:var(--text-inverse); border-radius:2px; display:flex; align-items:center; justify-content:center; font-size:12px; }
  .user-chip a { color:var(--text-secondary); text-decoration:none; font-size:12px; }
  .user-chip a:hover { color:var(--brand); }
  .user-chip b { color:var(--text-primary); }

  .page { flex:1; padding:20px; overflow:auto; }
  .card { background:var(--bg-card); border:1px solid var(--border); border-radius:8px; padding:18px; margin-bottom:16px; }
  .card-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .card-title { font-size:15px; font-weight:600; }
  .btn { padding:7px 16px; border-radius:6px; border:1px solid var(--border); background:var(--bg-card); font-size:13px; cursor:pointer; }
  .btn.primary { background:var(--brand); color:var(--text-inverse); border-color:var(--brand); }
  .btn.danger { color:var(--danger); border-color:var(--danger); }
  .btn.sm { padding:4px 10px; font-size:12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--text-secondary); font-weight:500; padding:8px 10px; border-bottom:1px solid var(--border); }
  td { padding:8px 10px; border-bottom:1px solid var(--border-light); }
  .tag { font-size:11px; padding:2px 8px; border-radius:10px; }
  .tag.ok { background:var(--success-bg); color:var(--success); }
  .tag.warn { background:var(--warning-bg); color:var(--warning); }
  .tag.err { background:var(--danger-bg); color:var(--danger); }
  .tag.info { background:var(--brand-light); color:var(--brand); }
  .tag.muted { background:var(--bg-hover); color:var(--text-muted); }
  .empty { text-align:center; color:var(--text-muted); padding:30px 0; font-size:13px; }

  /* 统计卡 */
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
  .stat { background:var(--bg-card); border:1px solid var(--border); border-radius:8px; padding:14px 16px; }
  .stat .v { font-size:22px; font-weight:600; }
  .stat .l { font-size:12px; color:var(--text-muted); margin-top:2px; }

  /* ===== 编辑器 ===== */
  .editor { display:flex; height:100%; }
  .ed-palette { width:150px; background:var(--bg-card); border-right:1px solid var(--border); padding:12px; overflow-y:auto; }
  .ed-palette .pt { font-size:12px; color:var(--text-muted); margin:8px 0 6px; }
  .pal-item { padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:12.5px; margin-bottom:8px; cursor:grab; background:var(--bg-elevated); }
  .pal-item:hover { border-color:var(--brand); }
  .ed-canvas { flex:1; position:relative; overflow:hidden; background:var(--bg-base); }
  .ed-canvas svg.lines { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .flow-node { position:absolute; min-width:130px; background:var(--bg-card); border:1.5px solid var(--border); border-radius:8px; padding:8px 12px; font-size:12.5px; box-shadow:0 1px 4px rgba(0,0,0,0.06); cursor:move; z-index:2; }
  .flow-node.selected { border-color:var(--brand); box-shadow:0 0 0 2px rgba(24,144,255,0.2); }
  .flow-node .n-type { font-size:10px; color:var(--text-muted); }
  .flow-node .n-name { font-weight:500; margin-top:2px; word-break:break-all; }
  .flow-node .n-actions { position:absolute; top:-9px; right:6px; display:flex; gap:4px; }
  .flow-node .n-actions button { width:18px; height:18px; font-size:10px; border:1px solid var(--border); border-radius:4px; background:var(--bg-card); cursor:pointer; }
  .flow-node .n-actions button:hover { border-color:var(--brand); }
  .ed-props { width:240px; background:var(--bg-card); border-left:1px solid var(--border); padding:14px; overflow-y:auto; }
  .ed-props label { display:block; font-size:12px; color:var(--text-secondary); margin:10px 0 4px; }
  .ed-props input, .ed-props textarea, .ed-props select { width:100%; padding:7px 9px; border:1px solid var(--border); border-radius:6px; font-size:12.5px; font-family:inherit; outline:none; }
  .ed-props input:focus, .ed-props textarea:focus { border-color:var(--brand); }
  .ed-toolbar { position:absolute; top:10px; left:50%; transform:translateX(-50%); background:var(--bg-card); border:1px solid var(--border); border-radius:20px; padding:6px 12px; display:flex; gap:8px; box-shadow:var(--shadow-dropdown); z-index:10; }
  .ed-status { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.7); color:var(--text-inverse); font-size:11.5px; padding:4px 14px; border-radius:12px; z-index:10; }
  .linking { cursor:crosshair !important; }
  .run-result { margin-top:12px; background:var(--bg-hover); border:1px solid var(--border); border-radius:8px; padding:12px; font-size:12.5px; white-space:pre-wrap; max-height:260px; overflow-y:auto; }
  @media (max-width:800px){ .ed-props{display:none} .ed-palette{width:110px} }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <span class="logo-char">碳</span>
      <span class="logo-text">碳硅协同</span>
    </div>
    <div class="nav-group">
      <div class="nav-title">流程管理</div>
      <a class="nav-item" data-route="list" href="#/list">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M2 3h12v2H2zm0 4h12v2H2zm0 4h12v2H2z"/></svg>
        <span class="nav-label">流程列表</span>
      </a>
      <a class="nav-item" data-route="dashboard" href="#/dashboard">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="9" width="3" height="6"/><rect x="5.5" y="5" width="3" height="10"/><rect x="10" y="1" width="3" height="14"/></svg>
        <span class="nav-label">看板</span>
      </a>
      <a class="nav-item" data-route="reviews" href="#/reviews">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1l5 3v5c0 3-2 5-5 6-3-1-5-3-5-6V4l5-3z"/></svg>
        <span class="nav-label">审核</span>
      </a>
    </div>
    <a class="nav-action" href="#/editor/new">＋ 新建流程</a>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="crumb">
        <span>碳硅协同</span>
        <span class="sep">/</span>
        <span id="crumb">流程列表</span>
      </div>
      <div class="topbar-right">
        <div class="user-chip" id="userChip">未登录</div>
      </div>
    </header>

    <div id="app" class="page"></div>
  </main>
</div>

<script src="/js/api.js?v=20260811c"></script>
<script>
(function () {
  'use strict';
  const $ = (s) => document.querySelector(s);
  if (!DDW.api.getToken()) { location.href = '/login.html'; return; }

  let ME = null;
  let CURRENT = null;   // 编辑器当前流程

  function toast(msg, type) {
    let host = document.getElementById('toast-host');
    if (!host) { host = document.createElement('div'); host.className = 'toast-host'; host.id = 'toast-host';
      host.style.cssText = 'position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:2000;';
      document.body.appendChild(host); }
    const el = document.createElement('div');
    el.style.cssText = 'background:rgba(0,0,0,0.8);color:#fff;padding:8px 16px;border-radius:16px;font-size:13px;margin-bottom:6px;' + (type === 'err' ? 'background:rgba(229,72,77,0.92);' : '');
    el.textContent = msg;
    host.appendChild(el);
    setTimeout(() => el.remove(), 2600);
  }
  function statusTag(s) {
    const m = { draft: ['草稿', 'muted'], pending_review: ['待审核', 'warn'], published: ['已发布', 'ok'], deprecated: ['已停用', 'err'] };
    const [t, c] = m[s] || [s, 'muted'];
    return '<span class="tag ' + c + '">' + t + '</span>';
  }

  // 时间显示：后端存 UTC，前端转北京时间 +8h
  function fmtTime(iso) {
    if (!iso) return '-';
    try {
      const d = new Date(String(iso).endsWith('Z') ? iso : iso + 'Z');
      d.setHours(d.getHours() + 8);
      return d.toISOString().slice(0, 16).replace('T', ' ');
    } catch (e) { return String(iso).slice(0, 16).replace('T', ' '); }
  }

  // ===== 路由 =====
  const PAGE_TITLES = { list: '流程列表', dashboard: '看板', reviews: '审核', editor: '编辑器' };
  function route() {
    const h = location.hash.replace(/^#\/?/, '') || 'list';
    const [page, param] = h.split('/');
    // 侧栏激活态
    document.querySelectorAll('.nav-item').forEach(a => a.classList.toggle('active', a.dataset.route === page));
    // 面包屑
    const crumb = document.getElementById('crumb');
    if (crumb) crumb.textContent = PAGE_TITLES[page] || '流程列表';
    if (page === 'list') renderList();
    else if (page === 'dashboard') renderDashboard();
    else if (page === 'reviews') renderReviews();
    else if (page === 'editor') renderEditor(param);
    else renderList();
  }
  window.addEventListener('hashchange', route);

  // ===== 列表 =====
  async function renderList() {
    $('#app').innerHTML = '<div class="card"><div class="empty">加载中…</div></div>';
    try {
      const r = await DDW.api.get('/flows');
      const list = (r.ok && Array.isArray(r.data)) ? r.data : [];
      $('#app').innerHTML = `
        <div class="card">
          <div class="card-head">
            <div class="card-title">流程列表（${list.length}）</div>
            <div><a class="btn primary" href="#/editor/new">＋ 新建流程</a></div>
          </div>
          <table>
            <thead><tr><th>流程名</th><th>作用域</th><th>状态</th><th>版本</th><th>启用</th><th>调用</th><th>最后运行</th><th>操作</th></tr></thead>
            <tbody>${list.map(f => `
              <tr>
                <td><b>${f.name}</b>${f.description ? '<div style="font-size:11px;color:var(--text-muted)">' + f.description.slice(0,40) + '</div>' : ''}</td>
                <td>${f.scope === 'cross_department' ? '<span class="tag warn">跨部门</span>' : '<span class="tag muted">部门级</span>'}</td>
                <td>${statusTag(f.status)}</td>
                <td>v${f.version}</td>
                <td>${f.is_enabled ? '<span class="tag ok">启用</span>' : '<span class="tag muted">停用</span>'}</td>
                <td>${f.total_runs}</td>
                <td>${f.last_run_at ? fmtTime(f.last_run_at) : '-'}</td>
                <td>
                  <button class="btn sm" onclick="location.hash='#/editor/'+${f.id}">编辑</button>
                  <button class="btn sm" data-run="${f.id}" data-name="${f.name}">执行</button>
                  ${f.is_enabled
                    ? '<button class="btn sm" data-disable="' + f.id + '">停用</button>'
                    : (f.status !== 'draft' && f.status !== 'pending_review' ? '<button class="btn sm" data-enable="' + f.id + '">启用</button>' : '')}
                  ${(f.status === 'deprecated') ? '<button class="btn sm danger" data-del="' + f.id + '">删除</button>' : ''}
                </td>
              </tr>`).join('') || '<tr><td colspan="8" class="empty">暂无流程，点击右上角「新建流程」创建第一个协作流程</td></tr>'}
            </tbody>
          </table>
        </div>`;
      // 事件绑定
      document.querySelectorAll('[data-run]').forEach(b => b.addEventListener('click', async () => {
        if (!confirm('执行流程「' + b.dataset.name + '」？将按节点顺序调用 LLM。')) return;
        b.disabled = true; b.textContent = '执行中…';
        try {
          const r = await DDW.api.post('/flows/' + b.dataset.run + '/run', { inputs: {} });
          if (r.ok && r.data) {
            const d = r.data;
            const resultsHtml = Object.entries(d.results || {}).map(([k, v]) => '<div><b>' + k + '</b>: ' + String(v).slice(0, 200) + '</div>').join('\n');
            alert('执行' + (d.status === 'success' ? '成功' : '失败') + '（' + d.duration_ms + 'ms）\n\n' + resultsHtml.slice(0, 800));
          } else { toast('执行失败：' + (r.message || '未知'), 'err'); }
        } catch (e) { toast('执行失败：' + e.message, 'err'); }
        b.disabled = false; b.textContent = '执行';
        route();
      }));
      document.querySelectorAll('[data-disable]').forEach(b => b.addEventListener('click', async () => {
        try { await DDW.api.put('/flows/' + b.dataset.disable + '/disable'); toast('已停用'); route(); } catch (e) { toast('失败：' + e.message, 'err'); }
      }));
      document.querySelectorAll('[data-enable]').forEach(b => b.addEventListener('click', async () => {
        try { await DDW.api.put('/flows/' + b.dataset.enable + '/enable'); toast('已启用'); route(); } catch (e) { toast('失败：' + e.message, 'err'); }
      }));
      document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
        if (!confirm('确定删除该流程？仅停用≥12个月可删。')) return;
        try { await DDW.api.del('/flows/' + b.dataset.del); toast('已删除'); route(); } catch (e) { toast('失败：' + e.message, 'err'); }
      }));
    } catch (e) {
      $('#app').innerHTML = '<div class="card"><div class="empty">加载失败：' + e.message + '</div></div>';
    }
  }

  // ===== 看板 =====
  async function renderDashboard() {
    $('#app').innerHTML = '<div class="card"><div class="empty">加载中…</div></div>';
    try {
      const r = await DDW.api.get('/flows/stats');
      const d = (r.ok && r.data) ? r.data : {};
      const items = d.items || [];
      $('#app').innerHTML = `
        <div class="stats">
          <div class="stat"><div class="v">${d.total || 0}</div><div class="l">流程总数</div></div>
          <div class="stat"><div class="v">${d.enabled || 0}</div><div class="l">启用中</div></div>
          <div class="stat"><div class="v">${d.published || 0}</div><div class="l">已发布</div></div>
          <div class="stat"><div class="v">${d.total_runs || 0}</div><div class="l">累计执行</div></div>
          <div class="stat"><div class="v">${d.monthly_runs || 0}</div><div class="l">本月执行</div></div>
        </div>
        <div class="card">
          <div class="card-head"><div class="card-title">全公司流程统计（只读）</div></div>
          <table>
            <thead><tr><th>流程</th><th>状态</th><th>版本</th><th>累计执行</th><th>本月</th><th>平均时长</th><th>最后运行</th></tr></thead>
            <tbody>${items.map(f => `
              <tr><td><b>${f.name}</b></td><td>${statusTag(f.status)}</td><td>v${f.version}</td>
              <td>${f.total_runs}</td><td>${f.monthly_runs}</td><td>${f.avg_duration_ms ? f.avg_duration_ms + 'ms' : '-'}</td>
              <td>${f.last_run_at ? fmtTime(f.last_run_at) : '-'}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">暂无数据</td></tr>'}
            </tbody>
          </table>
        </div>`;
    } catch (e) {
      $('#app').innerHTML = '<div class="card"><div class="empty">加载失败：' + e.message + '</div></div>';
    }
  }

  // ===== 审核 =====
  async function renderReviews() {
    $('#app').innerHTML = '<div class="card"><div class="empty">加载中…</div></div>';
    try {
      const r = await DDW.api.get('/flows/pending-reviews');
      const list = (r.ok && Array.isArray(r.data)) ? r.data : [];
      $('#app').innerHTML = `
        <div class="card">
          <div class="card-head"><div class="card-title">待审核流程（${list.length}）</div></div>
          <table>
            <thead><tr><th>流程</th><th>版本</th><th>操作</th></tr></thead>
            <tbody>${list.map(rv => `
              <tr>
                <td><b>${rv.flow_name}</b></td>
                <td>v${rv.version}</td>
                <td>
                  <button class="btn sm primary" data-approve="${rv.review_id}" data-flow="${rv.flow_id}">通过</button>
                  <button class="btn sm danger" data-reject="${rv.review_id}" data-flow="${rv.flow_id}">拒绝</button>
                </td>
              </tr>`).join('') || '<tr><td colspan="3" class="empty">暂无待审核流程</td></tr>'}
            </tbody>
          </table>
        </div>`;
      document.querySelectorAll('[data-approve]').forEach(b => b.addEventListener('click', async () => {
        try { await DDW.api.post('/flows/' + b.dataset.flow + '/reviews/' + b.dataset.approve, { action: 'approve', comment: '' }); toast('已通过，流程发布'); route(); } catch (e) { toast('失败：' + e.message, 'err'); }
      }));
      document.querySelectorAll('[data-reject]').forEach(b => b.addEventListener('click', async () => {
        const c = prompt('拒绝原因：');
        try { await DDW.api.post('/flows/' + b.dataset.flow + '/reviews/' + b.dataset.reject, { action: 'reject', comment: c || '' }); toast('已拒绝'); route(); } catch (e) { toast('失败：' + e.message, 'err'); }
      }));
    } catch (e) {
      $('#app').innerHTML = '<div class="card"><div class="empty">加载失败：' + e.message + '</div></div>';
    }
  }

  // ===== 编辑器 =====
  async function renderEditor(idOrNew) {
    const isNew = idOrNew === 'new';
    const app = $('#app');
    app.className = 'page';
    app.style.cssText = 'padding:0;overflow:hidden;';
    app.innerHTML = `
      <div class="editor">
        <div class="ed-palette">
          <div class="pt">节点类型（拖入画布）</div>
          <div class="pal-item" draggable="true" data-type="start">▶️ 开始</div>
          <div class="pal-item" draggable="true" data-type="agent">🤖 数字员工</div>
          <div class="pal-item" draggable="true" data-type="skill">⚡ Skill</div>
          <div class="pal-item" draggable="true" data-type="condition">🔀 条件判断</div>
          <div class="pal-item" draggable="true" data-type="parallel">🔗 并行</div>
          <div class="pal-item" draggable="true" data-type="merge">🔀 合并</div>
          <div class="pal-item" draggable="true" data-type="end">⏹️ 结束</div>
        </div>
        <div class="ed-canvas" id="canvas">
          <div class="ed-toolbar">
            <button class="btn sm primary" id="btnSave">保存草稿</button>
            <button class="btn sm" id="btnPublish">发布</button>
            <button class="btn sm" id="btnRun">执行</button>
            <button class="btn sm" id="btnVersions">版本历史</button>
            <a class="btn sm" href="#/list">返回列表</a>
          </div>
          <svg class="lines" id="lines"></svg>
          <div class="ed-status" id="edStatus">草稿</div>
        </div>
        <div class="ed-props" id="props">
          <div class="pt" style="color:var(--text-muted);font-size:12px">属性面板</div>
          <div id="propsBody"><p style="color:var(--text-muted);font-size:12.5px">选中节点后在此编辑配置</p></div>
        </div>
      </div>`;

    const canvas = $('#canvas');
    const lines = $('#lines');
    const state = { nodes: [], edges: [], selected: null, linkingFrom: null, nextId: 1 };
    let isNewFlag = isNew;

    // 加载已有流程
    async function load() {
      if (isNewFlag) { updateStatus(); return; }
      try {
        const r = await DDW.api.get('/flows/' + idOrNew);
        if (r.ok && r.data) {
          const d = r.data;
          CURRENT = d;
          state.nodes = (d.dag && d.dag.nodes) || [];
          state.edges = (d.dag && d.dag.edges) || [];
          state.nextId = state.nodes.length + 1;
          const st = $('#edStatus');
          if (st) st.textContent = d.name + ' · v' + d.version + ' · ' + d.status;
          renderNodes();
        }
      } catch (e) { toast('加载失败：' + e.message, 'err'); }
    }

    function renderNodes() {
      const old = canvas.querySelectorAll('.flow-node');
      old.forEach(n => n.remove());
      const svgLines = $('#lines');
      if (svgLines) svgLines.innerHTML = '';
      state.nodes.forEach(n => drawNode(n));
      drawEdges();
    }

    function drawNode(n) {
      const div = document.createElement('div');
      div.className = 'flow-node' + (state.selected === n.id ? ' selected' : '');
      div.dataset.id = n.id;
      div.style.left = n.x + 'px';
      div.style.top = n.y + 'px';
      const typeIcon = { start: '▶️', agent: '🤖', skill: '⚡', condition: '🔀', parallel: '🔗', merge: '⚡', end: '⏹️' }[n.type] || '📄';
      div.innerHTML = `
        <div class="n-type">${typeIcon} ${n.type}</div>
        <div class="n-name">${(n.data && n.data.name) || n.label || n.type}</div>
        <div class="n-actions">
          <button title="连线" data-link="1">↗</button>
          <button title="删除" data-del="1">×</button>
        </div>`;
      // 拖动
      let dragging = false, offX = 0, offY = 0;
      div.addEventListener('mousedown', (e) => {
        if (e.target.closest('.n-actions')) return;
        dragging = true; offX = e.clientX - div.offsetLeft; offY = e.clientY - div.offsetTop;
        selectNode(n.id);
        e.preventDefault();
      });
      document.addEventListener('mousemove', (e) => {
        if (!dragging) return;
        const rect = canvas.getBoundingClientRect();
        n.x = Math.max(0, e.clientX - rect.left - offX);
        n.y = Math.max(0, e.clientY - rect.top - offY);
        div.style.left = n.x + 'px'; div.style.top = n.y + 'px';
        drawEdges();
      });
      document.addEventListener('mouseup', () => { dragging = false; });
      // 连线模式
      div.querySelector('[data-link]').addEventListener('click', (e) => {
        e.stopPropagation();
        if (!state.linkingFrom) { state.linkingFrom = n.id; div.classList.add('linking'); toast('请点击目标节点完成连线'); }
        else if (state.linkingFrom === n.id) { state.linkingFrom = null; div.classList.remove('linking'); }
        else {
          addEdge(state.linkingFrom, n.id);
          state.linkingFrom = null;
          document.querySelectorAll('.flow-node').forEach(x => x.classList.remove('linking'));
        }
      });
      div.querySelector('[data-del]').addEventListener('click', (e) => {
        e.stopPropagation();
        state.nodes = state.nodes.filter(x => x.id !== n.id);
        state.edges = state.edges.filter(x => x.source !== n.id && x.target !== n.id);
        if (state.selected === n.id) { state.selected = null; $('#propsBody').innerHTML = '<p style="color:var(--text-muted);font-size:12.5px">选中节点后在此编辑配置</p>'; }
        renderNodes(); updateStatus();
      });
      canvas.appendChild(div);
    }

    function addEdge(source, target) {
      if (source === target) { toast('不能连接自身', 'err'); return; }
      if (state.edges.some(e => e.source === source && e.target === target)) { toast('连线已存在'); return; }
      state.edges.push({ id: 'e' + (state.edges.length + 1), source: source, target: target });
      drawEdges(); updateStatus();
    }

    function drawEdges() {
      const svg = $('#lines');
      if (!svg) return;
      svg.innerHTML = '';
      const rect = canvas.getBoundingClientRect();
      state.edges.forEach(e => {
        const s = document.querySelector('.flow-node[data-id="' + e.source + '"]');
        const t = document.querySelector('.flow-node[data-id="' + e.target + '"]');
        if (!s || !t) return;
        const sx = parseFloat(s.style.left) + s.offsetWidth / 2, sy = parseFloat(s.style.top) + s.offsetHeight;
        const tx = parseFloat(t.style.left) + t.offsetWidth / 2, ty = parseFloat(t.style.top);
        const mid = (sy + ty) / 2;
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', 'M' + sx + ',' + sy + ' C' + sx + ',' + mid + ' ' + tx + ',' + mid + ' ' + tx + ',' + ty);
        path.setAttribute('stroke', '#94a3b8'); path.setAttribute('stroke-width', '2'); path.setAttribute('fill', 'none');
        path.setAttribute('marker-end', 'url(#arrow)');
        svg.appendChild(path);
        // 分支标签（条件 yes/no）
        if (e.label) {
          const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          lbl.setAttribute('x', (sx + tx) / 2); lbl.setAttribute('y', mid - 6);
          lbl.setAttribute('text-anchor', 'middle'); lbl.setAttribute('font-size', '11');
          lbl.setAttribute('fill', e.label === 'yes' ? '#16a34a' : '#e5484d');
          lbl.textContent = e.label;
          svg.appendChild(lbl);
        }
        const endDot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        endDot.setAttribute('cx', tx); endDot.setAttribute('cy', ty); endDot.setAttribute('r', '3');
        endDot.setAttribute('fill', '#1890FF');
        svg.appendChild(endDot);
      });
    }

    function selectNode(id) {
      state.selected = id;
      document.querySelectorAll('.flow-node').forEach(x => x.classList.toggle('selected', x.dataset.id === id));
      const n = state.nodes.find(x => x.id === id);
      if (!n) return;
      const isCondition = n.type === 'condition';
      const isParallel = n.type === 'parallel';
      // 出边标签编辑（条件分支 yes/no 用）
      const outEdges = state.edges.filter(e => e.source === id);
      const edgeEditors = outEdges.map(e => {
        const target = state.nodes.find(x => x.id === e.target);
        const opts = ['', 'yes', 'no'].map(v => '<option value="' + v + '"' + (e.label === v ? ' selected' : '') + '>' + (v || '默认') + '</option>').join('');
        return '<div style="display:flex;align-items:center;gap:6px;margin-top:4px"><span style="flex:1;font-size:12px;color:var(--text-secondary)">→ ' + (target ? target.data.name || target.type : e.target) + '</span><select data-edge="' + e.id + '" style="width:80px">' + opts + '</select></div>';
      }).join('');
      $('#propsBody').innerHTML = `
        <label>节点类型</label><input value="${n.type}" disabled>
        <label>名称</label><input id="p_name" value="${escapeHtml((n.data && n.data.name) || '')}">
        ${isCondition ? '<label>条件表达式（contains:关键词 / not contains:关键词）</label><input id="p_cond" value="' + escapeHtml((n.data && n.data.condition) || '') + '" placeholder="contains:紧急">' : ''}
        <label>执行指令（Prompt）</label><textarea id="p_prompt" rows="4">${escapeHtml((n.data && n.data.prompt) || '')}</textarea>
        ${outEdges.length ? '<label style="margin-top:12px">下游连线分支</label>' + edgeEditors : ''}`;
      $('#p_name').addEventListener('input', (e) => { n.data = n.data || {}; n.data.name = e.target.value; updateNodeLabel(n); });
      $('#p_prompt').addEventListener('input', (e) => { n.data = n.data || {}; n.data.prompt = e.target.value; });
      if ($('#p_cond')) $('#p_cond').addEventListener('input', (e) => { n.data = n.data || {}; n.data.condition = e.target.value; });
      document.querySelectorAll('[data-edge]').forEach(sel => sel.addEventListener('change', (e) => {
        const edge = state.edges.find(x => x.id === e.target.dataset.edge);
        if (edge) { edge.label = e.target.value; drawEdges(); updateStatus(); }
      }));
    }

    function updateNodeLabel(n) {
      const el = document.querySelector('.flow-node[data-id="' + n.id + '"] .n-name');
      if (el) el.textContent = (n.data && n.data.name) || n.type;
    }

    function escapeHtml(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

    function updateStatus() {
      const st = $('#edStatus');
      if (st) st.textContent = '节点 ' + state.nodes.length + ' · 连线 ' + state.edges.length;
    }

    // 拖入节点
    document.querySelectorAll('.pal-item').forEach(item => {
      item.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', item.dataset.type); });
    });
    canvas.addEventListener('dragover', (e) => e.preventDefault());
    canvas.addEventListener('drop', (e) => {
      e.preventDefault();
      const type = e.dataTransfer.getData('text/plain');
      if (!type) return;
      const rect = canvas.getBoundingClientRect();
      const n = {
        id: 'n' + (state.nextId++),
        type: type,
        x: Math.max(10, e.clientX - rect.left - 60),
        y: Math.max(10, e.clientY - rect.top - 25),
        data: { name: { start: '开始', agent: '数字员工', skill: 'Skill', condition: '条件判断', parallel: '并行', merge: '合并', end: '结束' }[type] || type, prompt: '' },
      };
      state.nodes.push(n);
      drawNode(n);
      drawEdges();
      updateStatus();
      selectNode(n.id);
    });

    function currentDag() {
      return { nodes: state.nodes, edges: state.edges };
    }

    // 保存
    $('#btnSave').addEventListener('click', async () => {
      const name = CURRENT ? CURRENT.name : (prompt('流程名称：') || '未命名流程');
      const dag = currentDag();
      if (!dag.nodes.length) { toast('画布为空，先拖入节点', 'err'); return; }
      try {
        if (isNewFlag) {
          const r = await DDW.api.post('/flows', { name: name, description: '', scope: 'department', dag_json: dag });
          if (r.ok && r.data) { toast('草稿已保存'); isNewFlag = false; CURRENT = r.data; location.hash = '#/editor/' + r.data.id; route(); }
          else toast('保存失败：' + (r.message || ''), 'err');
        } else {
          const r = await DDW.api.put('/flows/' + idOrNew, { dag_json: dag });
          if (r.ok) { toast('草稿已保存'); CURRENT = r.data; }
          else toast('保存失败：' + (r.message || ''), 'err');
        }
      } catch (e) { toast('保存失败：' + e.message, 'err'); }
    });

    // 发布
    $('#btnPublish').addEventListener('click', async () => {
      if (isNewFlag) { toast('请先保存草稿再发布', 'err'); return; }
      const scope = confirm('跨部门流程（需部门审核）？\n\n确定=跨部门（进入审核）\n取消=部门级（直接发布）');
      let deptIds = null;
      if (scope) {
        try {
          const dr = await DDW.api.get('/org/departments');
          const depts = (dr.ok && Array.isArray(dr.data)) ? dr.data : [];
          const hint = depts.length
            ? '可用部门：\n' + depts.map(d => d.id + '=' + d.name).join('、') + '\n\n'
            : '';
          const input = prompt(hint + '需审核的部门 ID（逗号分隔；留空=公司级单审）：');
          if (input === null) return;
          deptIds = input.trim() ? input.split(/[,，]/).map(x => parseInt(x, 10)).filter(x => !isNaN(x)) : [0];
        } catch (e) { deptIds = [0]; }
        try { await DDW.api.put('/flows/' + idOrNew, { scope: 'cross_department' }); } catch (e) {}
      }
      const changelog = prompt('版本说明（可选）：') || '';
      try {
        const r = await DDW.api.post('/flows/' + idOrNew + '/publish', { changelog: changelog, department_ids: deptIds });
        if (r.ok && r.data) {
          toast(r.data.status === 'pending_review' ? '已提交审核（' + (deptIds ? deptIds.length : 1) + ' 个部门）' : '已发布 v' + r.data.version);
          setTimeout(() => route(), 600);
        } else toast('发布失败：' + (r.message || ''), 'err');
      } catch (e) { toast('发布失败：' + e.message, 'err'); }
    });

    // 执行
    $('#btnRun').addEventListener('click', async () => {
      if (isNewFlag) { toast('请先保存', 'err'); return; }
      if (!confirm('执行当前流程？将按节点顺序调用 LLM。')) return;
      try {
        const r = await DDW.api.post('/flows/' + idOrNew + '/run', { inputs: {} });
        if (r.ok && r.data) {
          const d = r.data;
          const html = Object.entries(d.results || {}).map(([k, v]) => '<div style="margin-bottom:6px"><b style="color:var(--brand)">' + k + '</b><div>' + escapeHtml(String(v).slice(0, 300)) + '</div></div>').join('');
          $('#propsBody').innerHTML = '<div class="pt" style="color:var(--text-muted);font-size:12px">执行结果（' + (d.status === 'success' ? '成功' : '失败') + ' · ' + d.duration_ms + 'ms）</div><div class="run-result">' + (html || '<p>无输出</p>') + (d.error ? '<p style="color:var(--danger)">' + escapeHtml(d.error) + '</p>' : '') + '</div>';
          toast('执行完成');
        } else toast('执行失败：' + (r.message || ''), 'err');
      } catch (e) { toast('执行失败：' + e.message, 'err'); }
    });

    // 版本历史
    $('#btnVersions').addEventListener('click', async () => {
      if (isNewFlag) { toast('尚未保存', 'err'); return; }
      try {
        const r = await DDW.api.get('/flows/' + idOrNew + '/versions');
        const list = (r.ok && Array.isArray(r.data)) ? r.data : [];
        $('#propsBody').innerHTML = '<div class="pt" style="color:var(--text-muted);font-size:12px">版本历史（' + list.length + '）</div>' +
          list.map(v => '<div style="font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--border-light)"><b>v' + v.version + '</b> <span style="color:var(--text-muted)">' + fmtTime(v.published_at) + '</span><div style="color:var(--text-secondary);font-size:11.5px">' + (v.changelog || '—') + '</div></div>').join('') ||
          '<p style="color:var(--text-muted);font-size:12px">暂无版本</p>';
      } catch (e) { toast('加载失败：' + e.message, 'err'); }
    });

    load();
  }

  // ===== 初始化 =====
  async function init() {
    try {
      const r = await DDW.api.get('/auth/me');
      if (r.ok && r.data) {
        ME = r.data;
        const u = ME.user || {};
        const name = u.name || '?';
        const phoneTail = u.phone ? u.phone.slice(-6) : '';
        const display = name + (phoneTail ? ' · ' + phoneTail : '');
        $('#userChip').innerHTML =
          '<span class="user-avatar">' + name.charAt(0) + '</span>' +
          '<b>' + display + '</b>' +
          '<a href="/pal.html">DDW Pal</a>' +
          '<a href="javascript:void(0)" id="btnLogout">退出</a>';
        $('#btnLogout').addEventListener('click', () => { localStorage.clear(); location.href = '/index.html'; });
      }
    } catch (e) {}
    route();
  }
  init();
})();
</script>
</body>
</html>
