# DDW Token Manager Plugin - 插件元数据
# 基于 One API (songquanpeng/one-api) 额度管理系统
name: ddw-token-manager
tier: core
version: 0.1.0
description: "DDW AI Hub Token额度管理插件 — 预消费/后消费机制 + 校准反算 + 订阅感知路由"
author: "DDW Team"
license: free
engine: ">=2.0.0"
isolation: inline

# 插件依赖
dependencies:
  python:
    - "sqlalchemy[asyncio]>=2.0.0"
    - "pydantic>=2.0.0"
    - "pyyaml>=6.0"
    - "fastapi>=0.100.0"
  plugins: []

# 插件权限
permissions:
  - database    # 需要访问数据库
  - config      # 需要读取配置
  - events      # 需要发布/订阅事件

# 插件配置项
config_schema:
  pre_consumed_quota:
    type: integer
    default: 500
    description: "预消费基础额度（对应 One API config.PreConsumedQuota）"
  batch_update_interval:
    type: integer
    default: 30
    description: "批量更新刷写间隔（秒）"
  quota_remind_threshold:
    type: integer
    default: 1000000
    description: "额度提醒阈值（低于此值发送提醒）"
  calibration_tolerance:
    type: float
    default: 0.05
    description: "校准收敛容忍度（连续两次K变化<5%视为收敛）"
