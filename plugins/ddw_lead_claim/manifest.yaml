name: ddw-lead-claim
license: commercial
tier: core
version: 1.0.0
display_name: DDW 客户报备与归属
description: 销售端客户报备与归属保护机制。渠道/销售对客户企业的保护期占位：默认 60 天，自动计算 expire_at；list/get/conflict/stats 等 read 操作前自动标记过期；支持主动释放、冲突查询（按企业）、按 partner 聚合统计。关联 crm_companies (P0-1) + crm_partners (P2-1)。
engine: plugin_base
isolation: inline

permissions:
  - database.read
  - database.write

dependencies:
  plugins:
    - ddw-company-profile
    - ddw-partner-directory

config_schema:
  type: object
  properties:
    default_tenant_id:
      type: integer
      default: 1
    default_page_size:
      type: integer
      default: 20
    default_protection_days:
      type: integer
      default: 60
      description: 默认保护期天数（创建报备时未指定则使用）
    max_protection_days:
      type: integer
      default: 365
      description: 保护期天数上限（防止误传过大值）
    statuses:
      type: array
      default: [active, expired, won, lost, released]
      description: 报备状态枚举

router_prefix: /api/v1/plugins/ddw-lead-claim
