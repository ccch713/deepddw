name: ddw-renewal
license: commercial
tier: core
version: 1.0.0
display_name: DDW 续费与预警
description: 销售端 CRM 续费管理插件。跨插件查询 crm_licenses 与 crm_contracts，提供即将到期（30/60/90天）/已逾期许可证清单、续费报价估算、续费率统计等指标。
engine: plugin_base
isolation: inline

permissions:
  - database.read

dependencies:
  plugins:
    - ddw-company-profile
    - ddw-license-core
    - ddw-contract-core

config_schema:
  type: object
  properties:
    default_tenant_id:
      type: integer
      default: 1
    expiring_windows_days:
      type: array
      default: [30, 60, 90]
      description: 续费统计概览的到期窗口（天）
    renewal_rate_windows_days:
      type: array
      default: [30, 60, 90]
      description: 续费率分子分母时间窗（最近 N 天内续费数 / 最近 N 天内到期数）
    default_renewal_unit_days:
      type: integer
      default: 365
      description: 续费报价默认时长（天），当无法从历史合同推导时使用

router_prefix: /api/v1/plugins/ddw-renewal
