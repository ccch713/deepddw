name: ddw-business-metrics
license: commercial
tier: core
version: 0.1.0
display_name: DDW 业务指标仪表盘
description: 纯只读聚合查询插件。从现有表聚合 MRR / WAU / 插件使用率 / 转化漏斗 / Token 消耗等核心业务指标。
engine: plugin_base
isolation: inline

permissions:
  - database.read

dependencies:
  plugins: {}

config_schema:
  type: object
  properties:
    default_tenant_id:
      type: integer
      default: 1
    mrr_default_months:
      type: integer
      default: 6
      description: MRR 趋势接口默认回看月数
    wau_default_weeks:
      type: integer
      default: 8
      description: WAU 趋势接口默认回看周数
    plugins_top_limit:
      type: integer
      default: 10
      description: 插件使用率 Top 接口默认条数

router_prefix: /api/v1/plugins/ddw-business-metrics
