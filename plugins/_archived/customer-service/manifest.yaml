# DDW AI Customer Service Plugin
# 版本: 2.0.0 (符合 DDW 平台插件开发规范)
# 作者: DDW Team
# 许可: Commercial (200次免费试用, 99元/永久)

name: customer-service
version: 2.0.0
description: |
  DDW AI 智能客服插件 - 基于 RAG 的企业知识库问答系统
  
  功能特性:
  - 支持多种知识库格式 (Markdown, YAML, TXT, JSON)
  - 混合检索（向量 + 关键字 + 重排序）
  - 意图识别和情绪检测
  - 多轮对话管理
  - 人工转接机制
  - 200次免费试用, 99元永久使用
  
  适用场景:
  - 企业官网在线客服
  - 产品技术支持
  - 售前咨询
  - 内部知识问答

author: DDW Team
license: Commercial
homepage: https://ddw-ai.com
repository: https://github.com/ddw-ai/customer-service-plugin

# 插件配置（通过 ConfigManager 管理）
config:
  # 知识库配置
  knowledge:
    directory: "./knowledge"
    file_extensions: [".md", ".yaml", ".yml", ".txt", ".json"]
    chunk_size: 500
    chunk_overlap: 50
  
  # 对话配置
  chat:
    welcome_message: "你好！我是 DDW AI 客服，有什么可以帮您的？"
    max_history: 20
    timeout: 30
    rate_limit: 10
  
  # 授权配置
  license:
    type: trial
    trial_limit: 200
    price: 99

# 权限声明
permissions:
  - filesystem
  - network
  - compute

# 依赖（复用平台能力）
dependencies: []

# 最低 DDW 版本
min_platform_version: "0.1.0"
