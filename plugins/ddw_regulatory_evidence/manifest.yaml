name: ddw-regulatory-evidence
tier: beta
version: 1.0.0
description: "DDW 法规证据索引 — NHC/EU Novel Food/EFSA/FDA法规条款检索与证据链管理"
author: "DDW Team"
license: commercial
type: plugin
adapter:
  type: "quality"
  vendor: "ddw"
  protocol: "internal"
dependencies:
  plugins:
    ddw-core: ">=2.0.0"
config:
