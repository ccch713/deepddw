<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0f24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/ui/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/ui/assets/logo-ju.svg">
<title>deepDDW · 启动</title>
<style>
:root{
  --bg-base:#050816;--bg-page:#0a0f24;--bg-card:#111a3a;--bg-input:#0d1330;
  --text-primary:#e8ecf8;--text-secondary:#a8b3d0;--text-muted:#6b7899;
  --brand:#00e5ff;--brand-hover:#33ecff;--accent-green:#00ff9d;
  --border:#233052;--border-hover:#00e5ff;--danger:#ff5c5c;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg-page);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:36px 28px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,229,255,.08)}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.logo img{width:34px;height:34px}
h1{font-size:22px;font-weight:800;letter-spacing:.5px}
.sub{color:var(--text-muted);font-size:13px;margin-bottom:28px;line-height:1.6}
label{display:block;font-size:13px;color:var(--text-secondary);margin:16px 0 6px}
input{width:100%;height:46px;background:var(--bg-input);border:1px solid var(--border);border-radius:12px;color:var(--text-primary);padding:0 14px;font-size:15px;outline:none;transition:border-color .2s}
input:focus{border-color:var(--border-hover)}
.hint{font-size:12px;color:var(--text-muted);margin-top:6px}
.btn{width:100%;height:48px;border:none;border-radius:12px;background:linear-gradient(135deg,#00e5ff,#0099ff);color:#04121f;font-size:16px;font-weight:700;cursor:pointer;margin-top:24px;transition:opacity .2s}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:not(:disabled):active{opacity:.85}
.msg{margin-top:14px;font-size:13px;min-height:20px}
.msg.err{color:var(--danger)}
.msg.ok{color:var(--accent-green)}
.pair{margin-top:16px;padding:14px;border:1px dashed var(--border,#888);border-radius:12px;text-align:center}
.pair-title{font-size:13px;font-weight:600;margin-bottom:10px}
.qrcode{display:flex;justify-content:center;align-items:center;min-height:120px}
.qrcode svg{width:180px;height:180px;border-radius:8px;background:#fff;padding:6px}
.qrcode a{display:inline-block;padding:10px 14px;border-radius:8px;background:#fff;border:1px solid var(--border,#888);color:var(--text,#333);font-size:12px;text-decoration:none;word-break:break-all;max-width:100%}
footer{margin-top:22px;text-align:center;font-size:11.5px;color:var(--text-muted)}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><img src="/ui/assets/logo-ju.svg" alt="deepDDW"><h1>deepDDW 启动器</h1></div>
  <p class="sub">局域网内免 Token 直连；外网访问需 Token。<br>Token 仅存于本机会话，绝不写入 iframe URL。</p>

  <label for="addr">服务器地址</label>
  <input id="addr" type="url" placeholder="http://192.168.1.10:8500" autocomplete="off">
  <div class="hint">留空 = 当前服务器（手机浏览器默认场景）</div>

  <label for="token">访问 Token（局域网内可留空）</label>
  <input id="token" type="password" placeholder="外网访问才需要" autocomplete="off">

  <label for="dsh">工作台地址（dsh 原版界面）</label>
  <input id="dsh" type="url" placeholder="http://127.0.0.1:3080" autocomplete="off">
  <div class="hint">dsh 引擎地址，默认本机 3080；可通过 ?dsh= 参数预填</div>

  <button class="btn" id="connect">进入工作台</button>
  <div class="msg" id="msg"></div>

  <div id="pairArea" class="pair" style="display:none">
    <div class="pair-title">手机扫码自动填入（电脑端显示）</div>
    <div id="qrcode" class="qrcode"></div>
    <div class="hint" id="pairHint"></div>
  </div>

  <footer>deepDDW 0.1 · 开源个人 AI 底座</footer>
</div>

<script>
(function () {
  "use strict";
  var btn = document.getElementById("connect");
  var msg = document.getElementById("msg");
  var addrEl = document.getElementById("addr");
  var tokenEl = document.getElementById("token");
  var dshEl = document.getElementById("dsh");

  // URL 参数预填（手机分享链接场景）：?token=xxx / ?server=xxx / ?dsh=xxx
  // 优先级高于 localStorage/sessionStorage（新链接优先，避免旧值覆盖）
  // ⚠️ 预填后立即从地址栏清除 token（replaceState），防止 token 留在 URL/历史中
  try {
    var qp = new URLSearchParams(window.location.search);
    var urlToken = (qp.get("token") || "").trim();
    var urlServer = (qp.get("server") || "").trim();
    var urlDsh = (qp.get("dsh") || "").trim();
    if (urlToken) tokenEl.value = urlToken;
    if (urlServer) addrEl.value = urlServer;
    if (urlDsh) dshEl.value = urlDsh;
    if (urlToken || urlServer || urlDsh) {
      qp.delete("token");
      qp.delete("server");
      qp.delete("dsh");
      var clean = window.location.pathname + (qp.toString() ? "?" + qp.toString() : "");
      window.history.replaceState({}, "", clean);
    }
  } catch (e) { /* 忽略解析失败 */ }

  // 恢复上次地址/token（仅本机 localStorage，用户可清除）
  try {
    if (!urlServer && localStorage.getItem("deepddw_addr")) addrEl.value = localStorage.getItem("deepddw_addr");
    if (!urlToken && sessionStorage.getItem("deepddw_token")) tokenEl.value = sessionStorage.getItem("deepddw_token");
    if (!urlDsh && localStorage.getItem("deepddw_dsh")) dshEl.value = localStorage.getItem("deepddw_dsh");
  } catch (e) { /* 隐私模式忽略 */ }

  function baseAddr() {
    var v = addrEl.value.trim().replace(/\/+$/, "");
    return v || window.location.origin;
  }

  btn.addEventListener("click", async function () {
    var token = tokenEl.value.trim();
    var base = baseAddr();
    if (!/^https?:\/\//.test(base)) { msg.className = "msg err"; msg.textContent = "地址需以 http(s):// 开头"; return; }

    btn.disabled = true; btn.textContent = "连接中…";
    msg.className = "msg"; msg.textContent = "";
    try {
      // 第一步：无 Token 试连（局域网免密模式，体验优化 A）——
      // 内网请求服务端自动放行，无需 Token，手机连 WiFi 直接进。
      var resp = await fetch(base + "/api/v1/gateway/verify", {
        headers: token ? { "X-DDW-Token": token } : {},
      });
      if (resp.status === 401 && token) {
        // 带了 Token 仍 401：Token 错，提示并给扫码配对
        msg.className = "msg err"; msg.textContent = "Token 无效或已过期（401）";
        showPair(base);
        return;
      }
      if (resp.status === 401 && !token) {
        // 无 Token 且不在免密范围（如外网）：需要 Token，给扫码配对
        msg.className = "msg err"; msg.textContent = "需要访问 Token（外网访问）";
        showPair(base);
        return;
      }
      if (!resp.ok) { msg.className = "msg err"; msg.textContent = "网关校验失败（HTTP " + resp.status + "）"; return; }
      var data = await resp.json();
      if (data.authenticated !== true) { msg.className = "msg err"; msg.textContent = "网关未放行"; return; }
      // 通过 → 放行（token 可能为空=LAN 免密；非空才存会话）
      try {
        if (token) sessionStorage.setItem("deepddw_token", token);
        localStorage.setItem("deepddw_addr", base);
      } catch (e) { /* ignore */ }
      msg.className = "msg ok"; msg.textContent = "连接成功 ✓";
      enterWorkbench(base, token);
    } catch (e) {
      msg.className = "msg err"; msg.textContent = "无法连接服务器：" + e.message;
    } finally {
      btn.disabled = false; btn.textContent = "进入工作台";
    }
  });

  // 体验优化 C：扫码配对——调 /api/v1/gateway/pair 拿带 Token 的 URL，渲染二维码。
  // 手机扫这个码打开链接，URL 参数自动预填 Token（launcher 已支持 ?token=），
  // 免去手输长 Token。仅局域网内可调（pair 端点同样过 LAN 免密/Token 门禁）。
  function showPair(base) {
    var area = document.getElementById("pairArea");
    var hint = document.getElementById("pairHint");
    var qr = document.getElementById("qrcode");
    area.style.display = "block";
    hint.textContent = "请在电脑端打开此页面显示二维码，手机扫码自动填入 Token…";
    fetch(base + "/api/v1/gateway/pair")
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || !d.pair_url) { hint.textContent = "扫码配对不可用（请手动填写 Token）"; return; }
        hint.textContent = "手机扫码自动填入 Token（或直接点下方链接）：";
        renderQR(qr, d.qr_svg, d.pair_url);
      })
      .catch(function () { hint.textContent = "扫码配对不可用（请手动填写 Token）"; });
  }

  // 渲染扫码配对：优先显示服务端生成的二维码 SVG（手机真可扫码），
  // 无 SVG 时回退为可点击链接兜底。
  function renderQR(el, qrSvg, url) {
    el.innerHTML = "";
    if (qrSvg && qrSvg.indexOf("<svg") !== -1) {
      el.innerHTML = qrSvg;
      return;
    }
    var a = document.createElement("a");
    a.href = url; a.target = "_blank"; a.rel = "noopener";
    a.textContent = "点此打开（含 Token 的启动链接）";
    a.style.cssText = "display:block;padding:14px;background:var(--bg-card,#fff);border:1px solid var(--border,#888);border-radius:10px;color:var(--text,#333);word-break:break-all;font-size:12px;text-decoration:none";
    el.appendChild(a);
  }

  function enterWorkbench(base, token) {
    // v2.0：工作台 = dsh 原版界面（100% 原样，不包装不重写）。
    // deepDDW 能力由 dsh 用户插件（@deepddw/dsh-workbench）注入。
    var dshUrl = (dshEl.value.trim().replace(/\/+$/, "") || "http://127.0.0.1:3080");
    if (!/^https?:\/\//.test(dshUrl)) { msg.className = "msg err"; msg.textContent = "工作台地址需以 http(s):// 开头"; return; }
    var iframe = document.createElement("iframe");
    iframe.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:none;background:#fff";
    iframe.src = dshUrl;  // URL 中绝不携带 token
    document.body.appendChild(iframe);
    document.querySelector(".card").style.display = "none";
    try { localStorage.setItem("deepddw_dsh", dshUrl); } catch (e) {}
    // 通过 postMessage 把 token 交给 dsh 页面内的 deepDDW 插件
    // （targetOrigin 精确到 dsh 源；不经过 URL / iframe src / 日志）
    iframe.onload = function () {
      try { iframe.contentWindow.postMessage({ type: "deepddw-token", token: token }, dshUrl); } catch (e) {}
    };
    setTimeout(function () {
      try { iframe.contentWindow.postMessage({ type: "deepddw-token", token: token }, dshUrl); } catch (e) {}
    }, 800);
  }
})();
</script>
</body>
</html>
