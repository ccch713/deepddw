name: ddw_inventory
license: free
tier: beta
version: "0.1.0"
description: "耗材管理（库存/出入库/预警）"
author: "DDW Team"
endpoints:
  - path: /api/v1/plugins/ddw_inventory/health
    method: GET
  - path: /api/v1/plugins/ddw_inventory/items
    method: POST
  - path: /api/v1/plugins/ddw_inventory/items
    method: GET
  - path: /api/v1/plugins/ddw_inventory/items/{id}
    method: GET
  - path: /api/v1/plugins/ddw_inventory/items/{id}
    method: PATCH
  - path: /api/v1/plugins/ddw_inventory/items/{id}/in
    method: POST
  - path: /api/v1/plugins/ddw_inventory/items/{id}/out
    method: POST
  - path: /api/v1/plugins/ddw_inventory/items/{id}/adjust
    method: POST
  - path: /api/v1/plugins/ddw_inventory/alerts
    method: GET
  - path: /api/v1/plugins/ddw_inventory/logs
    method: GET
