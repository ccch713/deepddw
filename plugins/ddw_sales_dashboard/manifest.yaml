name: ddw-sales-dashboard
license: commercial
tier: beta
version: 1.0.0
display_name: DDW 销售看板
description: 销售端 CRM 聚合查询插件。基于 P0-1~P0-4 插件的数据，提供销售仪表盘所需的统计指标：总览、漏斗、趋势、销售排行、最近商机、阶段分布。
engine: plugin_base
isolation: inline

permissions:
  - database.read

dependencies:
  plugins:
    - ddw-company-profile
    - ddw-contact-hub
    - ddw-opportunity
    - ddw-quotation

config_schema:
  type: object
  properties:
    default_tenant_id:
      type: integer
      default: 1
    trend_window_months:
      type: integer
      default: 12
      description: 趋势接口默认回看月数
    recent_limit:
      type: integer
      default: 10
      description: 最近商机接口默认条数

router_prefix: /api/v1/plugins/ddw-sales-dashboard
