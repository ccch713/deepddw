name: ddw-cost-knowledge
license: commercial
tier: beta
version: 1.0.0
display_name: DDW 造价知识库
description: 设计院历史造价文件 + 定额/清单/指标的统一管理：上传、LLM 提炼、自然语言检索、基于历史数据的造价估算与置信度评估。
engine: plugin_base
isolation: inline

permissions:
  - llm.chat
  - filesystem.read
  - filesystem.write
  - database.read
  - database.write

dependencies:
  plugins:
    ddw-llm-gateway: ">=1.0.0"

config_schema:
  type: object
  properties:
    upload_dir:
      type: string
      default: ./data/uploads/cost
    default_tenant_id:
      type: integer
      default: 1
    estimate_similarity_threshold:
      type: number
      default: 0.6
      minimum: 0
      maximum: 1
    max_search_results:
      type: integer
      default: 20
      minimum: 1
      maximum: 100

router_prefix: /api/v1/plugins/ddw-cost-knowledge
