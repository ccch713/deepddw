name: ddw-instance-binding
license: free
tier: core
version: 1.0.0
display_name: DDW 实例绑定
description: 销售端实例绑定（Instance Binding）：把客户企业 / 许可证与运行时实例（云端 SaaS 租户或本地 On-Premise 部署）建立关联。状态机 active/inactive/suspended，心跳上报，按企业/许可证/类型/环境/状态多维筛选，统计概览。软删除走 suspended 保留审计链。
engine: plugin_base
isolation: inline

permissions:
  - database.read
  - database.write

dependencies:
  plugins:
    - ddw-company-profile
    - ddw-license-core

config_schema:
  type: object
  properties:
    default_tenant_id:
      type: integer
      default: 1
    default_page_size:
      type: integer
      default: 20
    instance_types:
      type: array
      default: [saas, on-premise]
      description: 实例类型枚举（saas=云端租户 / on-premise=本地部署）
    environments:
      type: array
      default: [production, staging, test]
      description: 部署环境枚举
    statuses:
      type: array
      default: [active, inactive, suspended]
      description: 实例状态枚举

router_prefix: /api/v1/plugins/ddw-instance-binding
