name: socratic-lens
description: 苏格拉底教学审计 4 维度
dimensions:
  - id: conceptual_clarity
    name: 概念清晰度
    weight: 0.30
    desc: 学生是否真正理解核心概念
    signals:
      - 能用自己的话复述定义
      - 区分相似概念（如速度 vs 加速度）
      - 举出符合/不符合概念的具体例子
  - id: reasoning_depth
    name: 推理深度
    weight: 0.30
    desc: 思维是否从记忆上升到分析/评价/创造
    levels:
      - remember
      - understand
      - apply
      - analyze
      - evaluate
      - create
  - id: engagement_quality
    name: 参与质量
    weight: 0.20
    desc: 学生是主动参与还是被动回答
    indicators:
      - 主动追问
      - 主动举例
      - 主动反驳/质疑
      - 主动联系生活实际
  - id: pedagogical_alignment
    name: 教学法对齐度
    weight: 0.20
    desc: 是否遵循 6 思维动作 + 12 图景结构化路径
    rules:
      - 6 个动作按序触发（可跳跃，但每个动作至少 1 次）
      - 至少使用 3 种图景呈现
      - 单次会话总步数 8-20
