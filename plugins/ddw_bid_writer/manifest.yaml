name: ddw-bid-writer
license: commercial
tier: beta
version: 1.0.0
display_name: DDW 投标标书撰写
description: 设计院投标项目全流程：项目建档、标书自动生成、多风格修饰、标书审查、模板管理。
engine: plugin_base
isolation: inline

permissions:
  - llm.chat
  - filesystem.read
  - filesystem.write
  - database.read
  - database.write

dependencies:
  plugins:
    ddw-llm-gateway: ">=1.0.0"

config_schema:
  type: object
  properties:
    default_tenant_id:
      type: integer
      default: 1
    available_styles:
      type: array
      default: [标准, 保守, 激进, 创新型]
      description: 标书风格修饰可选类型
    default_doc_type:
      type: string
      default: 技术标
      enum: [技术标, 商务标, 资格预审]
    # 脱敏说明
    style_feature_note: |
      标书风格修饰：基于企业偏好（标准/保守/激进/创新型）对已生成的标书进行语言润色与表达风格调整。
      该功能用于企业内部不同场景下的标书版本管理。

router_prefix: /api/v1/plugins/ddw-bid-writer
