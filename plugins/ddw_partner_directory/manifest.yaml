name: ddw-partner-directory
license: free
tier: core
version: 1.0.0
display_name: DDW 经销商开户
description: 经销商/代理商/分销商的开户与档案管理。类型（reseller/agent/distributor）、等级（normal/silver/gold/strategic）、区域/行业、三类折扣（产品/插件/服务，百分数）、可售产品范围、合作起止期；支持开户、列表、详情、更新、暂停与多维统计。
engine: plugin_base
isolation: inline

permissions:
  - database.read
  - database.write

dependencies:
  plugins:
    - ddw-company-profile

config_schema:
  type: object
  properties:
    default_tenant_id:
      type: integer
      default: 1
    default_page_size:
      type: integer
      default: 20
    default_product_discount:
      type: number
      default: 80
      description: 默认产品折扣（百分数，80 = 8 折）
    default_plugin_discount:
      type: number
      default: 85
      description: 默认插件折扣（百分数）
    default_service_discount:
      type: number
      default: 90
      description: 默认服务折扣（百分数）
    partner_types:
      type: array
      default: [reseller, agent, distributor]
      description: 经销商类型枚举
    levels:
      type: array
      default: [normal, silver, gold, strategic]
      description: 经销商等级枚举
    statuses:
      type: array
      default: [active, inactive, suspended]
      description: 状态枚举

router_prefix: /api/v1/plugins/ddw-partner-directory
