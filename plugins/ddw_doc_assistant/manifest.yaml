name: ddw-doc-assistant
tier: beta
version: 1.0.0
description: "设计院/研究院文档知识助手 — 上传解析 · RAG问答 · 文档管理 · 混合检索"
author: DDW Team
license: commercial
engine: ">=2.0.0"
isolation: inline

permissions:
  - "database:ddw_doc_assistant"
  - "api:ddw-llm-gateway:read"

dependencies:
  plugins:
    ddw-knowledge-hierarchy: ">=1.0.0"
    ddw-llm-gateway: ">=1.0.0"
  python:
    - fastapi>=0.110
    - sqlalchemy>=2.0
    - pydantic>=2.0

events:
  produces:
    - "doc.uploaded"
    - "doc.queried"
  consumes: []

config:
  optional:
    default_top_k: 5
    max_upload_size_mb: 100

ecosystem:
  category: "knowledge"
  tags: ["document", "rag", "qa", "knowledge", "design-institute"]
