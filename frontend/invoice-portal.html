<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>发票自助 - DDW AI Hub</title>
<link rel="icon" type="image/svg+xml" href="assets/logo-ju.svg">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #333; background: #F0F2F5; -webkit-font-smoothing: antialiased; }
  a { color: #1890FF; text-decoration: none; }
  button, input, select, textarea { font-family: inherit; }

  /* === Layout === */
  .app { display: flex; min-height: 100vh; }
  .sidebar { width: 200px; background: #001529; color: rgba(255,255,255,0.85); flex-shrink: 0; }
  .sidebar-logo { display: flex; align-items: center; height: 56px; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .logo-char { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; background: #000; color: #FFF; font-size: 18px; font-weight: bold; font-family: "PingFang SC", "Microsoft YaHei", serif; border-radius: 2px; margin-right: 8px; }
  .logo-text { color: #FFF; font-size: 15px; font-weight: 500; }
  .nav-group { padding: 12px 0; }
  .nav-title { color: rgba(255,255,255,0.45); font-size: 12px; padding: 0 16px 8px; }
  .nav-item { display: flex; align-items: center; height: 40px; padding: 0 16px; color: rgba(255,255,255,0.85); font-size: 14px; cursor: pointer; }
  .nav-item:hover { color: #FFF; background: rgba(255,255,255,0.04); }
  .nav-item.active { color: #FFF; background: #1890FF; }
  .nav-icon { width: 16px; height: 16px; margin-right: 10px; flex-shrink: 0; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { background: #FFF; border-bottom: 1px solid #E8E8E8; height: 56px; display: flex; align-items: center; padding: 0 24px; }
  .crumb { color: #333; font-size: 14px; }
  .crumb .sep { color: #999; margin: 0 6px; }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
  .user-chip { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #333; }
  .user-avatar { width: 28px; height: 28px; background: #1890FF; color: #FFF; border-radius: 2px; display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .user-chip a { color: #666; font-size: 12px; }
  .user-chip a:hover { color: #1890FF; }

  .content { flex: 1; padding: 24px; overflow: auto; }

  /* === Cards === */
  .card { background: #FFF; border: 1px solid #E8E8E8; border-radius: 2px; }
  .card-head { padding: 14px 20px; border-bottom: 1px solid #E8E8E8; display: flex; align-items: center; }
  .card-title { font-size: 15px; color: #333; font-weight: 500; }
  .card-extra { margin-left: auto; display: flex; gap: 8px; }
  .card-body { padding: 20px; }

  .row { display: grid; gap: 16px; }
  .row.c4 { grid-template-columns: repeat(4, 1fr); }
  .row.c2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 900px) { .row.c4, .row.c2 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 600px) { .row.c4, .row.c2 { grid-template-columns: 1fr; } }

  .stat-card { background: #FFF; border: 1px solid #E8E8E8; border-radius: 2px; padding: 18px 20px; }
  .stat-label { color: #999; font-size: 13px; margin-bottom: 8px; }
  .stat-value { color: #333; font-size: 24px; font-weight: 500; }
  .stat-extra { color: #52C41A; font-size: 12px; margin-top: 4px; }
  .stat-extra.warn { color: #FAAD14; }
  .stat-extra.err { color: #F5222D; }

  /* === Table === */
  .table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .table th { background: #FAFAFA; color: #333; font-weight: 500; text-align: left; padding: 12px 16px; border-bottom: 1px solid #E8E8E8; }
  .table td { padding: 12px 16px; border-bottom: 1px solid #F0F0F0; color: #333; }
  .table tr:hover td { background: #FAFAFA; }
  .tag { display: inline-block; padding: 2px 8px; font-size: 12px; border-radius: 2px; }
  .tag.ok { background: #F6FFED; color: #52C41A; border: 1px solid #B7EB8F; }
  .tag.warn { background: #FFFBE6; color: #FAAD14; border: 1px solid #FFE58F; }
  .tag.err { background: #FFF1F0; color: #F5222D; border: 1px solid #FFA39E; }
  .tag.info { background: #E6F7FF; color: #1890FF; border: 1px solid #91D5FF; }
  .tag.muted { background: #FAFAFA; color: #999; border: 1px solid #E8E8E8; }

  .btn { display: inline-block; height: 30px; line-height: 30px; padding: 0 14px; font-size: 13px; border-radius: 2px; border: 1px solid #D9D9D9; background: #FFF; color: #333; cursor: pointer; }
  .btn:hover { border-color: #1890FF; color: #1890FF; }
  .btn.primary { background: #1890FF; color: #FFF; border-color: #1890FF; }
  .btn.primary:hover { background: #40A9FF; border-color: #40A9FF; color: #FFF; }
  .btn.sm { height: 24px; line-height: 24px; padding: 0 10px; font-size: 12px; }

  /* === Filters === */
  .filter-bar { display: flex; gap: 8px; align-items: center; }
  .filter-chip { display: inline-flex; align-items: center; height: 28px; padding: 0 12px; font-size: 13px; border: 1px solid #D9D9D9; border-radius: 2px; background: #FFF; cursor: pointer; color: #333; }
  .filter-chip:hover { border-color: #1890FF; color: #1890FF; }
  .filter-chip.active { background: #E6F7FF; border-color: #1890FF; color: #1890FF; }

  /* === Form === */
  .form-row { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
  .form-row label { width: 100px; color: #333; font-size: 13px; }
  .form-row .req { color: #F5222D; margin-left: 2px; }
  .form-row input, .form-row select, .form-row textarea { flex: 1; height: 32px; padding: 4px 11px; border: 1px solid #D9D9D9; border-radius: 2px; font-size: 13px; color: #333; outline: none; }
  .form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: #1890FF; }
  .form-row textarea { height: auto; min-height: 60px; padding: 8px 11px; }
  .form-hint { font-size: 12px; color: #999; margin-left: 100px; margin-top: -8px; margin-bottom: 14px; }

  /* === Modal === */
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal-mask.show { display: flex; }
  .modal { background: #FFF; width: 460px; max-width: 90vw; border-radius: 2px; }
  .modal-head { padding: 14px 20px; border-bottom: 1px solid #E8E8E8; display: flex; align-items: center; }
  .modal-title { font-size: 15px; color: #333; font-weight: 500; }
  .modal-close { margin-left: auto; cursor: pointer; color: #999; font-size: 18px; background: none; border: none; }
  .modal-body { padding: 20px; }
  .modal-foot { padding: 12px 20px; border-top: 1px solid #E8E8E8; text-align: right; }
  .modal-foot .btn { margin-left: 8px; }

  .toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.78); color: #FFF; padding: 10px 20px; font-size: 13px; border-radius: 2px; display: none; z-index: 200; }
  .toast.show { display: block; }
  .toast.err { background: #F5222D; }
  .toast.ok { background: #52C41A; }

  .empty { text-align: center; color: #999; padding: 40px 20px; font-size: 13px; }
  .pager { display: flex; gap: 4px; align-items: center; justify-content: flex-end; padding: 12px 16px; }
  .pager .btn { min-width: 32px; text-align: center; padding: 0 10px; }

  /* Footer */
  .app-footer { text-align: center; padding: 14px 0; color: #999; font-size: 12px; border-top: 1px solid #E8E8E8; background: #FFF; }
  .app-footer a { color: #999; }
  .app-footer a:hover { color: #1890FF; }
  .footer-sep { margin: 0 8px; color: #D9D9D9; }

  /* Mobile */
  .menu-toggle { display: none; background: none; border: none; color: #FFF; font-size: 20px; margin-right: 8px; }
  @media (max-width: 768px) {
    .sidebar { position: fixed; left: -200px; top: 0; bottom: 0; z-index: 50; transition: left 0.2s; }
    .sidebar.open { left: 0; }
    .menu-toggle { display: inline-block; }
  }
</style>
    <link rel="stylesheet" href="/css/ddw-themes.css">
    <script src="/js/ddw-theme-switcher.js"></script>
  </head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span class="logo-char">钜</span>
      <span class="logo-text">DDW 控制台</span>
    </div>
    <div class="nav-group">
      <div class="nav-title">财务</div>
      <a class="nav-item" href="saas-admin.html#billing">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="currentColor"><rect x="2" y="3" width="12" height="10"/><path d="M4 6h8M4 9h8" stroke="white" fill="none"/></svg>
        套餐与账单
      </a>
      <a class="nav-item active" href="invoice-portal.html">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M3 1h10v14l-2-1.5L9 15l-2-1.5L5 15l-2-1.5V1z"/><path d="M5 5h6M5 8h6M5 11h4" stroke="white" fill="none"/></svg>
        发票管理
      </a>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle">≡</button>
      <div class="crumb">
        <span>控制台</span>
        <span class="sep">/</span>
        <span>发票管理</span>
      </div>
      <div class="topbar-right">
        <div class="user-chip" id="userChip">未登录</div>
      </div>
    </header>

    <div class="content" id="content">
      <div class="empty">加载中…</div>
    </div>

    <footer class="app-footer">
      <span>&copy; 2026 武汉锐果互动信息技术有限公司</span>
      <span class="footer-sep">|</span>
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">鄂ICP备2026024883号-1</a>
    </footer>
  </main>
</div>

<div class="modal-mask" id="modal">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title" id="modalTitle">提示</span>
      <button class="modal-close" id="modalClose">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn" id="modalCancel">取消</button>
      <button class="btn primary" id="modalOk">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'http://localhost:8500' : '';
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const toast = (m, t=2000, cls='') => {
  const el = $('#toast');
  el.textContent = m;
  el.className = 'toast show ' + cls;
  setTimeout(() => el.classList.remove('show'), t);
};

// ==== 认证 ====
const TOKEN = localStorage.getItem('ddw_token');
const USER_STR = localStorage.getItem('ddw_user');
const TENANT_STR = localStorage.getItem('ddw_tenant');
const COMPANY_ID = parseInt(localStorage.getItem('ddw_company_id') || '0', 10);
if (!TOKEN) { location.href = '/login.html'; }
const USER = USER_STR ? JSON.parse(USER_STR) : { name: '?', role: 'member' };
const TENANT = TENANT_STR ? JSON.parse(TENANT_STR) : { name: '?', plan: 'free' };

$('#userChip').innerHTML = '<span class="user-avatar">' + (USER.name || '?').charAt(0) + '</span><span>' + (USER.name || USER.phone || '?') + '</span><a href="javascript:void(0)" id="btnLogout">退出</a>';
$('#btnLogout').addEventListener('click', () => { localStorage.clear(); location.href = 'saas-register.html'; });
$('#menuToggle').addEventListener('click', () => $('#sidebar').classList.toggle('open'));

async function api(path, opts = {}) {
  const r = await fetch(API_BASE + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + TOKEN,
      ...(opts.headers || {})
    }
  });
  if (r.status === 401) { localStorage.clear(); location.href = 'saas-register.html'; throw new Error('未登录'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || ('HTTP ' + r.status));
  return d;
}

// ==== Modal ====
function modal({ title, body, onOk, okText='确定', cancelText='取消', hideCancel=false }) {
  return new Promise((resolve) => {
    $('#modalTitle').textContent = title;
    $('#modalBody').innerHTML = body;
    $('#modalOk').textContent = okText;
    $('#modalCancel').textContent = cancelText;
    $('#modalCancel').style.display = hideCancel ? 'none' : '';
    const close = (val) => { $('#modal').classList.remove('show'); resolve(val); };
    $('#modalOk').onclick = async () => { const v = onOk ? await onOk() : true; close(v); };
    $('#modalCancel').onclick = () => close(false);
    $('#modalClose').onclick = () => close(false);
    $('#modal').classList.add('show');
  });
}

// ==== 状态映射 ====
const STATUS_LABEL = {
  requested: { text: '待开票', cls: 'warn' },
  issued: { text: '已开票', cls: 'ok' },
  voided: { text: '已作废', cls: 'err' },
};
const TYPE_LABEL = { special: '专票', normal: '普票' };

// ==== 渲染 ====
let allInvoices = [];
let currentStatus = '';
let currentPage = 1;
const PAGE_SIZE = 20;

async function loadInvoices() {
  if (!COMPANY_ID) {
    $('#content').innerHTML = '<div class="card"><div class="empty">未绑定企业主体（缺少 ddw_company_id），请先在"企业主体"中完善开票信息。</div></div>';
    return;
  }
  try {
    const params = new URLSearchParams({ company_id: COMPANY_ID, page: currentPage, page_size: PAGE_SIZE });
    if (currentStatus) params.set('status', currentStatus);
    const data = await api('/api/v1/plugins/ddw-invoice/invoices/my?' + params.toString());
    allInvoices = data.items || [];
    render();
  } catch (e) {
    $('#content').innerHTML = '<div class="card"><div class="empty">加载失败：' + e.message + '</div></div>';
  }
}

async function loadStats() {
  try {
    // 管理员视角：可读全局；客户视角：读自己的列表聚合
    const params = new URLSearchParams({ company_id: COMPANY_ID, page: 1, page_size: 1 });
    const summary = await api('/api/v1/plugins/ddw-invoice/invoices/my?' + params.toString());
    return { total: summary.total || 0 };
  } catch (e) { return { total: 0 }; }
}

function render() {
  const rows = allInvoices.map(inv => {
    const st = STATUS_LABEL[inv.status] || { text: inv.status, cls: 'muted' };
    const type = TYPE_LABEL[inv.invoice_type] || inv.invoice_type;
    const issued = inv.issued_at ? new Date(inv.issued_at).toISOString().slice(0, 10) : '-';
    const downloadBtn = inv.status === 'issued'
      ? '<button class="btn sm primary" data-download="' + inv.id + '">下载</button>'
      : '<span class="tag muted">未开票</span>';
    return '<tr>' +
      '<td>' + (inv.invoice_no || '<span style="color:#999">未开票</span>') + '</td>' +
      '<td>' + type + '</td>' +
      '<td>' + Number(inv.amount).toFixed(2) + '</td>' +
      '<td>' + Number(inv.tax_amount).toFixed(2) + '</td>' +
      '<td>' + Number(inv.total_amount).toFixed(2) + '</td>' +
      '<td>' + inv.invoice_title + '<br><span style="font-size:11px;color:#999">' + inv.tax_id + '</span></td>' +
      '<td>' + issued + '</td>' +
      '<td><span class="tag ' + st.cls + '">' + st.text + '</span></td>' +
      '<td>' + downloadBtn + '</td>' +
      '</tr>';
  }).join('');

  const summary = allInvoices.length;
  $('#content').innerHTML = `
    <div class="row c4" style="margin-bottom:16px">
      <div class="stat-card"><div class="stat-label">本企业发票数</div><div class="stat-value" id="statTotal">-</div><div class="stat-extra">已开 + 待开 + 已作废</div></div>
      <div class="stat-card"><div class="stat-label">待开票</div><div class="stat-value" id="statReq">-</div><div class="stat-extra warn">锐果审核中</div></div>
      <div class="stat-card"><div class="stat-label">已开票</div><div class="stat-value" id="statIssued">-</div><div class="stat-extra">可下载</div></div>
      <div class="stat-card"><div class="stat-label">本企业累计开票金额</div><div class="stat-value" id="statAmt">-</div><div class="stat-extra">价税合计（CNY）</div></div>
    </div>

    <div class="card">
      <div class="card-head">
        <div class="card-title">发票列表</div>
        <div class="card-extra">
          <div class="filter-bar" style="margin-right:8px">
            <span class="filter-chip ${currentStatus===''?'active':''}" data-filter="">全部</span>
            <span class="filter-chip ${currentStatus==='requested'?'active':''}" data-filter="requested">待开票</span>
            <span class="filter-chip ${currentStatus==='issued'?'active':''}" data-filter="issued">已开票</span>
            <span class="filter-chip ${currentStatus==='voided'?'active':''}" data-filter="voided">已作废</span>
          </div>
          <button class="btn primary" id="btnApply">申请开票</button>
        </div>
      </div>
      <div class="card-body" style="padding:0">
        <table class="table">
          <thead><tr>
            <th>发票号</th><th>类型</th><th>金额</th><th>税额</th><th>价税合计</th>
            <th>抬头 / 税号</th><th>开票日期</th><th>状态</th><th>操作</th>
          </tr></thead>
          <tbody>${rows || '<tr><td colspan="9" class="empty">暂无发票</td></tr>'}</tbody>
        </table>
        <div class="pager">
          <span style="font-size:12px;color:#999;margin-right:auto">共 ${summary} 条</span>
          <button class="btn sm" id="prevPage" ${currentPage<=1?'disabled':''}>上一页</button>
          <span style="font-size:12px;color:#666">第 ${currentPage} 页</span>
          <button class="btn sm" id="nextPage" ${allInvoices.length < PAGE_SIZE?'disabled':''}>下一页</button>
        </div>
      </div>
    </div>
  `;

  // 计算概览
  const req = allInvoices.filter(i => i.status === 'requested').length;
  const issued = allInvoices.filter(i => i.status === 'issued').length;
  const amt = allInvoices.reduce((s, i) => s + Number(i.total_amount || 0), 0);
  $('#statTotal').textContent = summary;
  $('#statReq').textContent = req;
  $('#statIssued').textContent = issued;
  $('#statAmt').textContent = '¥ ' + amt.toFixed(2);

  bindPage();
}

function bindPage() {
  $$('.filter-chip').forEach(c => c.addEventListener('click', () => {
    currentStatus = c.dataset.filter;
    currentPage = 1;
    loadInvoices();
  }));
  $('#btnApply').addEventListener('click', showApplyModal);
  $('#prevPage')?.addEventListener('click', () => { if (currentPage > 1) { currentPage--; loadInvoices(); }});
  $('#nextPage')?.addEventListener('click', () => { currentPage++; loadInvoices(); });
  $$('[data-download]').forEach(b => b.addEventListener('click', () => doDownload(parseInt(b.dataset.download, 10))));
}

async function showApplyModal() {
  const body = `
    <div class="form-row">
      <label>企业<span class="req">*</span></label>
      <input value="(当前企业 ID=${COMPANY_ID})" disabled>
    </div>
    <div class="form-row">
      <label>发票类型<span class="req">*</span></label>
      <select id="apType">
        <option value="normal">普通发票</option>
        <option value="special">增值税专用发票</option>
      </select>
    </div>
    <div class="form-row">
      <label>金额（不含税）<span class="req">*</span></label>
      <input id="apAmount" type="number" step="0.01" min="0" placeholder="0.00">
    </div>
    <div class="form-row">
      <label>税额<span class="req">*</span></label>
      <input id="apTax" type="number" step="0.01" min="0" placeholder="0.00">
    </div>
    <div class="form-row">
      <label>价税合计<span class="req">*</span></label>
      <input id="apTotal" type="number" step="0.01" min="0" placeholder="0.00">
    </div>
    <div class="form-row">
      <label>备注</label>
      <textarea id="apNotes" placeholder="如需邮寄纸质发票请填写邮寄地址"></textarea>
    </div>
    <div class="form-hint">抬头与税号将自动从本企业主体填充，无需手动填写。</div>
  `;
  const ok = await modal({ title: '申请开票', body, okText: '提交申请', cancelText: '取消' });
  if (!ok) return;
  const amount = parseFloat(document.getElementById('apAmount').value || '0');
  const tax = parseFloat(document.getElementById('apTax').value || '0');
  const total = parseFloat(document.getElementById('apTotal').value || '0');
  if (amount <= 0 || tax < 0 || total <= 0) { toast('请填写金额', 2000, 'err'); return; }
  if (Math.abs(total - (amount + tax)) > 0.01) { toast('价税合计 ≠ 金额 + 税额', 3000, 'err'); return; }
  try {
    await api('/api/v1/plugins/ddw-invoice/invoices/request', {
      method: 'POST',
      body: JSON.stringify({
        company_id: COMPANY_ID,
        invoice_type: document.getElementById('apType').value,
        amount, tax_amount: tax, total_amount: total,
        notes: document.getElementById('apNotes').value || null,
        created_by: USER.id || null,
      }),
    });
    toast('申请已提交', 2000, 'ok');
    loadInvoices();
  } catch (e) { toast('提交失败：' + e.message, 3000, 'err'); }
}

async function doDownload(invoiceId) {
  try {
    const r = await api('/api/v1/plugins/ddw-invoice/invoices/' + invoiceId + '/download?user_id=' + (USER.id || 0), { method: 'GET' });
    if (r.invoice_url) {
      window.open(r.invoice_url, '_blank');
      toast('已为您打开发票 PDF（共下载 ' + r.download_count + ' 次）', 2500, 'ok');
    } else {
      toast('发票文件未上传', 2500, 'err');
    }
    loadInvoices();
  } catch (e) { toast('下载失败：' + e.message, 3000, 'err'); }
}

loadInvoices();
</script>
