type: implant
name: 种植病历
version: "1.0"
required_fields:
  - chief_complaint
  - present_illness
  - missing_tooth
  - edentulous_period
  - bone_quality
  - bone_volume
  - implant_brand
  - implant_size
  - loading_protocol
  - cbct_performed
  - informed_consent_signed

fields:
  chief_complaint:
    label: 主诉
    type: text
    max_length: 200
    required: true
  present_illness:
    label: 现病史
    type: text
    max_length: 1000
    required: true
  past_history:
    label: 既往史
    type: text
    max_length: 500
    required: false
  missing_tooth:
    label: 缺失牙位
    type: text
    required: true
  edentulous_period:
    label: 缺牙时间
    type: text
    required: true
  bone_quality:
    label: 骨质评估
    type: select
    options: [I, II, III, IV]
    required: true
  bone_volume:
    label: 骨量评估
    type: select
    options: [sufficient, insufficient]
    required: true
  implant_brand:
    label: 种植体品牌
    type: text
    required: true
  implant_size:
    label: 种植体规格
    type: text
    required: true
  loading_protocol:
    label: 负荷方式
    type: select
    options: [immediate, delayed, conventional]
    required: true
  stages:
    label: 阶段
    type: select
    options: [phase_1, phase_2, prosthetic]
    required: false
  cbct_performed:
    label: CBCT 已完成
    type: boolean
    required: true
  bone_graft_needed:
    label: 需要植骨
    type: boolean
    required: false
  sinus_lift:
    label: 上颌窦提升
    type: boolean
    required: false
  informed_consent_signed:
    label: 知情同意已签
    type: boolean
    required: true

display_order:
  - chief_complaint
  - present_illness
  - past_history
  - missing_tooth
  - edentulous_period
  - bone_quality
  - bone_volume
  - implant_brand
  - implant_size
  - loading_protocol
  - stages
  - cbct_performed
  - bone_graft_needed
  - sinus_lift
  - informed_consent_signed
