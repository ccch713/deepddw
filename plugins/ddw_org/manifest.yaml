name: ddw-org
license: free
tier: core
version: 1.0.0
display_name: DDW AI 组织
description: 企业管理 11 个虚拟部门、数字员工、员工清单。预设种子数据（笑笑/法海/邮友等），支持 CRUD 和 skill 分配。
engine: plugin_base
isolation: inline

permissions:
  - database.read
  - database.write

dependencies:
  plugins: []

config_schema:
  type: object
  properties:
    default_tenant_id:
      type: integer
      default: 1

router_prefix: /api/v1/org
