<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>HRIS 集成 - DDW AI Hub</title>
<link rel="icon" type="image/svg+xml" href="assets/logo-ju.svg">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #333; background: #F0F2F5; -webkit-font-smoothing: antialiased; }
  a { color: #1890FF; text-decoration: none; }
  button, input, select, textarea { font-family: inherit; }

  .app { display: flex; min-height: 100vh; }
  .sidebar { width: 200px; background: #001529; color: rgba(255,255,255,0.85); flex-shrink: 0; }
  .sidebar-logo { display: flex; align-items: center; height: 56px; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .logo-char { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; background: #000; color: #FFF; font-size: 18px; font-weight: bold; font-family: "PingFang SC", "Microsoft YaHei", serif; border-radius: 2px; margin-right: 8px; }
  .logo-text { color: #FFF; font-size: 15px; font-weight: 500; }
  .nav-item { display: flex; align-items: center; height: 40px; padding: 0 16px; color: rgba(255,255,255,0.85); font-size: 14px; cursor: pointer; }
  .nav-item:hover { color: #FFF; background: rgba(255,255,255,0.04); }
  .nav-item.active { color: #FFF; background: #1890FF; }
  .nav-icon { width: 16px; height: 16px; margin-right: 10px; flex-shrink: 0; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { background: #FFF; border-bottom: 1px solid #E8E8E8; height: 56px; display: flex; align-items: center; padding: 0 24px; }
  .crumb { color: #333; font-size: 14px; }
  .topbar-right { margin-left: auto; font-size: 13px; color: #666; }
  .content { flex: 1; padding: 24px; }

  .adapter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .adapter-card { background: #FFF; border: 1px solid #E8E8E8; padding: 20px; border-radius: 2px; }
  .adapter-head { display: flex; align-items: center; margin-bottom: 12px; }
  .adapter-logo { width: 40px; height: 40px; background: #1890FF; color: #FFF; font-size: 18px; font-weight: bold; border-radius: 2px; display: flex; align-items: center; justify-content: center; margin-right: 12px; }
  .adapter-name { font-size: 16px; color: #333; font-weight: 500; }
  .adapter-meta { font-size: 12px; color: #999; margin-top: 2px; }
  .adapter-status { margin-left: auto; }
  .tag { display: inline-block; padding: 2px 8px; font-size: 12px; border-radius: 2px; }
  .tag.ok { background: #F6FFED; color: #52C41A; border: 1px solid #B7EB8F; }
  .tag.warn { background: #FFFBE6; color: #FAAD14; border: 1px solid #FFE58F; }
  .tag.err { background: #FFF1F0; color: #F5222D; border: 1px solid #FFA39E; }

  .config-form { margin-top: 12px; padding-top: 12px; border-top: 1px dashed #E8E8E8; }
  .form-row { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
  .form-row label { width: 100px; color: #333; font-size: 13px; flex-shrink: 0; }
  .form-row input, .form-row select { flex: 1; height: 30px; padding: 4px 11px; border: 1px solid #D9D9D9; border-radius: 2px; font-size: 13px; color: #333; }
  .form-row input:focus, .form-row select:focus { border-color: #1890FF; outline: none; }

  .btn { display: inline-block; height: 30px; line-height: 30px; padding: 0 14px; font-size: 13px; border-radius: 2px; border: 1px solid #D9D9D9; background: #FFF; color: #333; cursor: pointer; }
  .btn:hover { border-color: #1890FF; color: #1890FF; }
  .btn.primary { background: #1890FF; color: #FFF; border-color: #1890FF; }
  .btn.primary:hover { background: #40A9FF; border-color: #40A9FF; color: #FFF; }
  .btn.sm { height: 24px; line-height: 24px; padding: 0 10px; font-size: 12px; }

  .table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .table th { background: #FAFAFA; color: #333; font-weight: 500; text-align: left; padding: 12px 16px; border-bottom: 1px solid #E8E8E8; }
  .table td { padding: 12px 16px; border-bottom: 1px solid #F0F0F0; color: #333; }

  .card { background: #FFF; border: 1px solid #E8E8E8; border-radius: 2px; }
  .card-head { padding: 14px 20px; border-bottom: 1px solid #E8E8E8; display: flex; align-items: center; }
  .card-title { font-size: 15px; color: #333; font-weight: 500; }
  .card-extra { margin-left: auto; }
  .card-body { padding: 20px; }

  .toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.78); color: #FFF; padding: 10px 20px; font-size: 13px; border-radius: 2px; display: none; z-index: 200; }
  .toast.show { display: block; }

  .app-footer { text-align: center; padding: 12px 0; color: #999; font-size: 12px; border-top: 1px solid #E8E8E8; background: #FFF; }
  .app-footer a { color: #999; }
  .app-footer a:hover { color: #1890FF; }
  .footer-sep { margin: 0 8px; color: #D9D9D9; }

  @media (max-width: 900px) { .row.c4, .row.c3, .row.c2 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 600px) { .row.c4, .row.c3, .row.c2 { grid-template-columns: 1fr; } }
  @media (max-width: 768px) {
    .sidebar { position: fixed; left: -200px; top: 0; bottom: 0; z-index: 50; transition: left 0.2s; }
    .sidebar.open { left: 0; }
    .menu-toggle { display: inline-block; }
    .main { margin-left: 0; }
  }

</style>
    <link rel="stylesheet" href="/css/ddw-themes.css">
    <script src="/js/ddw-theme-switcher.js"></script>
  </head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <span class="logo-char">钜</span>
      <span class="logo-text">DDW Hub</span>
    </div>
    <a class="nav-item" href="saas-admin.html#/overview">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1l7 4v6l-7 4-7-4V5l7-4z"/></svg>
      控制台
    </a>
    <a class="nav-item" href="ddw-training.html">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1l7 4-7 4-7-4 7-4z"/></svg>
      智能培训
    </a>
    <a class="nav-item" href="ddw-skills.html">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="8" r="6"/><path d="M5 8l2 2 4-4" stroke="white" fill="none"/></svg>
      技能管理
    </a>
    <a class="nav-item" href="ddw-agents.html">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="4" width="10" height="8" rx="1"/></svg>
      数字员工
    </a>
    <a class="nav-item active" href="ddw-hris.html">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1l2 3 3 .5-2 2 .5 3-3-1.5L5 9.5l.5-3-2-2 3-.5z"/></svg>
      HRIS 集成
    </a>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="crumb"><span>HRIS 集成</span></div>
      <div class="topbar-right"><a href="saas-admin.html#/overview">返回控制台</a></div>
    </header>

    <div class="content">
      <div class="adapter-grid" id="adapterGrid"></div>

      <div class="card">
        <div class="card-head">
          <div class="card-title">同步日志</div>
          <div class="card-extra"><button class="btn primary" id="btnManualSync">+ 手动同步</button></div>
        </div>
        <div style="overflow:auto">
          <table class="table">
            <thead><tr><th>时间</th><th>适配器</th><th>操作</th><th>状态</th><th>同步数量</th><th>备注</th></tr></thead>
            <tbody id="logTbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <footer class="app-footer">
      <span>&copy; 2026 武汉锐果互动信息技术有限公司</span>
      <span class="footer-sep">|</span>
      <a href="https://beian.miit.gov.cn/" target="_blank">鄂ICP备2026024883号-1</a>
      <span class="footer-sep">|</span>
      <a href="https://beian.mps.gov.cn/#/query/webSearch?code=42011102006255" target="_blank">鄂公网安备42011102006255号</a>
    </footer>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const ADAPTERS = [
  { id: 'kingdee', name: '金蝶云·星空', short: '金蝶', color: '#1890FF',
    fields: [
      { name: 'base_url', label: '服务器地址', type: 'url', default: 'https://api.kingdee.com' },
      { name: 'app_key', label: 'App Key', type: 'text', required: true },
      { name: 'app_secret', label: 'App Secret', type: 'password', required: true },
      { name: 'tenant_code', label: '租户编码', type: 'text', required: true },
    ] },
  { id: 'wecom', name: '企业微信', short: '企微', color: '#52C41A',
    fields: [
      { name: 'corp_id', label: 'CorpID', type: 'text', required: true },
      { name: 'agent_id', label: 'AgentID', type: 'text', required: true },
      { name: 'secret', label: '应用 Secret', type: 'password', required: true },
    ] },
  { id: 'beisen', name: '北森云 HR', short: '北森', color: '#FAAD14',
    fields: [
      { name: 'base_url', label: 'API 地址', type: 'url', default: 'https://openapi.beisen.com' },
      { name: 'client_id', label: 'Client ID', type: 'text', required: true },
      { name: 'client_secret', label: 'Client Secret', type: 'password', required: true },
      { name: 'env', label: '环境', type: 'select', options: ['prod', 'sandbox'], required: true },
    ] },
  { id: 'feishu', name: '飞书通讯录', short: '飞书', color: '#13C2C2',
    fields: [
      { name: 'app_id', label: 'App ID', type: 'text', required: true },
      { name: 'app_secret', label: 'App Secret', type: 'password', required: true },
      { name: 'bitable_app_token', label: '多维表格 App Token', type: 'text' },
      { name: 'bitable_table_id', label: '多维表格 Table ID', type: 'text' },
    ] },
  { id: 'dingtalk', name: '钉钉智能人事', short: '钉钉', color: '#1890FF',
    fields: [
      { name: 'app_key', label: 'AppKey', type: 'text', required: true },
      { name: 'app_secret', label: 'AppSecret', type: 'password', required: true },
      { name: 'agent_id', label: 'AgentId', type: 'text' },
    ] },
];

const LOGS = [
  { time: '2026-08-01 12:30:01', adapter: 'kingdee', action: 'sync_employees', status: 'ok', count: 248, note: '增量同步完成' },
  { time: '2026-08-01 11:00:12', adapter: 'feishu', action: 'push_training_record', status: 'ok', count: 1, note: '推送至多维表格' },
  { time: '2026-08-01 10:30:00', adapter: 'wecom', action: 'sync_employees', status: 'err', count: 0, note: '应用 Secret 过期' },
  { time: '2026-08-01 09:00:00', adapter: 'dingtalk', action: 'push_training_record', status: 'ok', count: 3, note: '工作通知发送成功' },
  { time: '2026-07-31 18:00:00', adapter: 'beisen', action: 'sync_employees', status: 'ok', count: 156, note: '全量同步' },
];

const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const toast = (m) => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2000); };

function render() {
  $('#adapterGrid').innerHTML = ADAPTERS.map(a => `
    <div class="adapter-card" data-adapter="${a.id}">
      <div class="adapter-head">
        <div class="adapter-logo" style="background:${a.color}">${a.short.charAt(0)}</div>
        <div>
          <div class="adapter-name">${a.name}</div>
          <div class="adapter-meta">${a.fields.length} 个配置项</div>
        </div>
        <div class="adapter-status"><span class="tag warn">未连接</span></div>
      </div>
      <div class="config-form">
        ${a.fields.map(f => `
          <div class="form-row">
            <label>${f.label}${f.required ? ' *' : ''}</label>
            ${f.type === 'select' ? `<select><option value="">请选择</option>${(f.options||[]).map(o => `<option value="${o}">${o}</option>`).join('')}</select>`
            : `<input type="${f.type === 'password' ? 'password' : 'text'}" placeholder="${f.default || ''}">`}
          </div>
        `).join('')}
        <div style="display:flex;gap:8px;margin-top:12px">
          <button class="btn primary" data-act="test" data-id="${a.id}">测试连接</button>
          <button class="btn" data-act="save" data-id="${a.id}">保存</button>
          <button class="btn" data-act="sync" data-id="${a.id}">同步员工</button>
        </div>
      </div>
    </div>
  `).join('');

  $('#logTbody').innerHTML = LOGS.map(l => `
    <tr>
      <td style="color:#666">${l.time}</td>
      <td><span class="tag info">${l.adapter}</span></td>
      <td>${l.action}</td>
      <td><span class="tag ${l.status === 'ok' ? 'ok' : 'err'}">${l.status === 'ok' ? '成功' : '失败'}</span></td>
      <td>${l.count}</td>
      <td style="color:#666">${l.note}</td>
    </tr>
  `).join('');

  $$('[data-act]').forEach(b => b.addEventListener('click', () => {
    const act = b.dataset.act;
    const id = b.dataset.id;
    const ad = ADAPTERS.find(x => x.id === id);
    if (act === 'test') toast('测试连接：' + ad.name + '（演示：连接成功）');
    else if (act === 'save') toast('已保存 ' + ad.name + ' 配置');
    else if (act === 'sync') {
      const count = Math.floor(Math.random() * 200 + 50);
      LOGS.unshift({ time: new Date().toISOString().slice(0, 19).replace('T', ' '), adapter: id, action: 'sync_employees', status: 'ok', count, note: '手动同步' });
      render();
      toast('已同步 ' + count + ' 名员工');
    }
  }));
}

$('#btnManualSync').addEventListener('click', () => {
  if (confirm('同步所有已启用的适配器？')) toast('已下发同步任务（演示）');
});

render();
</script>
</body>
</html>
