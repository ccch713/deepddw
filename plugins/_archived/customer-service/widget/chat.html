<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDW AI 客服</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        /* 聊天按钮 */
        #ddw-chat-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #ddw-chat-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        #ddw-chat-btn svg {
            width: 30px;
            height: 30px;
            fill: white;
        }

        /* 聊天窗口 */
        #ddw-chat-window {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 380px;
            height: 520px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 9998;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 头部 */
        #ddw-chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #ddw-chat-header h3 {
            font-size: 16px;
            font-weight: 600;
        }

        #ddw-chat-close {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            padding: 0 5px;
        }

        #ddw-chat-close:hover {
            opacity: 0.8;
        }

        /* 消息区域 */
        #ddw-chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ddw-message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .ddw-message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ddw-message.assistant {
            align-self: flex-start;
            background: #f0f2f5;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .ddw-message.system {
            align-self: center;
            background: #fff3cd;
            color: #856404;
            font-size: 12px;
            padding: 8px 12px;
        }

        /* 输入区域 */
        #ddw-chat-input {
            padding: 15px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        #ddw-chat-input input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        #ddw-chat-input input:focus {
            border-color: #667eea;
        }

        #ddw-chat-send {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        #ddw-chat-send:hover {
            transform: scale(1.05);
        }

        #ddw-chat-send svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        #ddw-chat-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 加载动画 */
        .ddw-loading {
            display: flex;
            gap: 4px;
            padding: 10px 14px;
        }

        .ddw-loading span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .ddw-loading span:nth-child(1) { animation-delay: -0.32s; }
        .ddw-loading span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* 底部信息 */
        #ddw-chat-footer {
            padding: 10px 15px;
            background: #f8f9fa;
            text-align: center;
            font-size: 11px;
            color: #999;
            border-top: 1px solid #eee;
        }

        #ddw-chat-footer a {
            color: #667eea;
            text-decoration: none;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            #ddw-chat-window {
                width: calc(100% - 20px);
                height: calc(100% - 100px);
                right: 10px;
                bottom: 80px;
            }
        }
    </style>
</head>
<body>
    <!-- 聊天按钮 -->
    <button id="ddw-chat-btn" title="DDW AI 客服">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
        </svg>
    </button>

    <!-- 聊天窗口 -->
    <div id="ddw-chat-window">
        <div id="ddw-chat-header">
            <h3>DDW AI 客服</h3>
            <button id="ddw-chat-close">×</button>
        </div>
        <div id="ddw-chat-messages">
            <div class="ddw-message system">
                欢迎咨询 DDW AI 客服，请问有什么可以帮助您的？
            </div>
        </div>
        <div id="ddw-chat-input">
            <input type="text" id="ddw-chat-text" placeholder="输入您的问题..." />
            <button id="ddw-chat-send">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
        <div id="ddw-chat-footer">
            Powered by <a href="https://ddw-ai.com" target="_blank">DDW AI</a> | 200次免费试用
        </div>
    </div>

    <script>
    (function() {
        // 配置
        const CONFIG = {
            apiUrl: window.DDW_CHAT_API_URL || 'http://localhost:8500/api/v1/plugins/customer-service',
            sessionId: null,
            isOpen: false,
            isLoading: false
        };

        // DOM 元素
        const chatBtn = document.getElementById('ddw-chat-btn');
        const chatWindow = document.getElementById('ddw-chat-window');
        const chatClose = document.getElementById('ddw-chat-close');
        const chatMessages = document.getElementById('ddw-chat-messages');
        const chatText = document.getElementById('ddw-chat-text');
        const chatSend = document.getElementById('ddw-chat-send');

        // 初始化
        function init() {
            // 生成会话 ID
            CONFIG.sessionId = 'session_' + Math.random().toString(36).substr(2, 9);
            
            // 绑定事件
            chatBtn.addEventListener('click', toggleChat);
            chatClose.addEventListener('click', toggleChat);
            chatSend.addEventListener('click', sendMessage);
            chatText.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
        }

        // 切换聊天窗口
        function toggleChat() {
            CONFIG.isOpen = !CONFIG.isOpen;
            chatWindow.style.display = CONFIG.isOpen ? 'flex' : 'none';
            if (CONFIG.isOpen) {
                chatText.focus();
            }
        }

        // 发送消息
        async function sendMessage() {
            const message = chatText.value.trim();
            if (!message || CONFIG.isLoading) return;

            // 添加用户消息
            addMessage('user', message);
            chatText.value = '';
            chatSend.disabled = true;
            CONFIG.isLoading = true;

            // 显示加载动画
            const loadingId = showLoading();

            try {
                // 调用 API
                const response = await fetch(`${CONFIG.apiUrl}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: message,
                        session_id: CONFIG.sessionId
                    })
                });

                // 移除加载动画
                removeLoading(loadingId);

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || '请求失败');
                }

                const data = await response.json();
                
                // 更新会话 ID
                CONFIG.sessionId = data.session_id;

                // 添加 AI 回复
                addMessage('assistant', data.answer);

            } catch (error) {
                removeLoading(loadingId);
                addMessage('system', `错误: ${error.message}`);
            } finally {
                chatSend.disabled = false;
                CONFIG.isLoading = false;
                chatText.focus();
            }
        }

        // 添加消息
        function addMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `ddw-message ${role}`;
            messageDiv.textContent = content;
            chatMessages.appendChild(messageDiv);
            
            // 滚动到底部
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // 显示加载动画
        function showLoading() {
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'ddw-loading';
            loadingDiv.id = 'ddw-loading-' + Date.now();
            loadingDiv.innerHTML = '<span></span><span></span><span></span>';
            chatMessages.appendChild(loadingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return loadingDiv.id;
        }

        // 移除加载动画
        function removeLoading(id) {
            const loadingDiv = document.getElementById(id);
            if (loadingDiv) {
                loadingDiv.remove();
            }
        }

        // 初始化
        init();
    })();
    </script>
</body>
</html>
