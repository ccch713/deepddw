name: ddw-sales-copilot
license: commercial
tier: beta
version: 1.0.0
display_name: DDW 销售端 AI 副驾驶
description: 销售端 CRM AI 能力插件。聚合 P0-1~P3-3 的数据，提供商机阶段建议、客户风险提示、行动建议、销售日报/周报生成。AI 推理走平台 embedded_llm，不创建任何新表。
engine: plugin_base
isolation: inline

permissions:
  - database.read
  - llm.invoke

dependencies:
  plugins:
    - ddw-company-profile
    - ddw-contact-hub
    - ddw-opportunity
    - ddw-quotation
    - ddw-sales-note
    - ddw-voice-capture
    - ddw-sales-dashboard

config_schema:
  type: object
  properties:
    default_tenant_id:
      type: integer
      default: 1
    recent_note_limit:
      type: integer
      default: 5
      description: 阶段建议 / 风险评估读取的最近拜访记录条数
    stale_threshold_days:
      type: integer
      default: 14
      description: 超过多少天无活动视为高风险商机
    moderate_threshold_days:
      type: integer
      default: 7
      description: 超过多少天无活动视为中风险商机
    llm_max_tokens:
      type: integer
      default: 512
      description: LLM 单次调用最大生成 token 数

router_prefix: /api/v1/plugins/ddw-sales-copilot
