[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
line-length = 110
extend-exclude = ["data", "output", "audio_queue"]

[tool.ruff.lint]
# 兼容 Python 3.9 写法（typing.Optional/Union 代替 PEP 604 `X | None`）
ignore = [
    "UP045",  # Optional[X] -> X | None
    "UP007",  # Union[X, Y] -> X | Y
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ005", "S101", "PLR2004"]
