name: ddw-receivable
license: commercial
tier: core
version: 1.0.0
display_name: DDW 应收管理
description: 销售端应收（Receivable）全生命周期管理。应收节点（首款/部署款/验收款/续费款）、部分收款与全额收款、逾期自动标记、统计概览（应收 / 已收 / 未收 / 逾期）。与企业/订单/合同可选关联，ON DELETE SET NULL。
engine: plugin_base
isolation: inline

permissions:
  - database.read
  - database.write

dependencies:
  plugins: []

config_schema:
  type: object
  properties:
    default_tenant_id:
      type: integer
      default: 1
    default_page_size:
      type: integer
      default: 20
    statuses:
      type: array
      default: [pending, partial, paid, overdue]
      description: 应收状态枚举
    node_names:
      type: array
      default: [首款, 部署款, 验收款, 续费款, 尾款]
      description: 常见节点名称（仅展示参考，不强制）

router_prefix: /api/v1/plugins/ddw-receivable
