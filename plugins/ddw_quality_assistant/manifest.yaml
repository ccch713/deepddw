name: ddw-quality-assistant
tier: beta
version: 1.0.0
description: "DDW 质量小助手 — 8D/CAPA/偏差/投诉回复/5Why AI辅助生成"
author: "DDW Team"
license: commercial
type: plugin
adapter:
  type: "quality"
  vendor: "ddw"
  protocol: "internal"
dependencies:
  plugins:
    ddw-core: ">=2.0.0"
config:
  optional:
    llm_provider:
      default: "mimo"
      description: "LLM 提供商"
    default_language:
      default: "zh-CN"
      description: "默认输出语言"
    max_tokens:
      default: 4000
      description: "单次生成最大token数"
routes:
  - prefix: /api/v1/plugins/ddw-quality-assistant
    router: router:router
