<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DDW Pal · 员工 AI 工作窗口</title>
<style>
  :root {
    --bg-page: #f5f7fa; --bg-card: #ffffff; --bg-sidebar: #001529;
    --text-primary: #1f2937; --text-secondary: #6b7280; --text-muted: #9ca3af;
    --brand: #1890FF; --border: #e5e7eb; --danger: #e5484d; --ok: #16a34a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg-page); color: var(--text-primary); }
  .pal-app { display: flex; height: 100vh; overflow: hidden; }

  /* ===== 左侧栏 ===== */
  .pal-sidebar { width: 220px; background: var(--bg-sidebar); color: rgba(255,255,255,0.85); display: flex; flex-direction: column; flex-shrink: 0; }
  .pal-logo { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 15px; font-weight: 600; }
  .pal-logo .logo-mark { width: 28px; height: 28px; background: var(--brand); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--text-inverse); }
  .nav-group { padding: 12px 0; }
  .nav-title { color: rgba(255,255,255,0.45); font-size: 12px; padding: 0 16px 8px; }
  .nav-item { display: flex; align-items: center; height: 38px; padding: 0 16px; font-size: 13.5px; cursor: pointer; gap: 8px; }
  .nav-item:hover { background: rgba(255,255,255,0.06); }
  .nav-item.active { background: var(--brand); color: var(--text-inverse); }
  .nav-item .nav-icon { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.9; }
  .nav-item .sub { margin-left: auto; font-size: 11px; color: rgba(255,255,255,0.4); }
  .nav-item:hover .sub { color: rgba(255,255,255,0.7); }
  .pal-sidebar .spacer { flex: 1; }
  .side-footer { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 11px; color: rgba(255,255,255,0.35); line-height: 1.6; }

  /* ===== 主区 ===== */
  .pal-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .pal-topbar { height: 56px; background: var(--bg-card); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 12px; }
  .pal-crumb { font-size: 14px; color: var(--text-secondary); }
  .pal-crumb b { color: var(--text-primary); }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }

  .user-menu { position: relative; }
  .user-chip-btn { display: flex; align-items: center; gap: 8px; background: none; border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; font-size: 13.5px; color: var(--text-primary); cursor: pointer; }
  .user-chip-btn:hover { border-color: var(--brand); }
  .user-avatar { width: 26px; height: 26px; background: var(--brand); color: var(--text-inverse); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
  .tag { font-size: 11px; padding: 1px 8px; border-radius: 10px; }
  .tag.info { background: var(--brand-light); color: var(--brand); }
  .user-dropdown { position: absolute; right: 0; top: calc(100% + 6px); min-width: 250px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); z-index: 100; padding: 6px; }
  .dd-head { padding: 8px 10px; font-size: 12.5px; color: var(--text-secondary); border-bottom: 1px solid #f0f0f0; margin-bottom: 4px; word-break: break-all; }
  .dd-tenants { max-height: 200px; overflow-y: auto; }
  .dd-item { display: flex; align-items: center; gap: 6px; padding: 8px 10px; font-size: 13px; color: var(--text-primary); text-decoration: none; border-radius: 6px; cursor: pointer; }
  .dd-item:hover { background: var(--bg-hover); }
  .dd-item.danger { color: var(--danger); }
  .dd-item.danger:hover { background: var(--danger-bg); }
  .dd-tenant { justify-content: space-between; }
  .dd-tenant.active { background: var(--brand-light); color: var(--brand); }
  .dd-tenant-role { font-size: 11px; color: var(--text-muted); }
  .dd-check { color: var(--brand); font-size: 12px; }
  .dd-empty { padding: 8px 10px; font-size: 12px; color: var(--text-muted); }
  .dd-sep { height: 1px; background: var(--border-light); margin: 4px 0; }

  /* ===== 聊天区 ===== */
  .chat-area { flex: 1; overflow-y: auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; }
  .chat-empty { margin: auto; text-align: center; color: var(--text-muted); }
  .chat-empty .big { font-size: 40px; margin-bottom: 10px; }
  .chat-empty h2 { font-size: 18px; color: var(--text-secondary); margin-bottom: 6px; }
  .chat-empty p { font-size: 13px; }
  .msg { display: flex; gap: 10px; max-width: 780px; }
  .msg .bubble { padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.user .bubble { background: var(--brand); color: var(--text-inverse); border-top-right-radius: 2px; }
  .msg.assistant { align-self: flex-start; }
  .msg.assistant .bubble { background: var(--bg-card); border: 1px solid var(--border); border-top-left-radius: 2px; }
  .msg .meta { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
  .msg.user .meta { text-align: right; }
  .typing .bubble::after { content: '…'; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }

  /* ===== 输入栏 ===== */
  .chat-input-bar { border-top: 1px solid var(--border); background: var(--bg-card); padding: 14px 20px 16px; }
  .input-row { display: flex; gap: 10px; max-width: 900px; margin: 0 auto; align-items: flex-end; }
  .input-row textarea { flex: 1; height: 46px; max-height: 140px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; font-family: inherit; resize: none; outline: none; line-height: 1.5; }
  .input-row textarea:focus { border-color: var(--brand); }
  .btn-send { height: 46px; padding: 0 22px; background: var(--brand); color: var(--text-inverse); border: none; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; }
  .btn-send:disabled { opacity: 0.5; cursor: not-allowed; }
  .input-hint { max-width: 900px; margin: 6px auto 0; font-size: 11.5px; color: var(--text-muted); }

  /* ===== 弹窗 ===== */
  .modal-mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1000; align-items: center; justify-content: center; }
  .modal-mask.active { display: flex; }
  .modal { background: var(--bg-card); border-radius: 14px; padding: 24px; width: 92%; max-width: 560px; max-height: 86vh; overflow-y: auto; box-shadow: 0 12px 40px rgba(0,0,0,0.25); }
  .modal h3 { font-size: 16px; margin-bottom: 14px; }
  .form-row { margin-bottom: 12px; }
  .form-row label { display: block; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 5px; }
  .form-row input, .form-row textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13.5px; font-family: inherit; outline: none; }
  .form-row input:focus, .form-row textarea:focus { border-color: var(--brand); }
  .form-row textarea { min-height: 130px; resize: vertical; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.6; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  .btn { padding: 8px 18px; border-radius: 8px; font-size: 13.5px; cursor: pointer; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary); }
  .btn.primary { background: var(--brand); color: var(--text-inverse); border-color: var(--brand); }
  .btn.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .modal-close { float: right; border: none; background: none; font-size: 20px; color: var(--text-muted); cursor: pointer; line-height: 1; }

  .skill-list { display: flex; flex-direction: column; gap: 8px; padding: 0 10px 12px; }
  .skill-item { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .skill-item .name { font-size: 13.5px; font-weight: 500; }
  .skill-item .trigger { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; word-break: break-all; }
  .skill-empty { padding: 16px; text-align: center; color: var(--text-muted); font-size: 12.5px; }

  .toast-host { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 2000; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast { background: rgba(0,0,0,0.78); color: var(--text-inverse); padding: 9px 18px; border-radius: 20px; font-size: 13px; }
  .toast.ok { background: rgba(22,163,74,0.92); }
  .toast.err { background: rgba(229,72,77,0.92); }

  /* ===== 移动端适配 ===== */
  .menu-toggle { display: none; background: none; border: 1px solid var(--border); color: var(--text-primary); font-size: 18px; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
  .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 49; }
  .sidebar-overlay.active { display: block; }

  /* 768px 平板/小屏：侧栏变抽屉，顶部栏简化 */
  @media (max-width: 768px) {
    .pal-sidebar { position: fixed; left: -240px; top: 0; bottom: 0; width: 240px; z-index: 50; transition: left 0.2s; box-shadow: 2px 0 12px rgba(0,0,0,0.25); display: flex; }
    .pal-sidebar.open { left: 0; }
    .menu-toggle { display: inline-block; }
    .pal-topbar { padding: 0 12px; height: 50px; gap: 8px; }
    .pal-crumb { font-size: 13px; }
    .chat-area { padding: 14px 12px; gap: 10px; }
    .msg { max-width: 100%; }
    .chat-input-bar { padding: 10px 12px 12px; }
    .input-row { gap: 8px; }
  }

  /* 480px 手机：聊天气泡全宽，字体缩小，输入栏贴底 */
  @media (max-width: 480px) {
    .pal-topbar { padding: 0 10px; height: 46px; }
    .pal-crumb { font-size: 12px; }
    .user-chip-btn { padding: 3px 8px; font-size: 12px; }
    .user-chip-btn .tag { display: none; }
    .chat-area { padding: 10px 8px; gap: 8px; }
    .msg { gap: 6px; }
    .msg .bubble { font-size: 13px; padding: 9px 12px; line-height: 1.6; border-radius: 8px; }
    .msg .meta { font-size: 10px; }
    .chat-empty .big { font-size: 32px; }
    .chat-empty h2 { font-size: 16px; }
    .chat-empty p { font-size: 12px; }
    .chat-input-bar { padding: 8px 8px 10px; position: sticky; bottom: 0; z-index: 10; }
    .chat-input-bar::before { content: ''; position: absolute; top: -10px; left: 0; right: 0; height: 10px; background: linear-gradient(180deg, transparent, var(--bg-card)); pointer-events: none; }
    .input-row textarea { height: 40px; font-size: 13px; padding: 10px 12px; }
    .btn-send { height: 40px; padding: 0 16px; font-size: 13px; }
    .input-hint { font-size: 10.5px; margin: 4px auto 0; }
    .modal { width: 96%; padding: 18px; }
    .modal h3 { font-size: 15px; }
  }

  /* 360px 极小屏：进一步压缩 */
  @media (max-width: 360px) {
    .pal-sidebar { width: 200px; left: -200px; }
    .msg .bubble { font-size: 12.5px; padding: 8px 10px; }
    .btn-send { padding: 0 12px; font-size: 12px; }
  }
</style>

<script src="/js/api.js?v=20260811a"></script>
<script>
(function () {
  'use strict';
  const $ = (s) => document.querySelector(s);

  // ===== 守卫 =====
  if (!DDW.api.getToken()) { location.href = '/login.html'; return; }

  let ME = null;          // /auth/me 结果
  let conversationId = null;
  let sending = false;
  let currentChatCount = 0;

  // 生成会话 ID（后端不回传，前端持有保证多轮连贯）
  function genConvId() {
    return 'conv_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
  }

  // ===== Toast =====
  function toast(msg, type) {
    let host = document.getElementById('toast-host');
    if (!host) { host = document.createElement('div'); host.className = 'toast-host'; host.id = 'toast-host'; document.body.appendChild(host); }
    const el = document.createElement('div');
    el.className = 'toast' + (type ? ' ' + type : '');
    el.textContent = msg;
    host.appendChild(el);
    setTimeout(() => { el.style.transition = 'opacity .25s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 260); }, 2600);
  }

  // ===== 用户芯片 + 租户切换 =====
  function roleLabel(role) {
    const m = { superadmin: '超级管理员', owner: '公司管理员', admin: '部门管理员', partner: '经销商', member: '成员', user: '成员' };
    return m[role] || role || '成员';
  }
  let PERMS = {};
  function renderUserChip(u, perms, tenantName) {
    PERMS = perms || {};
    const name = u.name || '?';
    // 右上角显示：用户名 + 当前环境（如：江昆鹏 祥云 demo）
    const envName = tenantName || '';
    const chipText = name + (envName ? ' ' + envName : '');
    $('#chipAvatar').textContent = name.charAt(0);
    $('#chipName').textContent = chipText;
    $('#chipRole').textContent = roleLabel(u.role);
    $('#ddHead').textContent = chipText + ' · ' + roleLabel(u.role);
    // 角色相关入口：一律消费后端 permissions，禁止前端自行判断 role（铁律3）
    if (PERMS.can_access_admin) $('#navAdmin').style.display = 'flex';
    if (PERMS.can_manage_partner_demo) $('#navPartner').style.display = 'flex';
  }
  $('#userChipBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    const dd = $('#userDropdown');
    dd.style.display = dd.style.display === 'none' ? 'block' : 'none';
    loadTenantOptions();
  });
  document.addEventListener('click', function () { $('#userDropdown').style.display = 'none'; });
  $('#btnLogout').addEventListener('click', function (e) {
    e.stopPropagation();
    localStorage.clear();
    try { document.cookie = 'ddw_logged_in=; Domain=.9cio.com; Path=/; Max-Age=0'; } catch (err) {}
    location.href = '/index.html';
  });

  async function loadTenantOptions() {
    const box = $('#ddTenants');
    try {
      const r = await DDW.api.get('/auth/me');
      const list = (r.data && r.data.tenants) || [];
      if (!list.length) { box.innerHTML = '<div class="dd-empty">无其他身份</div>'; return; }
      const curId = r.data.tenant && r.data.tenant.id;
      box.innerHTML = list.map(function (t) {
        const active = t.tenant_id === curId ? ' active' : '';
        return '<a href="javascript:void(0)" class="dd-item dd-tenant' + active + '" data-tid="' + t.tenant_id + '">' +
          '<span>' + t.name + '</span>' +
          '<span style="display:flex;gap:6px;align-items:center"><span class="dd-tenant-role">' + roleLabel(t.role) + '</span>' + (t.tenant_id === curId ? '<span class="dd-check">✓</span>' : '') + '</span>' +
        '</a>';
      }).join('');
      box.querySelectorAll('.dd-tenant').forEach(function (el) {
        el.addEventListener('click', async function (e) {
          e.stopPropagation();
          const tid = parseInt(el.dataset.tid, 10);
          if (tid === curId) return;
          try {
            const resp = await DDW.api.post('/auth/switch-tenant', { tenant_id: tid });
            if (resp.ok && resp.data && resp.data.access_token) {
              DDW.api.setToken(resp.data.access_token);
              localStorage.setItem('ddw_user', JSON.stringify(resp.data.user));
              localStorage.setItem('ddw_tenant', JSON.stringify(resp.data.tenant));
              toast('已切换身份，正在刷新…', 'ok');
              setTimeout(function () { location.reload(); }, 600);
            } else {
              toast('切换失败：' + (resp.message || '未知错误'), 'err');
            }
          } catch (err) { toast('切换失败：' + err.message, 'err'); }
        });
      });
    } catch (err) {
      box.innerHTML = '<div class="dd-empty">加载身份失败</div>';
    }
  }

  // ===== 聊天 =====
  function addMsg(role, content, meta) {
    const area = $('#chatArea');
    const empty = area.querySelector('.chat-empty');
    if (empty) empty.remove();
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.innerHTML = '<div><div class="bubble"></div>' + (meta ? '<div class="meta">' + meta + '</div>' : '') + '</div>';
    div.querySelector('.bubble').textContent = content;
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
    if (role === 'assistant') currentChatCount++;
    $('#historyCount').textContent = currentChatCount ? currentChatCount + ' 条' : '';
    return div;
  }

  async function sendMessage(text) {
    if (sending) return;
    sending = true;
    $('#btnSend').disabled = true;
    addMsg('user', text);
    $('#chatInput').value = '';
    const typing = document.createElement('div');
    typing.className = 'msg assistant typing';
    typing.innerHTML = '<div><div class="bubble">正在思考</div></div>';
    $('#chatArea').appendChild(typing);
    $('#chatArea').scrollTop = $('#chatArea').scrollHeight;
    try {
      if (!conversationId) conversationId = genConvId();
      const resp = await DDW.api.post('/chat/', { message: text, conversation_id: conversationId });
      typing.remove();
      if (resp.ok && resp.data) {
        const meta = '模型 ' + (resp.data.model || '-') + ' · ' + (resp.data.provider || '-') +
          (resp.data.tokens_in ? ' · ' + resp.data.tokens_in + ' in / ' + resp.data.tokens_out + ' out' : '');
        addMsg('assistant', resp.data.content || '(空回复)', meta);
      } else {
        addMsg('assistant', '请求失败：' + (resp.message || '未知错误'));
      }
    } catch (err) {
      typing.remove();
      addMsg('assistant', '网络错误：' + err.message);
    }
    sending = false;
    $('#btnSend').disabled = false;
    $('#chatInput').focus();
  }

  $('#btnSend').addEventListener('click', function () {
    const text = $('#chatInput').value.trim();
    if (text) sendMessage(text);
  });
  $('#chatInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const text = this.value.trim();
      if (text) sendMessage(text);
    }
  });

  // 新建对话
  $('#navNewChat').addEventListener('click', function () {
    conversationId = null;
    currentChatCount = 0;
    $('#historyCount').textContent = '';
    $('#chatArea').innerHTML = '<div class="chat-empty"><div class="big">🤖</div><h2>你好，我是 DDW Pal</h2><p>你的 AI 工作窗口 —— 数据分析、知识问答、业务助手</p></div>';
    $('#chatInput').focus();
  });

  // ===== Skill =====
  function openSkillModal() { $('#skillModal').classList.add('active'); }
  function closeSkillModal() { $('#skillModal').classList.remove('active'); }
  $('#navCreateSkill').addEventListener('click', openSkillModal);
  $('#skillModalClose').addEventListener('click', closeSkillModal);
  $('#skillCancel').addEventListener('click', closeSkillModal);
  $('#skillModal').addEventListener('click', function (e) { if (e.target === this) closeSkillModal(); });

  $('#navMySkills').addEventListener('click', async function () {
    const area = $('#chatArea');
    area.innerHTML = '<div class="chat-empty"><p>加载 Skill 列表…</p></div>';
    try {
      const r = await DDW.api.get('/skills');
      const list = (r.ok && r.data) ? r.data : [];
      if (!list.length) {
        area.innerHTML = '<div class="chat-empty"><div class="big">📚</div><h2>还没有 Skill</h2><p>点击左侧“创建 Skill”开始建立你的第一个技能</p></div>';
        return;
      }
      area.innerHTML = '<div style="max-width:780px;align-self:flex-start;width:100%"><h3 style="margin-bottom:12px">我的 Skill（' + list.length + '）</h3><div class="skill-list">' +
        list.map(function (s) {
          return '<div class="skill-item"><div class="name">' + (s.name || '未命名') + '</div>' + (s.trigger ? '<div class="trigger">触发词：' + s.trigger + '</div>' : '') + '</div>';
        }).join('') + '</div></div>';
      $('#crumb').textContent = '我的 Skill';
    } catch (err) {
      area.innerHTML = '<div class="chat-empty"><p>加载失败：' + err.message + '</p></div>';
    }
  });

  $('#skillSave').addEventListener('click', async function () {
    const name = $('#skillName').value.trim();
    const content = $('#skillContent').value.trim();
    if (!name || !content) { toast('名称和内容必填', 'err'); return; }
    const btn = $('#skillSave');
    btn.disabled = true;
    try {
      const r = await DDW.api.post('/skills', { name: name, content: content, trigger: $('#skillTrigger').value.trim() || null });
      if (r.ok && r.data) {
        toast('Skill 已保存', 'ok');
        closeSkillModal();
        $('#skillName').value = ''; $('#skillTrigger').value = ''; $('#skillContent').value = '';
        $('#navMySkills').click();
      } else {
        toast('保存失败：' + (r.message || '未知错误'), 'err');
      }
    } catch (err) { toast('保存失败：' + err.message, 'err'); }
    btn.disabled = false;
  });

  // ===== 数字员工 =====
  async function loadAgents() {
    const box = $('#agentList');
    try {
      const r = await DDW.api.get('/org/agents');
      const list = (r.ok && r.data) ? r.data : [];
      if (!list.length) { box.innerHTML = '<div class="nav-item" style="opacity:0.6">暂无数字员工</div>'; return; }
      box.innerHTML = list.map(function (a) {
        return '<div class="nav-item" data-agent="' + (a.id || '') + '"><span class="nav-icon">🤖</span>' + (a.name || '未命名') +
          (a.status === 'online' ? '<span class="sub">●</span>' : '') + '</div>';
      }).join('');
      box.querySelectorAll('.nav-item').forEach(function (el) {
        el.addEventListener('click', function () {
          const name = el.textContent.trim().replace('●', '').trim();
          $('#chatInput').value = '@' + name + ' ';
          $('#chatInput').focus();
        });
      });
    } catch (err) {
      box.innerHTML = '<div class="nav-item" style="opacity:0.6">加载失败</div>';
    }
  }

  // ===== 初始化 =====
  async function init() {
    try {
      const r = await DDW.api.get('/auth/me');
      if (r.ok && r.data) {
        ME = r.data;
        renderUserChip(ME.user || {}, ME.permissions || {}, (ME.tenant && ME.tenant.name) || '');
        if (ME.tenant) {
          try { localStorage.setItem('ddw_user', JSON.stringify(ME.user)); } catch (e) {}
          try { localStorage.setItem('ddw_tenant', JSON.stringify(ME.tenant)); } catch (e) {}
        }
      }
    } catch (err) { /* 保持默认 */ }
    loadAgents();
    $('#chatInput').focus();
  }
  init();
})();
</script>
</body>
</html>
