name: six-thinking-moves
description: 苏格拉底 6 思维动作（布鲁姆高阶）
moves:
  - id: 1
    name: observe
    display: 观察
    prompt: 请仔细观察这个现象/图表，你注意到了什么？
    level: remember
    color: "#1890FF"
  - id: 2
    name: question
    display: 提问
    prompt: 关于你观察到的，你有什么疑问？
    level: understand
    color: "#13C2C2"
  - id: 3
    name: hypothesize
    display: 假设
    prompt: 根据已有知识，你认为可能的解释是什么？
    level: apply
    color: "#52C41A"
  - id: 4
    name: investigate
    display: 探究
    prompt: 我们来设计一个实验/推理来验证你的假设
    level: analyze
    color: "#FAAD14"
  - id: 5
    name: evaluate
    display: 评价
    prompt: 你的假设被验证了吗？证据支持还是反驳了你的想法？
    level: evaluate
    color: "#FA541C"
  - id: 6
    name: synthesize
    display: 综合
    prompt: 总结我们今天学到了什么，和之前的知识有什么联系？
    level: create
    color: "#722ED1"
