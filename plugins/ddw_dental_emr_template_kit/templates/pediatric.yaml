type: pediatric
name: 儿牙病历
version: "1.0"
required_fields:
  - chief_complaint
  - present_illness
  - patient_age
  - tooth_type
  - tooth_position
  - chief_concern
  - cooperation
  - parent_involved

fields:
  chief_complaint:
    label: 主诉
    type: text
    max_length: 200
    required: true
  present_illness:
    label: 现病史
    type: text
    max_length: 1000
    required: true
  past_history:
    label: 既往史
    type: text
    max_length: 500
    required: false
  patient_age:
    label: 患者年龄
    type: number
    required: true
  tooth_type:
    label: 牙列类型
    type: select
    options: [primary, mixed, permanent]
    required: true
  tooth_position:
    label: 牙位
    type: text
    required: true
  chief_concern:
    label: 主要诉求
    type: select
    options: [caries, trauma, malposition, preventive]
    required: true
  cooperation:
    label: 配合度
    type: select
    options: [good, fair, poor, requires_sedation]
    required: true
  fluoride_treatment:
    label: 涂氟
    type: boolean
    required: false
  sealant_applied:
    label: 窝沟封闭
    type: boolean
    required: false
  pulpotomy_done:
    label: 牙髓切断
    type: boolean
    required: false
  ssc_required:
    label: 预成冠
    type: boolean
    required: false
  parent_involved:
    label: 家长参与度
    type: select
    options: [high, medium, low]
    required: true

display_order:
  - chief_complaint
  - present_illness
  - past_history
  - patient_age
  - tooth_type
  - tooth_position
  - chief_concern
  - cooperation
  - fluoride_treatment
  - sealant_applied
  - pulpotomy_done
  - ssc_required
  - parent_involved
