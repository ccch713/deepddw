<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>插件论坛 · DDW AI Hub</title>
<link rel="stylesheet" href="./css/theme.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231a1a2e'/><text x='50%' y='55%' font-family='Arial' font-size='20' font-weight='800' fill='%23e8b86d' text-anchor='middle' dominant-baseline='middle'>D</text></svg>">
<style>
  .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--c-text-muted); font-size: 14px; margin-bottom: 16px; }
  .back-link:hover { color: var(--c-accent); }
  .plugin-header { background: var(--c-bg-alt); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow-sm); margin-bottom: 24px; }
  .plugin-header .ph-title { font-size: 22px; font-weight: 800; color: var(--c-bg-dark); margin: 0 0 4px; }
  .plugin-header .ph-name { font-size: 13px; color: var(--c-text-muted); margin: 0 0 12px; }
  .plugin-header .ph-meta { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--c-text-muted); flex-wrap: wrap; }
  .plugin-header .ph-stars { color: #e8a200; font-weight: 700; font-size: 16px; }
  .plugin-header .ph-badge { display: inline-block; padding: 3px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--c-bg-dark); color: var(--c-accent); }
  .star-picker { display: inline-flex; gap: 2px; cursor: pointer; }
  .star-picker span { font-size: 20px; color: #ddd; transition: color .1s; }
  .star-picker span.active, .star-picker span:hover { color: #e8a200; }
  .tabs { display: flex; gap: 0; border-bottom: 2px solid var(--c-border); margin-bottom: 20px; }
  .tab-btn { padding: 10px 20px; font-size: 14px; font-weight: 600; color: var(--c-text-muted); background: none; border: none; border-bottom: 2px solid transparent; margin-bottom: -2px; cursor: pointer; transition: all .15s; }
  .tab-btn.active { color: var(--c-bg-dark); border-bottom-color: var(--c-accent); }
  .tab-btn:hover { color: var(--c-bg-dark); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .thread-list { display: flex; flex-direction: column; gap: 10px; }
  .thread-item { background: var(--c-bg-alt); border-radius: var(--radius-sm); padding: 16px 18px; box-shadow: var(--shadow-sm); cursor: pointer; transition: box-shadow .15s; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .thread-item:hover { box-shadow: var(--shadow); }
  .thread-item .ti-title { font-size: 15px; font-weight: 600; color: var(--c-bg-dark); flex: 1; }
  .thread-item .ti-title .pin-badge { color: var(--c-accent); font-size: 12px; margin-right: 6px; }
  .thread-item .ti-title .hot-badge { color: #e85d00; font-size: 12px; margin-left: 6px; }
  .thread-item .ti-meta { display: flex; gap: 14px; font-size: 12px; color: var(--c-text-muted); white-space: nowrap; }
  .btn-new-thread { margin-bottom: 16px; }
  /* 弹窗 */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200; place-items: center; }
  .modal-overlay.show { display: grid; }
  .modal { background: var(--c-bg-alt); border-radius: var(--radius); padding: 28px; width: 480px; max-width: 90vw; box-shadow: var(--shadow-lg); }
  .modal h3 { margin: 0 0 16px; font-size: 18px; }
  .modal label { display: block; font-size: 13px; font-weight: 600; color: var(--c-text-muted); margin-bottom: 4px; }
  .modal input, .modal textarea { width: 100%; padding: 8px 12px; border: 1.5px solid var(--c-border); border-radius: var(--radius-sm); font-size: 14px; font-family: inherit; outline: none; margin-bottom: 12px; }
  .modal input:focus, .modal textarea:focus { border-color: var(--c-accent); }
  .modal textarea { min-height: 100px; resize: vertical; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  /* 帖子详情 */
  .thread-detail { background: var(--c-bg-alt); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow-sm); margin-bottom: 20px; }
  .thread-detail h3 { margin: 0 0 8px; font-size: 18px; }
  .thread-detail .td-content { color: var(--c-text); line-height: 1.7; margin: 12px 0; white-space: pre-wrap; }
  .thread-detail .td-meta { font-size: 12px; color: var(--c-text-muted); }
  .reply-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
  .reply-item { background: var(--c-bg-alt); border-radius: var(--radius-sm); padding: 14px 18px; box-shadow: var(--shadow-sm); }
  .reply-item .ri-author { font-weight: 600; font-size: 13px; color: var(--c-bg-dark); }
  .reply-item .ri-time { font-size: 11px; color: var(--c-text-muted); margin-left: 8px; }
  .reply-item .ri-content { margin-top: 6px; font-size: 14px; color: var(--c-text); line-height: 1.6; white-space: pre-wrap; }
  .reply-box { background: var(--c-bg-alt); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-sm); }
  .reply-box textarea { width: 100%; min-height: 70px; padding: 8px 12px; border: 1.5px solid var(--c-border); border-radius: var(--radius-sm); font-size: 14px; font-family: inherit; outline: none; resize: vertical; }
  .reply-box textarea:focus { border-color: var(--c-accent); }
  .description-block { background: var(--c-bg-alt); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow-sm); line-height: 1.7; color: var(--c-text); white-space: pre-wrap; }
</style>
</head>
<body>

<div class="admin-layout">
  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <h4>主导航</h4>
    <a href="./admin.html">管理后台</a>
    <a href="./plugin-market.html">插件市场</a>
    <h4>系统</h4>
    <a href="./admin" target="_blank">SQL Admin</a>
    <a href="./docs" target="_blank">API 文档</a>
  </aside>

  <!-- Main -->
  <main class="admin-main">
    <a href="./plugin-market.html" class="back-link">&larr; 返回插件市场</a>

    <!-- 插件头部 -->
    <div class="plugin-header" id="pluginHeader">
      <div style="text-align:center;color:var(--c-text-muted);padding:20px;">加载中...</div>
    </div>

    <!-- Tab 区 -->
    <div class="tabs" id="tabBar">
      <button class="tab-btn active" data-tab="threads">反馈与讨论</button>
      <button class="tab-btn" data-tab="description">插件说明</button>
      <button class="tab-btn" data-tab="version">版本更新</button>
    </div>

    <!-- Tab: 反馈与讨论 -->
    <div class="tab-panel active" id="panel-threads">
      <button class="btn btn-primary btn-sm btn-new-thread" id="btnNewThread">发帖求助</button>
      <div class="thread-list" id="threadList">
        <div style="color:var(--c-text-muted);padding:20px;">加载中...</div>
      </div>
    </div>

    <!-- Tab: 插件说明 -->
    <div class="tab-panel" id="panel-description">
      <div class="description-block" id="descBlock">加载中...</div>
    </div>

    <!-- Tab: 版本更新 -->
    <div class="tab-panel" id="panel-version">
      <div class="description-block" id="versionBlock">加载中...</div>
    </div>

    <!-- 帖子详情（隐藏，点击后展开） -->
    <div id="threadDetailView" style="display:none;">
      <a href="#" class="back-link" id="backToList">&larr; 返回帖子列表</a>
      <div class="thread-detail" id="threadDetail"></div>
      <h4 style="margin:0 0 12px;font-size:15px;">回复</h4>
      <div class="reply-list" id="replyList"></div>
      <div class="reply-box">
        <textarea id="replyContent" placeholder="写下你的回复..."></textarea>
        <div style="text-align:right;margin-top:8px;">
          <button class="btn btn-primary btn-sm" id="btnReply">提交回复</button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- 发帖弹窗 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>发帖求助</h3>
    <label>标题</label>
    <input type="text" id="threadTitle" placeholder="简要描述你的问题">
    <label>内容</label>
    <textarea id="threadContent" placeholder="详细描述问题..."></textarea>
    <div class="modal-actions">
      <button class="btn btn-outline btn-sm" id="btnCancel">取消</button>
      <button class="btn btn-primary btn-sm" id="btnSubmit">发布</button>
    </div>
  </div>
</div>

<script>
const API = '/api/v1';
const params = new URLSearchParams(location.search);
const pluginName = params.get('plugin') || '';
let currentThreadId = null;

function getToken() {
  return localStorage.getItem('ddw_token') || sessionStorage.getItem('ddw_token') || '';
}

function authHeaders() {
  const t = getToken();
  return t ? { 'Authorization': 'Bearer ' + t, 'Content-Type': 'application/json' } : { 'Content-Type': 'application/json' };
}

async function apiFetch(path, opts = {}) {
  const resp = await fetch(API + path, { headers: { ...authHeaders() }, ...opts });
  if (resp.status === 401) {
    window.location.href = './welcome.html';
    return null;
  }
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.detail || resp.statusText);
  }
  return resp.json();
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function timeAgo(iso) {
  if (!iso) return '';
  const diff = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return '刚刚';
  if (mins < 60) return mins + ' 分钟前';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + ' 小时前';
  const days = Math.floor(hrs / 24);
  return days + ' 天前';
}

// ---- 插件头部 ----
async function loadPluginHeader() {
  try {
    const data = await apiFetch('/forum/plugins/' + pluginName);
    if (!data) return;
    document.getElementById('pluginHeader').innerHTML = `
      <div class="ph-title">${esc(data.title)}</div>
      <div class="ph-name">${esc(data.plugin_name)}</div>
      <div class="ph-meta">
        <span class="ph-stars">★ ${data.stars.toFixed(1)}</span>
        <span>(${data.star_count} 人评分)</span>
        <span class="ph-badge">${esc(data.category)}</span>
        <span>已安装 ${data.installs} 次</span>
        <span>更新 ${data.updated_at || '—'}</span>
      </div>
      <div style="margin-top:12px;">
        <span style="font-size:13px;color:var(--c-text-muted);margin-right:8px;">我的评分：</span>
        <div class="star-picker" id="starPicker">
          ${[1,2,3,4,5].map(i => `<span data-v="${i}">★</span>`).join('')}
        </div>
      </div>
    `;
    initStarPicker();
    // 说明 / 版本
    document.getElementById('descBlock').textContent = data.description || '暂无说明';
    document.getElementById('versionBlock').textContent = '版本更新日期：' + (data.updated_at || '暂无记录');
  } catch (e) {
    document.getElementById('pluginHeader').innerHTML = '<div style="color:var(--c-danger);">加载失败：' + esc(e.message) + '</div>';
  }
}

function initStarPicker() {
  const picker = document.getElementById('starPicker');
  if (!picker) return;
  const stars = picker.querySelectorAll('span');
  stars.forEach(s => {
    s.addEventListener('click', async () => {
      const v = parseInt(s.dataset.v);
      try {
        await apiFetch('/forum/plugins/' + pluginName + '/star', {
          method: 'POST',
          body: JSON.stringify({ stars: v }),
        });
        stars.forEach((ss, i) => ss.classList.toggle('active', i < v));
        loadPluginHeader();
      } catch (e) {
        alert('评分失败：' + e.message);
      }
    });
    s.addEventListener('mouseenter', () => {
      const v = parseInt(s.dataset.v);
      stars.forEach((ss, i) => ss.style.color = i < v ? '#e8a200' : '#ddd');
    });
  });
  picker.addEventListener('mouseleave', () => {
    stars.forEach(ss => ss.style.color = '');
  });
}

// ---- 帖子列表 ----
async function loadThreads() {
  try {
    const data = await apiFetch('/forum/plugins/' + pluginName + '/threads?sort=new&page=1');
    if (!data) return;
    const list = document.getElementById('threadList');
    if (!data.items.length) {
      list.innerHTML = '<div style="color:var(--c-text-muted);padding:20px;">暂无帖子，点击上方按钮发帖求助</div>';
      return;
    }
    list.innerHTML = data.items.map(t => `
      <div class="thread-item" data-id="${t.id}">
        <div class="ti-title">
          ${t.is_pinned ? '<span class="pin-badge">[置顶]</span>' : ''}
          ${esc(t.title)}
          ${t.is_hot ? '<span class="hot-badge">🔥</span>' : ''}
        </div>
        <div class="ti-meta">
          <span>${esc(t.author_name)}</span>
          <span>${timeAgo(t.created_at)}</span>
          <span>回复 ${t.replies_count}</span>
          <span>浏览 ${t.views}</span>
        </div>
      </div>
    `).join('');
    list.querySelectorAll('.thread-item').forEach(el => {
      el.addEventListener('click', () => showThreadDetail(el.dataset.id));
    });
  } catch (e) {
    document.getElementById('threadList').innerHTML = '<div style="color:var(--c-danger);">加载失败</div>';
  }
}

// ---- 帖子详情 ----
async function showThreadDetail(tid) {
  currentThreadId = tid;
  document.getElementById('panel-threads').style.display = 'none';
  document.getElementById('threadDetailView').style.display = 'block';
  document.getElementById('tabBar').style.display = 'none';
  try {
    const data = await apiFetch('/forum/threads/' + tid);
    if (!data) return;
    document.getElementById('threadDetail').innerHTML = `
      <h3>${esc(data.title)}</h3>
      <div class="td-meta">${esc(data.author_name)} · ${timeAgo(data.created_at)} · 浏览 ${data.views} · 回复 ${data.replies_count}</div>
      <div class="td-content">${esc(data.content)}</div>
    `;
    const replyList = document.getElementById('replyList');
    if (!data.replies.length) {
      replyList.innerHTML = '<div style="color:var(--c-text-muted);font-size:13px;">暂无回复</div>';
    } else {
      replyList.innerHTML = data.replies.map(r => `
        <div class="reply-item">
          <span class="ri-author">${esc(r.author_name)}</span>
          <span class="ri-time">${timeAgo(r.created_at)}</span>
          <div class="ri-content">${esc(r.content)}</div>
        </div>
      `).join('');
    }
  } catch (e) {
    document.getElementById('threadDetail').innerHTML = '<div style="color:var(--c-danger);">加载失败</div>';
  }
}

// ---- 返回列表 ----
document.getElementById('backToList').addEventListener('click', e => {
  e.preventDefault();
  document.getElementById('threadDetailView').style.display = 'none';
  document.getElementById('panel-threads').style.display = 'block';
  document.getElementById('tabBar').style.display = 'flex';
  loadThreads();
});

// ---- Tab 切换 ----
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

// ---- 发帖弹窗 ----
document.getElementById('btnNewThread').addEventListener('click', () => {
  document.getElementById('modalOverlay').classList.add('show');
  document.getElementById('threadTitle').value = '';
  document.getElementById('threadContent').value = '';
  document.getElementById('threadTitle').focus();
});
document.getElementById('btnCancel').addEventListener('click', () => {
  document.getElementById('modalOverlay').classList.remove('show');
});
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove('show');
});
document.getElementById('btnSubmit').addEventListener('click', async () => {
  const title = document.getElementById('threadTitle').value.trim();
  const content = document.getElementById('threadContent').value.trim();
  if (!title || !content) { alert('标题和内容不能为空'); return; }
  try {
    await apiFetch('/forum/plugins/' + pluginName + '/threads', {
      method: 'POST',
      body: JSON.stringify({ title, content }),
    });
    document.getElementById('modalOverlay').classList.remove('show');
    loadThreads();
  } catch (e) {
    alert('发帖失败：' + e.message);
  }
});

// ---- 回复 ----
document.getElementById('btnReply').addEventListener('click', async () => {
  const content = document.getElementById('replyContent').value.trim();
  if (!content) { alert('回复内容不能为空'); return; }
  try {
    await apiFetch('/forum/threads/' + currentThreadId + '/replies', {
      method: 'POST',
      body: JSON.stringify({ content }),
    });
    document.getElementById('replyContent').value = '';
    showThreadDetail(currentThreadId);
  } catch (e) {
    alert('回复失败：' + e.message);
  }
});

// ---- 初始化 ----
if (!pluginName) {
  document.getElementById('pluginHeader').innerHTML = '<div style="color:var(--c-danger);">缺少 plugin 参数</div>';
} else {
  loadPluginHeader();
  loadThreads();
}
</script>

</body>
</html>
