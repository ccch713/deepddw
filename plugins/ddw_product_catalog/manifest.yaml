name: ddw-product-catalog
license: free
tier: beta
version: 1.0.0
display_name: DDW 产品与插件目录
description: 销售端产品/插件目录主数据。DDW 自研产品（DDW 底座、DDW 插件、Token 套餐）与第三方产品/服务统一管理：编码唯一、单价/单位/类型/版本控制，提供列表/详情/搜索/统计接口，供报价/订单/合同/财务等下游插件引用。
engine: plugin_base
isolation: inline

permissions:
  - database.read
  - database.write

dependencies:
  plugins: []

config_schema:
  type: object
  properties:
    default_tenant_id:
      type: integer
      default: 1
    default_page_size:
      type: integer
      default: 20
    product_types:
      type: array
      default: [package, plugin, service, token]
      description: 产品类型枚举
    default_units:
      type: array
      default: [套/年, 套/月, 套, 个, 次, 万元, 元]
      description: 常用单位参考
    max_unit_price:
      type: number
      default: 99999999.99
      description: 单价上限（Numeric(12,2) 边界值）

router_prefix: /api/v1/plugins/ddw-product-catalog
