name: ddw_talk_a1_asr
tier: beta
version: "0.1.0"
description: "钉钉 Talk A1 录音采集 + Whisper 转写（口腔门诊 ASR 入口）"
author: "DDW Team"
license: commercial
type: plugin
entry: plugin:Plugin
dependencies:
  sdk: ">=2.0.0"
config:
  optional:
    whisper_model:
      default: "ggml-medium.bin"
      description: "Whisper 模型文件名"
    whisper_model_dir:
      default: "~/models/whisper"
      description: "Whisper 模型目录"
    whisper_cli:
      default: "whisper-cli"
      description: "whisper-cpp CLI 路径"
    max_concurrent_jobs:
      default: 3
      description: "最大并发转写任务数"
endpoints:
  - path: /api/v1/plugins/ddw_talk_a1_asr/health
    method: GET
    summary: 健康检查
  - path: /api/v1/plugins/ddw_talk_a1_asr/upload
    method: POST
    summary: 上传音频（multipart）触发异步转写
  - path: /api/v1/plugins/ddw_talk_a1_asr/status/{job_id}
    method: GET
    summary: 查询转写任务状态
  - path: /api/v1/plugins/ddw_talk_a1_asr/jobs
    method: GET
    summary: 列出任务（按 status 过滤）
  - path: /api/v1/plugins/ddw_talk_a1_asr/config
    method: GET
    summary: 运行时配置（脱敏）
