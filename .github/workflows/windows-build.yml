# deepDDW Windows 出包 CI — windows-latest 自动构建 exe（维护升级友好）
# 触发：手动（workflow_dispatch）+ main 推送（可自行去掉 on.push 只留手动）
# 产出：deepddw-windows.zip（deepddw.exe + _internal/），见 Actions Artifacts
name: windows-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'plugins/**'
      - 'frontend/**'
      - 'requirements.txt'
      - 'scripts/build_windows.py'
      - 'entry_win.py'
      - '.github/workflows/windows-build.yml'

jobs:
  build:
    name: build windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe (one-dir)
        run: |
          python scripts/build_windows.py

      - name: Smoke test (start exe, poll /health)
        shell: pwsh
        env:
          DDW_ACCESS_TOKEN: windows-smoke-test-token
          DDW_DEEPSEEK_API_KEY: sk-smoke-placeholder
        run: |
          $outLog = Join-Path $env:RUNNER_TEMP "deepddw.stdout.log"
          $errLog = Join-Path $env:RUNNER_TEMP "deepddw.stderr.log"
          $proc = Start-Process -FilePath "dist\deepddw\deepddw.exe" -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput $outLog -RedirectStandardError $errLog
          $ok = $false
          try {
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 3
              if ($proc.HasExited) {
                Write-Host "--- stdout ---"
                if (Test-Path $outLog) { Get-Content $outLog | Select-Object -Last 40 }
                Write-Host "--- stderr ---"
                if (Test-Path $errLog) { Get-Content $errLog | Select-Object -Last 60 }
                throw "deepddw.exe exited early with code $($proc.ExitCode)"
              }
              try {
                $health = Invoke-WebRequest -Uri "http://127.0.0.1:8500/health" -TimeoutSec 3
                if ($health.StatusCode -eq 200) {
                  Write-Host "health OK after $((($i+1)*3))s: $($health.Content)"
                  $ok = $true
                  break
                }
              } catch { }
            }
            if (-not $ok) {
              Write-Host "--- stdout ---"
              if (Test-Path $outLog) { Get-Content $outLog | Select-Object -Last 40 }
              Write-Host "--- stderr ---"
              if (Test-Path $errLog) { Get-Content $errLog | Select-Object -Last 60 }
              throw "health check timed out (90s); process alive=$(-not $proc.HasExited)"
            }
            # Token 门禁验证：无 token 的 /health 应 200（health 是公开探活），
            # 但带 token 的业务端点应 200、无 token 应 401
            $noAuth = $null
            try {
              $noAuth = Invoke-WebRequest -Uri "http://127.0.0.1:8500/api/v1/gateway/verify" -TimeoutSec 5
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -eq 401) {
                Write-Host "gateway verify without token -> 401 (auth gate OK)"
              } else {
                throw "expected 401 without token, got $($_.Exception.Response.StatusCode.value__)"
              }
            }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Package artifact
        run: |
          Compress-Archive -Path dist\deepddw -DestinationPath deepddw-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: deepddw-windows
          path: deepddw-windows.zip
          retention-days: 30
