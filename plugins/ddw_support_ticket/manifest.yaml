name: ddw-support-ticket
license: commercial
tier: core
version: 1.0.0
display_name: DDW 售后工单
description: 销售端售后工单管理。客户报修、咨询、投诉、需求建议等工单的全生命周期管理；自动生成工单号 TKT-YYYYMMDD-NNN；状态机 open→in_progress→resolved→closed；与客户企业、客户实例关联；多维筛选与统计。
engine: plugin_base
isolation: inline

permissions:
  - database.read
  - database.write

dependencies:
  plugins:
    - ddw-company-profile
    - ddw-instance-binding

config_schema:
  type: object
  properties:
    default_tenant_id:
      type: integer
      default: 1
    default_page_size:
      type: integer
      default: 20
    categories:
      type: array
      default: [bug, feature, question, complaint, other]
      description: 工单分类枚举
    priorities:
      type: array
      default: [low, normal, high, urgent]
      description: 优先级枚举
    statuses:
      type: array
      default: [open, in_progress, resolved, closed]
      description: 状态机枚举

router_prefix: /api/v1/plugins/ddw-support-ticket
