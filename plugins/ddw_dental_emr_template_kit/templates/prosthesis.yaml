type: prosthesis
name: 修复病历
version: "1.0"
required_fields:
  - chief_complaint
  - present_illness
  - tooth_position
  - restoration_type
  - material
  - preparation_type
  - margin_type
  - cement_type

fields:
  chief_complaint:
    label: 主诉
    type: text
    max_length: 200
    required: true
  present_illness:
    label: 现病史
    type: text
    max_length: 1000
    required: true
  past_history:
    label: 既往史
    type: text
    max_length: 500
    required: false
  tooth_position:
    label: 牙位
    type: text
    required: true
  restoration_type:
    label: 修复体类型
    type: select
    options: [crown, bridge, inlay, onlay, veneer, post_core]
    required: true
  material:
    label: 材料
    type: select
    options: [zirconia, emax, pfm, composite, gold]
    required: true
  preparation_type:
    label: 牙体预备
    type: select
    options: [full_crown, partial, minimal]
    required: true
  margin_type:
    label: 边缘类型
    type: select
    options: [chamfer, shoulder, knife_edge]
    required: true
  cement_type:
    label: 粘接材料
    type: select
    options: [glass_ionomer, resin, temporary]
    required: true
  abutment_type:
    label: 基台类型
    type: select
    options: [custom, stock, ti_base]
    required: false
  shade:
    label: 色号
    type: text
    required: false
  try_in_done:
    label: 已试戴
    type: boolean
    required: false

display_order:
  - chief_complaint
  - present_illness
  - past_history
  - tooth_position
  - restoration_type
  - material
  - preparation_type
  - margin_type
  - cement_type
  - abutment_type
  - shade
  - try_in_done
