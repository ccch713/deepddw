name: ddw_dental_emr_template_kit
tier: beta
version: "0.1.0"
description: "9 类口腔诊疗病历模板套件（YAML 配置驱动）"
author: "DDW Team"
license: commercial
type: plugin
entry: plugin:Plugin
dependencies:
  sdk: ">=2.0.0"
endpoints:
  - path: /api/v1/plugins/ddw_dental_emr_template_kit/health
    method: GET
    summary: 健康检查
  - path: /api/v1/plugins/ddw_dental_emr_template_kit/templates
    method: GET
    summary: 列出 9 类模板（summary）
  - path: /api/v1/plugins/ddw_dental_emr_template_kit/templates/{type}
    method: GET
    summary: 获取单个模板完整定义
  - path: /api/v1/plugins/ddw_dental_emr_template_kit/templates/{type}/validate
    method: POST
    summary: 校验必填字段
