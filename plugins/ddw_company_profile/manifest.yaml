name: ddw-company-profile
license: free
tier: beta
version: 1.0.0
display_name: DDW 企业主体管理
description: 企业工商主数据管理。统一社会信用代码、营业执照、认证状态、开票信息；提供企业列表、详情、统计、联系人关联等基础能力。
engine: plugin_base
isolation: inline

permissions:
  - database.read
  - database.write

dependencies:
  plugins: []

config_schema:
  type: object
  properties:
    default_tenant_id:
      type: integer
      default: 1
    default_page_size:
      type: integer
      default: 20
    certification_statuses:
      type: array
      default: [pending, submitted, approved, rejected, expired]
      description: 认证状态枚举
    company_types:
      type: array
      default: [有限公司, 股份公司, 个体工商户, 合伙企业, 国有企业]
      description: 企业类型枚举

router_prefix: /api/v1/plugins/ddw-company-profile
