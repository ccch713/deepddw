<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>DDW AI Hub - 登录 / 注册</title>
<link rel="icon" type="image/svg+xml" href="assets/logo-ju.svg">
<style>
  /* ===== 基础重置 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #333; background: #F0F2F5; -webkit-font-smoothing: antialiased; }
  a { color: #1890FF; text-decoration: none; }
  a:hover { color: #40A9FF; }
  input { font-family: inherit; }

  /* ===== 顶部条 ===== */
  .topbar { background: #001529; color: #FFF; height: 56px; display: flex; align-items: center; padding: 0 24px; }
  .header-logo { display: flex; align-items: center; }
  .logo-char { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; background: #000; color: #FFF; font-size: 20px; font-weight: bold; font-family: "PingFang SC", "Microsoft YaHei", serif; border-radius: 2px; margin-right: 10px; }
  .header-title { color: #FFF; font-size: 16px; font-weight: 500; }
  .topbar-right { margin-left: auto; color: rgba(255,255,255,0.65); font-size: 14px; }
  .topbar-right a { color: rgba(255,255,255,0.85); }
  .topbar-right a:hover { color: #FFF; }

  /* ===== 卡片 ===== */
  .page { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 56px - 64px); padding: 32px 16px; }
  .card { background: #FFF; width: 100%; max-width: 420px; padding: 40px 36px; border: 1px solid #E8E8E8; border-radius: 2px; }
  .card-title { font-size: 22px; color: #333; text-align: center; margin-bottom: 8px; }
  .card-sub { font-size: 14px; color: #666; text-align: center; margin-bottom: 28px; }
  .form-item { margin-bottom: 18px; }
  .form-label { display: block; font-size: 13px; color: #333; margin-bottom: 6px; }
  .form-label .req { color: #F5222D; margin-left: 2px; }
  .form-input { width: 100%; height: 38px; padding: 6px 12px; border: 1px solid #D9D9D9; border-radius: 2px; background: #FFF; font-size: 14px; color: #333; outline: none; transition: border-color 0.2s; }
  .form-input:focus { border-color: #1890FF; }
  .form-input::placeholder { color: #BFBFBF; }
  .form-row { display: flex; gap: 8px; }
  .form-row .form-input { flex: 1; }
  .btn-code { height: 38px; padding: 0 14px; background: #FFF; color: #1890FF; border: 1px solid #1890FF; border-radius: 2px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .btn-code:disabled { color: #999; border-color: #D9D9D9; cursor: not-allowed; }
  .btn-primary { display: block; width: 100%; height: 40px; background: #1890FF; color: #FFF; border: none; border-radius: 2px; font-size: 15px; cursor: pointer; margin-top: 8px; }
  .btn-primary:hover { background: #40A9FF; }
  .btn-primary:disabled { background: #BFBFBF; cursor: not-allowed; }
  .form-tips { font-size: 12px; color: #999; margin-top: 6px; line-height: 1.6; }
  .form-tips code { background: #F5F5F5; padding: 1px 5px; border-radius: 2px; color: #1890FF; font-size: 12px; }
  .form-bottom { text-align: center; font-size: 13px; color: #666; margin-top: 18px; }

  /* ===== Tab 切换 ===== */
  .tab-bar { display: flex; border-bottom: 1px solid #E8E8E8; margin-bottom: 24px; }
  .tab-item { flex: 1; text-align: center; padding: 12px 0; font-size: 15px; color: #666; cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.2s, border-color 0.2s; }
  .tab-item.active { color: #1890FF; border-bottom-color: #1890FF; font-weight: 500; }
  .tab-item:hover { color: #40A9FF; }
  .form-panel { display: none; }
  .form-panel.active { display: block; }

  .msg { padding: 10px 12px; background: #FFF1F0; border: 1px solid #FFA39E; color: #F5222D; font-size: 13px; border-radius: 2px; margin-bottom: 16px; display: none; }
  .msg.ok { background: #F6FFED; border-color: #B7EB8F; color: #52C41A; }

  /* ===== Footer ===== */
  .app-footer { text-align: center; padding: 16px 0; color: #999; font-size: 12px; border-top: 1px solid #E8E8E8; background: #FFF; }
  .app-footer a { color: #999; text-decoration: none; }
  .app-footer a:hover { color: #1890FF; }
  .footer-sep { margin: 0 8px; color: #D9D9D9; }

  @media (max-width: 480px) {
    .topbar { padding: 0 16px; }
    .card { padding: 28px 22px; }
    .topbar-right .login-link { display: none; }
  }
</style>
    <link rel="stylesheet" href="/css/ddw-themes.css">
    <script src="/js/ddw-theme-switcher.js"></script>
  </head>
<body>

<header class="topbar">
  <div class="header-logo">
    <span class="logo-char">钜</span>
    <span class="header-title">DDW AI Hub</span>
  </div>
  <div class="topbar-right">
    <a href="saas-pricing.html">返回首页</a>
  </div>
</header>

<main class="page">
  <section class="card">
    <div class="tab-bar">
      <div class="tab-item active" data-tab="register">注册</div>
      <div class="tab-item" data-tab="login">登录</div>
    </div>

    <div id="msg" class="msg"></div>

    <!-- 注册表单 -->
    <form id="regForm" class="form-panel active" autocomplete="off">
      <div class="form-item">
        <label class="form-label">手机号<span class="req">*</span></label>
        <input class="form-input" type="tel" id="phone" name="phone" maxlength="11" placeholder="请输入 11 位手机号" required>
      </div>

      <div class="form-item">
        <label class="form-label">邮箱<span class="req">*</span></label>
        <input class="form-input" type="email" id="regEmail" name="email" maxlength="255" placeholder="请输入企业邮箱" required>
      </div>

      <div class="form-item">
        <label class="form-label">图形验证码<span class="req">*</span></label>
        <div class="form-row">
          <input class="form-input" type="text" id="regCaptcha" name="captcha_code" maxlength="4" placeholder="4 位验证码" required>
          <img id="regCaptchaImg" src="" alt="验证码" style="height:38px; border-radius:2px; cursor:pointer; border:1px solid #D9D9D9;" title="点击换一张">
          <a href="javascript:void(0)" id="regCaptchaRefresh" style="font-size:12.5px; color:#1890FF; white-space:nowrap; line-height:38px;">换一张</a>
        </div>
      </div>

      <div class="form-item">
        <label class="form-label">企业名称</label>
        <input class="form-input" type="text" id="company" name="company" maxlength="200" placeholder="选填，将作为默认租户名">
      </div>

      <div class="form-item">
        <label class="form-label">联系人姓名</label>
        <input class="form-input" type="text" id="name" name="name" maxlength="120" placeholder="选填">
      </div>

      <div class="form-item">
        <label class="form-label">密码<span class="req">*</span></label>
        <input class="form-input" type="password" id="regPassword" name="password" placeholder="至少8位" required>
        <p class="form-tips">至少 8 位，需包含字母和数字</p>
      </div>

      <button type="submit" class="btn-primary" id="btnSubmit">免费注册</button>

      <p class="form-bottom">注册即代表同意 <a href="javascript:void(0)">服务条款</a> 和 <a href="javascript:void(0)">隐私政策</a></p>
    </form>

    <!-- 登录表单 -->
    <form id="loginForm" class="form-panel" autocomplete="off">
      <div class="form-item">
        <label class="form-label">手机号<span class="req">*</span></label>
        <input class="form-input" type="tel" id="loginPhone" name="phone" maxlength="11" placeholder="请输入 11 位手机号" required>
      </div>

      <div class="form-item">
        <label class="form-label">密码<span class="req">*</span></label>
        <input class="form-input" type="password" id="loginPassword" name="password" placeholder="请输入密码" required>
      </div>

      <div class="form-item">
        <label class="form-label">验证码<span class="req">*</span></label>
        <div class="form-row">
          <input class="form-input" type="text" id="loginCaptcha" name="captcha_code" maxlength="4" placeholder="4 位验证码" required>
          <img id="loginCaptchaImg" src="" alt="验证码" style="height:38px; border-radius:2px; cursor:pointer; border:1px solid #D9D9D9;" title="点击换一张">
          <a href="javascript:void(0)" id="loginCaptchaRefresh" style="font-size:12.5px; color:#1890FF; white-space:nowrap; line-height:38px;">换一张</a>
        </div>
      </div>

      <button type="submit" class="btn-primary" id="btnLogin">登录</button>

      <p class="form-bottom">还没有账号？<a href="javascript:void(0)" id="switchToRegister">立即注册</a></p>
    </form>
  </section>
</main>

<footer class="app-footer">
  <span>&copy; 2026 武汉锐果互动信息技术有限公司</span>
  <span class="footer-sep">|</span>
  <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">鄂ICP备2026024883号-1</a>
  <span class="footer-sep">|</span>
  <a href="https://beian.mps.gov.cn/#/query/webSearch?code=42011102006255" target="_blank" rel="noopener">鄂公网安备42011102006255号</a>
</footer>

<script src="/js/fingerprint.js"></script>
<script>
  const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'http://localhost:8500' : '';
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => document.querySelectorAll(s);

  function showMsg(text, ok = false) {
    const el = $('#msg');
    el.textContent = text;
    el.className = 'msg' + (ok ? ' ok' : '');
    el.style.display = 'block';
  }

  // ===== Tab 切换 =====
  $$('.tab-item').forEach(tab => {
    tab.addEventListener('click', () => {
      $$('.tab-item').forEach(t => t.classList.remove('active'));
      $$('.form-panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      const target = tab.dataset.tab;
      if (target === 'register') {
        $('#regForm').classList.add('active');
      } else {
        $('#loginForm').classList.add('active');
      }
      $('#msg').style.display = 'none';
    });
  });

  $('#switchToRegister').addEventListener('click', () => {
    $$('.tab-item').forEach(t => t.classList.remove('active'));
    $$('.form-panel').forEach(p => p.classList.remove('active'));
    $$('.tab-item')[0].classList.add('active');
    $('#regForm').classList.add('active');
    $('#msg').style.display = 'none';
  });

  // ===== 验证码管理 =====
  let regCaptchaId = '';
  let loginCaptchaId = '';

  async function loadRegCaptcha() {
    try {
      const r = await fetch(API_BASE + '/api/v1/auth/captcha');
      const d = await r.json();
      regCaptchaId = d.captcha_id;
      $('#regCaptchaImg').src = d.image_base64;
    } catch(e) {}
  }

  async function loadLoginCaptcha() {
    try {
      const r = await fetch(API_BASE + '/api/v1/auth/captcha');
      const d = await r.json();
      loginCaptchaId = d.captcha_id;
      $('#loginCaptchaImg').src = d.image_base64;
    } catch(e) {}
  }

  // 验证码点击刷新
  $('#regCaptchaImg').addEventListener('click', loadRegCaptcha);
  $('#regCaptchaRefresh').addEventListener('click', function(e) { e.preventDefault(); loadRegCaptcha(); });
  $('#loginCaptchaImg').addEventListener('click', loadLoginCaptcha);
  $('#loginCaptchaRefresh').addEventListener('click', function(e) { e.preventDefault(); loadLoginCaptcha(); });

  // 页面加载验证码
  loadRegCaptcha();
  loadLoginCaptcha();

  // ===== 提交注册 =====
  $('#regForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const btn = $('#btnSubmit');
    btn.disabled = true; btn.textContent = '注册中…';
    try {
      const payload = {
        phone: $('#phone').value.trim(),
        email: $('#regEmail').value.trim(),
        password: $('#regPassword').value,
        captcha_id: regCaptchaId,
        captcha_code: $('#regCaptcha').value.trim(),
        company_name: $('#company').value.trim() || null,
        name: $('#name').value.trim() || null,
        plan: 'free'
      };
      const r = await fetch(API_BASE + '/api/v1/auth/register', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail || '注册失败');
      localStorage.setItem('ddw_token', d.access_token);
      localStorage.setItem('ddw_user', JSON.stringify(d.user));
      localStorage.setItem('ddw_tenant', JSON.stringify(d.tenant));
      showMsg('注册成功，正在跳转套餐页…', true);
      setTimeout(() => { location.href = 'saas-pricing.html?new=1'; }, 600);
    } catch (e) {
      showMsg(e.message || '注册失败');
      btn.disabled = false; btn.textContent = '免费注册';
      loadRegCaptcha();
    }
  });

  // ===== 密码登录 =====
  $('#loginForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const phone = $('#loginPhone').value.trim();
    const password = $('#loginPassword').value;
    const captchaCode = $('#loginCaptcha').value.trim();
    if (!/^1[3-9]\d{9}$/.test(phone)) { showMsg('请输入正确的 11 位手机号'); return; }
    if (!password) { showMsg('请输入密码'); return; }
    if (!captchaCode) { showMsg('请输入验证码'); return; }

    // 等待指纹采集
    if (!window.DDW_FINGERPRINT) {
      try { await DDW.collectFingerprint(); } catch(e) {}
    }

    const btn = $('#btnLogin');
    btn.disabled = true; btn.textContent = '登录中…';
    try {
      const payload = {
        phone: phone,
        password: password,
        captcha_id: loginCaptchaId,
        captcha_code: captchaCode,
        device_fingerprint: window.DDW_FINGERPRINT || {}
      };
      const r = await fetch(API_BASE + '/api/v1/auth/login-password', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      const d = await r.json();
      if (!r.ok) {
        if (r.status === 429) {
          showMsg('安全限制：请稍后重试');
        } else if (d.detail && d.detail.includes('设备验证失败')) {
          showMsg('请使用授权设备登录管理后台');
        } else {
          showMsg(d.detail || '登录失败');
        }
        btn.disabled = false; btn.textContent = '登录';
        loadLoginCaptcha();
        return;
      }
      localStorage.setItem('ddw_token', d.access_token);
      localStorage.setItem('ddw_user', JSON.stringify(d.user));
      if (d.tenant) localStorage.setItem('ddw_tenant', JSON.stringify(d.tenant));
      // 密码过期或首次登录 → 弹窗提醒（不再强制）
      if (d.must_change) {
        if (window.confirm('您的密码已到期或首次登录，建议立即修改密码以保障账号安全。\n\n点击"确定"现在修改，点击"取消"以后再提醒。')) {
          location.href = 'change-password.html';
          return;
        }
        try { localStorage.setItem('ddw_skip_pwd', String(Date.now())); } catch (e) {}
      }
      showMsg('登录成功，正在跳转…', true);
      setTimeout(() => { location.href = 'saas-pricing.html'; }, 600);
    } catch (e) {
      showMsg(e.message || '登录失败');
      btn.disabled = false; btn.textContent = '登录';
      loadLoginCaptcha();
    }
  });
</script>
</body>
</html>
