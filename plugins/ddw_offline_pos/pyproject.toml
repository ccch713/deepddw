[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]  # 兼容 tests/conftest.py

[tool.ruff]
target-version = "py39"
line-length = 110
extend-exclude = ["data", "_legacy"]

[tool.ruff.lint]
ignore = ["UP045", "UP007"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ005", "S101", "PLR2004", "B007"]
