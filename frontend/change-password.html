<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修改密码 · DDW AI Hub | 锐果互动</title>
<link rel="icon" href="/company/assets/logo/logo-favicon.png">
<link rel="stylesheet" href="/company/assets/css/base.css">
<link rel="stylesheet" href="/company/assets/css/themes/standard.css">
<style>
  .page { min-height: calc(100vh - 140px); display: flex; align-items: center; justify-content: center; padding: 48px 20px; background: var(--bg-base); position: relative; overflow: hidden; }
  .page::before { content: ""; position: absolute; inset: 0; background: url('/company/assets/img/login-bg.jpg') center / cover no-repeat; opacity: 0.35; filter: brightness(1.6); pointer-events: none; }
  .page::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,0) 0%, var(--bg-base) 100%); pointer-events: none; }
  .card { width: 100%; max-width: 400px; background: var(--bg-card); border: 1.5px solid var(--border-strong); border-radius: 14px; padding: 36px 32px; box-shadow: 0 8px 32px var(--shadow); position: relative; z-index: 1; }
  .card .logo-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 8px; }
  .card .logo-row img { height: 40px; }
  .card h2 { text-align: center; font-size: 20px; margin: 0 0 6px; color: var(--text-primary); }
  .card .sub { text-align: center; font-size: 13.5px; color: var(--text-secondary); margin-bottom: 26px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13.5px; color: var(--text-primary); margin-bottom: 6px; font-weight: 600; }
  .form-group input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14.5px; background: var(--bg-page); color: var(--text-primary); transition: border-color .2s; }
  .form-group input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-glow); }
  .form-help { font-size: 12px; color: var(--text-muted); margin-top: 5px; }
  .btn { width: 100%; padding: 11px 0; background: var(--brand); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all .2s; }
  .btn:hover { background: var(--brand-hover); box-shadow: 0 4px 16px var(--brand-glow); }
  .btn:disabled { background: var(--text-muted); cursor: not-allowed; box-shadow: none; }
  .error-msg { font-size: 13px; color: #ff4d4f; text-align: center; margin-bottom: 12px; min-height: 20px; }
  .success-msg { font-size: 13px; color: #52c41a; text-align: center; margin-bottom: 12px; min-height: 20px; }
  .account-info { text-align: center; font-size: 13px; color: var(--text-secondary); margin-bottom: 18px; padding: 8px 12px; background: var(--bg-page); border-radius: 8px; }
  .strength-hint { font-size: 12px; color: var(--text-muted); margin-top: 5px; line-height: 1.6; }
</style>
</head>
<body>

<div class="page">
  <div class="card">
    <div class="logo-row">
      <img src="/company/assets/logo/logo-200.png" alt="武汉锐果互动信息技术有限公司 Logo">
    </div>
    <h2>修改密码</h2>
    <p class="sub" id="pageSub">请设置您的新密码</p>

    <div class="account-info" id="accountInfo">加载中...</div>

    <div id="errorMsg" class="error-msg"></div>
    <div id="successMsg" class="success-msg"></div>

    <form id="changeForm">
      <div class="form-group">
        <label>原密码</label>
        <input type="password" name="old_password" placeholder="请输入原密码" maxlength="128" required>
      </div>
      <div class="form-group">
        <label>新密码</label>
        <input type="password" name="new_password" id="newPwd" placeholder="请输入新密码" maxlength="128" required>
        <div class="strength-hint">至少 8 位，需包含字母和数字</div>
      </div>
      <div class="form-group">
        <label>确认新密码</label>
        <input type="password" name="confirm_password" id="confirmPwd" placeholder="请再次输入新密码" maxlength="128" required>
      </div>
      <button type="submit" class="btn" id="submitBtn">确认修改</button>
    </form>
  </div>
</div>

<script src="./js/api.js"></script>
<script>
(function () {
  'use strict';

  var form = document.getElementById('changeForm');
  var errorMsg = document.getElementById('errorMsg');
  var successMsg = document.getElementById('successMsg');
  var submitBtn = document.getElementById('submitBtn');
  var accountInfo = document.getElementById('accountInfo');
  var newPwd = document.getElementById('newPwd');
  var confirmPwd = document.getElementById('confirmPwd');

  // 检查登录状态
  if (!DDW.api.getToken()) {
    window.location.href = '/login.html';
    return;
  }

  // 加载用户信息
  DDW.api.get('/auth/me').then(function (r) {
    if (r.ok && r.data && r.data.user) {
      accountInfo.textContent = '当前账号：' + (r.data.user.phone || '');
    } else {
      DDW.api.clearToken();
      window.location.href = '/login.html';
    }
  });

  function showError(msg) {
    errorMsg.textContent = msg;
    successMsg.textContent = '';
  }
  function showSuccess(msg) {
    successMsg.textContent = msg;
    errorMsg.textContent = '';
  }
  function clearMsg() {
    errorMsg.textContent = '';
    successMsg.textContent = '';
  }

  // 前端校验
  function validateForm() {
    var oldPwd = form.querySelector('input[name=old_password]').value;
    var np = newPwd.value;
    var cp = confirmPwd.value;

    if (!oldPwd) { showError('请输入原密码'); return false; }
    if (np.length < 8) { showError('新密码长度不能少于 8 位'); return false; }
    if (!/[a-zA-Z]/.test(np) || !/[0-9]/.test(np)) { showError('新密码需包含字母和数字'); return false; }
    if (np !== cp) { showError('两次输入的新密码不一致'); return false; }
    if (np === oldPwd) { showError('新密码不能与原密码相同'); return false; }
    return true;
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    clearMsg();

    if (!validateForm()) return;

    submitBtn.disabled = true;
    submitBtn.textContent = '提交中...';

    try {
      var resp = await DDW.api.post('/auth/change-password', {
        old_password: form.querySelector('input[name=old_password]').value,
        new_password: newPwd.value,
      });

      if (resp.ok && resp.data && resp.data.changed) {
        showSuccess('密码修改成功！正在跳转...');
        setTimeout(function () { window.location.href = '/admin.html'; }, 1200);
      } else {
        showError(resp.message || resp.data?.detail || '修改失败，请重试');
      }
    } catch (e) {
      showError('网络错误，请稍后重试');
    }

    submitBtn.disabled = false;
    submitBtn.textContent = '确认修改';
  });
})();
</script>

</body>
</html>
