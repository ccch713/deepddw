name: ddw-contract-core
license: free
tier: core
version: 1.0.0
display_name: DDW 合同中心
description: 销售端合同全生命周期管理。自动生成单号 CT-YYYYMMDD-NNN；合同状态机 draft→pending_approval→approved→signed→active→completed/terminated；与客户企业、联系人、商机、报价单关联。
engine: plugin_base
isolation: inline

permissions:
  - database.read
  - database.write

dependencies:
  plugins: []

config_schema:
  type: object
  properties:
    default_tenant_id:
      type: integer
      default: 1
    default_page_size:
      type: integer
      default: 20
    default_currency:
      type: string
      default: CNY
    statuses:
      type: array
      default: [draft, pending_approval, approved, signed, active, completed, terminated, rejected]
      description: 合同状态枚举
    contract_types:
      type: array
      default: [standard, framework, supplementary]
      description: 合同类型枚举

router_prefix: /api/v1/plugins/ddw-contract-core
