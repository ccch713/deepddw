name: ddw-contact-hub
license: free
tier: beta
version: 1.0.0
display_name: DDW 联系人管理
description: 企业级联系人主数据管理。姓名、职位、部门、手机、邮箱、微信、标签、分组、主联系人标记；支持按企业聚合、模糊搜索（autocomplete）、统计概览。删除走硬删除（联系人无重要业务依赖）。
engine: plugin_base
isolation: inline

permissions:
  - database.read
  - database.write

dependencies:
  plugins:
    - ddw-company-profile  # 联系人的 company_id 引用 crm_companies.id

config_schema:
  type: object
  properties:
    default_tenant_id:
      type: integer
      default: 1
    default_page_size:
      type: integer
      default: 20
    statuses:
      type: array
      default: [active, inactive, archived]
      description: 联系人状态枚举
    max_tags_per_contact:
      type: integer
      default: 20
      description: 单个联系人允许的最大标签数
    max_groups_per_contact:
      type: integer
      default: 10
      description: 单个联系人允许的最大分组数

router_prefix: /api/v1/plugins/ddw-contact-hub
