name: ddw-spc-basic
tier: beta
version: 1.0.0
description: "DDW SPC基础 — 控制图/Cp/Cpk/Ppk/判异规则/过程能力分析"
author: "DDW Team"
license: commercial
type: plugin
adapter:
  type: "quality"
  vendor: "ddw"
  protocol: "internal"
dependencies:
  plugins:
    ddw-core: ">=2.0.0"
config:
  optional:
    default_chart_type:
      default: "Xbar-R"
      description: "默认控制图类型"
    default_confidence:
      default: 0.9973
      description: "默认置信水平(3σ)"
routes:
  - prefix: /api/v1/plugins/ddw-spc-basic
    router: router:router
