name: ddw-signature-adapter
license: free
tier: core
version: 1.0.0
display_name: DDW 电子签章适配器
description: 电子签章服务适配层。对接腾讯电子签 / 契约锁 / e签宝 / 人工签 等第三方电子签章服务商，管理签署请求生命周期（pending/signing/signed/rejected/expired），支持第三方异步回调和人工上传签后文件。预留适配器模式扩展点（各 provider 实际接入待后续实现）。
engine: plugin_base
isolation: inline

permissions:
  - database.read
  - database.write

dependencies:
  plugins:
    - ddw-contract-core

config_schema:
  type: object
  properties:
    default_tenant_id:
      type: integer
      default: 1
    default_page_size:
      type: integer
      default: 20
    providers:
      type: array
      default: [tencent, dianxiaoyu, esign, manual]
      description: 支持的电子签章服务商
    statuses:
      type: array
      default: [pending, signing, signed, rejected, expired]
      description: 签署请求状态枚举

router_prefix: /api/v1/plugins/ddw-signature-adapter
