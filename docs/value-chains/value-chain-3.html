<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>链3 · 服务续费价值链</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1a1a1a; --sub: #6b7280;
    --line: #e5e7eb; --brand: #d97706; --brand-soft: #fffbeb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--ink); padding: 32px 24px; }
  .wrap { max-width: 1080px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--sub); font-size: 13px; margin-bottom: 28px; }
  .chain { display: flex; align-items: stretch; gap: 0; flex-wrap: wrap; }
  .step { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 150px; flex: 1; position: relative; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
  .step .no { font-size: 11px; color: var(--brand); font-weight: 700; letter-spacing: 1px; }
  .step .name { font-size: 15px; font-weight: 600; margin: 4px 0; }
  .step .plugin { font-size: 11px; color: var(--sub); font-family: ui-monospace, Menlo, monospace; }
  .arrow { display: flex; align-items: center; color: var(--brand); font-size: 20px; font-weight: 700; padding: 0 6px; flex-shrink: 0; }
  .legend { margin-top: 24px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; font-size: 13px; line-height: 1.9; }
  .legend b { color: var(--brand); }
  .tag { display: inline-block; background: var(--brand-soft); color: var(--brand); border-radius: 6px; padding: 1px 8px; font-size: 11px; margin-left: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>链3 · 服务续费价值链</h1>
  <div class="sub">工单 → 客服 → 跟进 → 知识库 → 续费（华为 ITR）</div>
  <div class="chain">
        <div class="step"><div class="no">1</div><div class="name">工单</div><div class="plugin">ddw-support-ticket</div></div>    <div class="arrow">→</div>
    <div class="step"><div class="no">2</div><div class="name">在线客服</div><div class="plugin">ddw_online_cs</div></div>    <div class="arrow">→</div>
    <div class="step"><div class="no">3</div><div class="name">跟进闭环</div><div class="plugin">ddw_followup</div></div>    <div class="arrow">→</div>
    <div class="step"><div class="no">4</div><div class="name">知识库</div><div class="plugin">ddw-knowledge-hierarchy · ddw-ent-knowledge</div></div>    <div class="arrow">→</div>
    <div class="step"><div class="no">5</div><div class="name">续费</div><div class="plugin">ddw-renewal</div></div>
  </div>
  <div class="legend"><b>Demo 剧本</b>：客户提工单 → 客服/知识库自动应答 → 跟进闭环 → 到期前续费提醒 → 续费订单回流链 1/2。<br><b>验收</b>：bash scripts/smoke_value_chain_3_service.sh</div>
</div>
</body>
</html>
