name: ddw-quality-knowledge
tier: beta
version: 1.0.0
description: "DDW 质量知识检索 — ISO22000/FSSC22000/HACCP/SOP/历史案例/法规条款智能检索"
author: "DDW Team"
license: commercial
type: plugin
adapter:
  type: "quality"
  vendor: "ddw"
  protocol: "internal"
dependencies:
  plugins:
    ddw-core: ">=2.0.0"
config:
  optional:
    llm_provider:
      default: "mimo"
      description: "LLM 提供商"
    knowledge_base_path:
      default: "./knowledge_base"
      description: "知识库路径"
    embedding_model:
      default: "text-embedding-3-small"
      description: "向量嵌入模型"
    max_results:
      default: 10
      description: "最大返回结果数"
routes:
  - prefix: /api/v1/plugins/ddw-quality-knowledge
    router: router:router
