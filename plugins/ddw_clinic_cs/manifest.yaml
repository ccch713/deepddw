name: ddw_clinic_cs
tier: beta
version: 0.1.0
description: |
  口腔诊所 AI 客服（行业细分第一站）— 武汉东华口腔青山店。
  患者咨询/预约引导/应急指导/术后关怀，价格红线内置（绝不报价）。
author: "DDW Team"
license: commercial
type: plugin
adapter:
  type: "identity"
  vendor: "ddw"
  protocol: "internal"
dependencies:
  plugins:
    ddw-core: ">=2.0.0"
config:
  optional:
    knowledge_dir:
      default: "./knowledge"
    max_history:
      default: 12
    clinic_name:
      default: "武汉东华口腔青山店"
    price_rule:
      default: "never_reveal"
      description: "价格红线：AI 绝不透露任何价格/费用"
