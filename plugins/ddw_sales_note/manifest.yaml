name: ddw-sales-note
license: commercial
tier: beta
version: 1.0.0
display_name: DDW 拜访与沟通记录
description: 销售端拜访/电话/会议/微信/邮件沟通记录管理。支持按商机/联系人/客户/记录人/类型/时间多维检索与统计。
engine: plugin_base
isolation: inline

permissions:
  - database.read
  - database.write

dependencies:
  plugins: []

config_schema:
  type: object
  properties:
    default_tenant_id:
      type: integer
      default: 1
    default_page_size:
      type: integer
      default: 20
    note_types:
      type: array
      default: [visit, call, meeting, email, wechat]
      description: 沟通类型枚举

router_prefix: /api/v1/plugins/ddw-sales-note
