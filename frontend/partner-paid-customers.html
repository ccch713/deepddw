<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>付费客户 · DDW AI Hub | 锐果互动</title>
<link rel="icon" href="/company/assets/logo/logo-favicon.png">
<link rel="stylesheet" href="/company/assets/css/base.css">
<link rel="stylesheet" href="/company/assets/css/themes/standard.css">
<style>
  .page { min-height: calc(100vh - 140px); padding: 40px 20px; background: var(--bg-base); }
  .wrap { max-width: 1000px; margin: 0 auto; }
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .head h1 { font-size: 22px; margin: 0; color: var(--text-primary); }
  .head .sub { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; font-size: 13.5px; border-bottom: 1px solid var(--border); color: var(--text-primary); }
  th { color: var(--text-muted); font-weight: 600; background: var(--bg-page); }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; }
  .badge.enterprise { background: rgba(46,160,67,.12); color: #2ea043; }
  .badge.free { background: rgba(219,171,9,.12); color: #dbab09; }
  .badge.active { background: rgba(46,160,67,.12); color: #2ea043; }
  .badge.inactive { background: rgba(255,77,79,.12); color: #ff4d4f; }
  .empty { text-align: center; padding: 40px 0; color: var(--text-muted); font-size: 14px; }
  .nav-back { font-size: 13px; color: var(--text-muted); text-decoration: none; display: inline-block; margin-bottom: 12px; }
  .nav-back:hover { color: var(--brand); }
  /* ===== 左侧导航栏 ===== */
  .demo-sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 200px; background: var(--bg-card); border-right: 1px solid var(--border); padding: 20px 0 0; display: flex; flex-direction: column; z-index: 50; overflow-y: auto; }
  .demo-sidebar .sb-brand { padding: 0 20px 18px; font-weight: 800; color: var(--text-primary); font-size: 15px; letter-spacing: .5px; }
  .demo-sidebar .sb-group { padding: 14px 20px 6px; font-size: 11px; color: var(--text-muted); letter-spacing: 1px; }
  .demo-sidebar a { display: block; padding: 10px 20px; font-size: 15.5px; color: var(--text-muted); text-decoration: none; }
  .demo-sidebar a:hover { color: var(--brand); background: rgba(24,144,255,.05); }
  .demo-sidebar a.active { color: var(--brand); background: rgba(24,144,255,.08); border-right: 3px solid var(--brand); font-weight: 600; }
  .demo-sidebar .sb-logout { margin-top: auto; padding: 14px 20px; font-size: 13px; color: var(--text-muted); cursor: pointer; border-top: 1px solid var(--border); }
  .demo-sidebar .sb-logout:hover { color: #ff4d4f; }
  .page { margin-left: 200px; }
  @media (max-width: 768px) { .demo-sidebar { display: none; } .page { margin-left: 0; } }
</style>
</head>
<body>

<aside class="demo-sidebar">
  <div class="sb-brand">DDW AI HUB</div>
  <a href="/admin.html">仪表盘</a>
  <a href="/admin.html#plugins">插件管理</a>
  <a href="/admin.html#users">用户管理</a>
  <a href="/admin.html#llm">LLM 配置</a>
  <a href="/admin.html#whitelist">白名单</a>
  <a href="/admin.html#channels">渠道商</a>
  <div class="sb-group">经销商</div>
  <a href="/partner-demo-accounts.html">客户Demo账号</a>
  <a href="/partner-paid-customers.html" class="active">付费客户</a>
  <div class="sb-logout" id="sbLogout">退出登录</div>
</aside>

<div class="page">
  <div class="wrap">
    <a class="nav-back" href="/admin.html">← 返回工作台</a>
    <div class="head">
      <div>
        <h1>付费客户</h1>
        <div class="sub">我名下客户的付费状态与联系方式</div>
      </div>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>客户</th>
            <th>档位</th>
            <th>状态</th>
            <th>联系方式</th>
            <th>到期时间</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none;">暂无付费客户数据。</div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
(function () {
  var tbody = document.getElementById('tbody');
  var empty = document.getElementById('empty');

  function loadList() {
    DDW.api.get('/plugins/ddw-partner-directory/paid-customers').then(function (resp) {
      if (!resp.ok || !resp.data) { showToast('加载失败'); return; }
      var items = resp.data || [];
      empty.style.display = items.length ? 'none' : 'block';
      tbody.innerHTML = items.map(function (a) {
        var planCls = a.plan === 'enterprise' ? 'enterprise' : 'free';
        var planLabel = a.plan === 'enterprise' ? '已付费' : '试用中';
        var statusCls = a.status === 'active' ? 'active' : 'inactive';
        var statusLabel = a.status === 'active' ? '正常' : (a.status || '-');
        return '<tr>' +
          '<td><strong>' + esc(a.client_name) + '</strong></td>' +
          '<td><span class="badge ' + planCls + '">' + planLabel + '</span></td>' +
          '<td><span class="badge ' + statusCls + '">' + statusLabel + '</span></td>' +
          '<td>' + esc(a.contact_phone || '-') + '</td>' +
          '<td>' + (a.expires_at ? esc(a.expires_at.split('T')[0]) : '永久') + '</td>' +
          '</tr>';
      }).join('');
    });
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function showToast(msg) {
    var t = document.getElementById('toast-host');
    if (!t) { t = document.createElement('div'); t.id = 'toast-host'; t.className = 'toast-host'; document.body.appendChild(t); }
    var d = document.createElement('div'); d.className = 'toast-item'; d.textContent = msg;
    t.appendChild(d); setTimeout(function () { d.remove(); }, 2200);
  }

  loadList();
})();

// 侧边栏退出登录
document.getElementById('sbLogout').addEventListener('click', function () {
  try { localStorage.removeItem('ddw_token'); } catch (e) {}
  try { document.cookie = 'ddw_logged_in=; Domain=.9cio.com; Path=/; Max-Age=0'; } catch (e) {}
  window.location.href = '/login.html';
});
</script>

</body>
</html>
