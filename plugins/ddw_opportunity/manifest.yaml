name: ddw-opportunity
license: commercial
tier: core
version: 1.0.0
display_name: DDW 商机管理
description: 销售商机（Opportunity）全生命周期管理。涵盖阶段流转（初步接触→成交/丢单）、成交概率自动同步、漏斗统计、概览统计；与企业主体、联系人关联。提供商机列表、详情、阶段更新、成交/丢单标记、统计等基础能力。
engine: plugin_base
isolation: inline

permissions:
  - database.read
  - database.write

dependencies:
  plugins:
    - ddw-company-profile

config_schema:
  type: object
  properties:
    default_tenant_id:
      type: integer
      default: 1
    default_page_size:
      type: integer
      default: 20
    stages:
      type: array
      default:
        - initial_contact
        - demand_confirmation
        - proposal_submitted
        - quotation_sent
        - negotiation
        - contract_pending
        - won
        - lost
      description: 商机阶段枚举
    statuses:
      type: array
      default: [open, won, lost, closed]
      description: 商机状态枚举
    sources:
      type: array
      default: [直销, 经销商, 官网, 展会, 转介绍]
      description: 商机来源

router_prefix: /api/v1/plugins/ddw-opportunity
