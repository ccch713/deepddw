<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>插件市场 · DDW AI Hub</title>
<link rel="stylesheet" href="./css/theme.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231a1a2e'/><text x='50%' y='55%' font-family='Arial' font-size='20' font-weight='800' fill='%23e8b86d' text-anchor='middle' dominant-baseline='middle'>D</text></svg>">
<style>
  .market-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .market-header h2 { margin: 0; font-size: 22px; color: var(--c-bg-dark); }
  .search-box { display: flex; gap: 8px; align-items: center; }
  .search-box input { padding: 8px 14px; border: 1.5px solid var(--c-border); border-radius: var(--radius-sm); font-size: 14px; width: 240px; outline: none; }
  .search-box input:focus { border-color: var(--c-accent); }
  .filter-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .filter-btn { padding: 6px 16px; border: 1.5px solid var(--c-border); border-radius: 999px; font-size: 13px; background: var(--c-bg-alt); color: var(--c-text); cursor: pointer; transition: all .15s; }
  .filter-btn:hover, .filter-btn.active { background: var(--c-bg-dark); color: var(--c-accent); border-color: var(--c-bg-dark); }
  .plugin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
  .plugin-card { background: var(--c-bg-alt); border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow-sm); cursor: pointer; transition: transform .15s, box-shadow .15s; border: 1px solid transparent; }
  .plugin-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--c-accent); }
  .plugin-card .pc-title { font-size: 16px; font-weight: 700; color: var(--c-bg-dark); margin: 0 0 2px; }
  .plugin-card .pc-name { font-size: 12px; color: var(--c-text-muted); margin: 0 0 8px; }
  .plugin-card .pc-meta { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--c-text-muted); flex-wrap: wrap; }
  .plugin-card .pc-stars { color: #e8a200; font-weight: 700; font-size: 14px; }
  .plugin-card .pc-badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; background: var(--c-bg-dark); color: var(--c-accent); }
  .plugin-card .tier-core { background: #fff3cd; color: #8a6d00; border: 1px solid #e8c84d; }
  .plugin-card .tier-beta { background: #e8f4fd; color: #0a6fb8; border: 1px solid #a8d4f0; }
  .plugin-card .tier-archive { background: #eee; color: #888; border: 1px solid #ddd; }
  .plugin-card .pc-price { margin-top: 10px; gap: 8px; }
  .plugin-card .pc-price-amount { font-size: 18px; font-weight: 800; color: var(--c-accent, #e6452a); }
  .plugin-card .pc-price-tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--c-bg-dark); color: var(--c-accent); }
  .plugin-card .pc-price-note { font-size: 11px; color: var(--c-text-muted); margin-top: 4px; }
  .plugin-card .pc-price-custom { font-size: 12px; color: var(--c-text-muted); font-style: italic; }
  .market-tip { margin: 12px 0 4px; padding: 10px 14px; border-radius: 10px; background: var(--c-bg-alt); border: 1px dashed var(--c-border); font-size: 12px; color: var(--c-text-muted); line-height: 1.6; }
  .market-tip b { color: var(--c-accent, #e6452a); }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--c-text-muted); }
  .empty-state h3 { color: var(--c-text); margin-bottom: 8px; }
  /* 侧边栏复用 admin 结构 */
  .admin-sidebar .market-link { color: var(--c-accent); font-weight: 700; }
</style>
</head>
<body>

<div class="admin-layout">
  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <h4>主导航</h4>
    <a href="./admin.html">管理后台</a>
    <a href="./plugin-market.html" class="active market-link">插件市场</a>
    <h4>系统</h4>
    <a href="./admin" target="_blank">SQL Admin</a>
    <a href="./docs" target="_blank">API 文档</a>
  </aside>

  <!-- Main -->
  <main class="admin-main">
    <div class="market-header">
      <h2>插件市场</h2>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索插件名称...">
      </div>
    </div>

    <div class="market-tip">💡 页面价格为 <b>SaaS 订阅价</b>；客户独立部署价格请 <b>与当地经销商联系</b>。</div>
    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" data-cat="all">全部</button>
    </div>

    <div class="plugin-grid" id="pluginGrid">
      <div class="empty-state"><h3>加载中...</h3></div>
    </div>
  </main>
</div>

<script>
const API = '/api/v1';
let allPlugins = [];
let currentFilter = 'all';

function getToken() {
  return localStorage.getItem('ddw_token') || sessionStorage.getItem('ddw_token') || '';
}

function authHeaders() {
  const t = getToken();
  return t ? { 'Authorization': 'Bearer ' + t } : {};
}

async function apiFetch(path) {
  const resp = await fetch(API + path, { headers: { ...authHeaders() } });
  if (resp.status === 401) {
    window.location.href = './welcome.html';
    return null;
  }
  if (!resp.ok) return null;
  return resp.json();
}

function renderPlugins(plugins) {
  const grid = document.getElementById('pluginGrid');
  if (!plugins.length) {
    grid.innerHTML = '<div class="empty-state"><h3>暂无插件</h3><p>未找到匹配的插件</p></div>';
    return;
  }
  grid.innerHTML = plugins.map(p => `
    <div class="plugin-card" onclick="location.href='./plugin-forum.html?plugin=${p.plugin_name}'">
      <div class="pc-title">${esc(p.title || p.plugin_name)} ${tierBadge(p.tier)}</div>
      <div class="pc-name">${esc(p.plugin_name)}</div>
      <div class="pc-meta">
        <span class="pc-stars">★ ${p.stars.toFixed(1)}</span>
        <span>(${p.star_count})</span>
        <span class="pc-badge">${esc(p.category)}</span>
      </div>
      <div class="pc-meta" style="margin-top:6px;">
        <span>已安装 ${p.installs} 次</span>
        <span>·</span>
        <span>更新 ${p.updated_at || '—'}</span>
        <span>·</span>
        <span>反馈 ${p.hot_count || 0}</span>
      </div>
      ${priceBadge(p)}
    </div>
  `).join('');
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function tierBadge(tier) {
  if (tier === 'core') return '<span class="pc-badge tier-core">核心</span>';
  if (tier === 'archive') return '<span class="pc-badge tier-archive">废弃</span>';
  return '<span class="pc-badge tier-beta">实验</span>';
}

function priceBadge(p) {
  const cny = Number(p.price_cny || 0);
  if (cny > 0) {
    const note = p.price_note ? `<div class="pc-price-note">${esc(p.price_note)}</div>` : '';
    return `<div class="pc-meta pc-price"><span class="pc-price-amount">¥${(cny / 100).toFixed(2)}</span><span class="pc-price-tag">SaaS 订阅价</span></div>${note}`;
  }
  if (p.price_note) {
    return `<div class="pc-meta pc-price"><span class="pc-price-custom">${esc(p.price_note)}</span></div>`;
  }
  return '';
}

function buildFilters(plugins) {
  const cats = new Set();
  plugins.forEach(p => cats.add(p.category || '通用'));
  const bar = document.getElementById('filterBar');
  bar.innerHTML = '<button class="filter-btn active" data-cat="all">全部</button>';
  [...cats].sort().forEach(c => {
    bar.innerHTML += `<button class="filter-btn" data-cat="${esc(c)}">${esc(c)}</button>`;
  });
  bar.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      bar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.cat;
      applyFilter();
    });
  });
}

function applyFilter() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  let filtered = allPlugins;
  if (currentFilter !== 'all') {
    filtered = filtered.filter(p => p.category === currentFilter);
  }
  if (q) {
    filtered = filtered.filter(p =>
      (p.title || '').toLowerCase().includes(q) ||
      p.plugin_name.toLowerCase().includes(q)
    );
  }
  renderPlugins(filtered);
}

document.getElementById('searchInput').addEventListener('input', applyFilter);

(async function init() {
  const data = await apiFetch('/forum/plugins');
  if (!data) return;
  allPlugins = data;
  buildFilters(data);
  renderPlugins(data);
})();
</script>

</body>
</html>
