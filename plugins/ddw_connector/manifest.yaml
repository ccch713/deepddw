name: ddw_connector
license: free
tier: core
version: 0.1.0
display_name: DDW 连接器元数据发现
description: 连接数据源 → 自动扫描元数据 → 生成数据字典草稿 → 客户确认 → 入库。支持 sql_readonly 和 api_openapi 两种数据源类型。
engine: plugin_base
isolation: inline

permissions:
  - database.read
  - database.write

dependencies:
  plugins: {}

config_schema:
  type: object
  properties:
    default_db_path:
      type: string
      default: ddw_connector.db
      description: 数据字典 SQLite 文件路径

router_prefix: /api/v1/plugins/ddw-connector
