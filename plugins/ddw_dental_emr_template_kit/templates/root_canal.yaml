type: root_canal
name: 根管治疗病历
version: "1.0"
required_fields:
  - chief_complaint
  - present_illness
  - tooth_position
  - root_count
  - canal_filling_method
  - irrigation_solution
  - prognosis
  - restoration_plan
  - visit_count

fields:
  chief_complaint:
    label: 主诉
    type: text
    max_length: 200
    required: true
  present_illness:
    label: 现病史
    type: text
    max_length: 1000
    required: true
  past_history:
    label: 既往史
    type: text
    max_length: 500
    required: false
  tooth_position:
    label: 牙位
    type: text
    required: true
  root_count:
    label: 根管数
    type: number
    required: true
  canal_filling_method:
    label: 充填方法
    type: select
    options: [lateral, vertical, continuous_wave]
    required: true
  irrigation_solution:
    label: 冲洗液
    type: select
    options: [NaOCl, EDTA, CHX]
    required: true
  inter_appointment_medication:
    label: 诊间封药
    type: select
    options: ["Ca(OH)2", formocresol, none]
    required: false
  prognosis:
    label: 预后
    type: select
    options: [good, fair, poor]
    required: true
  restoration_plan:
    label: 修复方案
    type: select
    options: [crown, inlay, onlay, composite]
    required: true
  post_core:
    label: 打桩
    type: boolean
    required: false
  visit_count:
    label: 复诊次数
    type: number
    required: true

display_order:
  - chief_complaint
  - present_illness
  - past_history
  - tooth_position
  - root_count
  - canal_filling_method
  - irrigation_solution
  - inter_appointment_medication
  - prognosis
  - restoration_plan
  - post_core
  - visit_count
