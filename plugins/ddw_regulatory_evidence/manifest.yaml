    llm_provider:
      default: "mimo"
      description: "LLM 提供商"
    jurisdictions:
      default: "CN,EU,US"
      description: "支持的法规辖区"
routes:
  - prefix: /api/v1/plugins/ddw-regulatory-evidence
    router: router:router
