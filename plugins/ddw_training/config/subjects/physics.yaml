subject: physics
display_name: 初三物理
grade: 9
chapters:
  - id: ch1
    title: 机械运动
    concepts:
      - {id: c1, name: 速度, difficulty: easy}
      - {id: c2, name: 加速度, difficulty: medium}
      - {id: c3, name: 匀变速直线运动, difficulty: hard}
  - id: ch2
    title: 力和运动
    concepts:
      - {id: c4, name: 牛顿第一定律, difficulty: medium}
      - {id: c5, name: 牛顿第二定律, difficulty: medium}
      - {id: c6, name: 牛顿第三定律, difficulty: easy}
  - id: ch3
    title: 压强和浮力
    concepts:
      - {id: c7, name: 压强, difficulty: medium}
      - {id: c8, name: 液体压强, difficulty: medium}
      - {id: c9, name: 浮力, difficulty: hard}

# 6 思维动作推荐使用顺序
recommended_moves: [1, 2, 3, 4, 5, 6]

# 12 图景默认优先级
default_vignettes: [1, 2, 3, 4, 7, 10]

# 苏格拉底追问深度（1-6）
socratic_depth: 3

# 多媒体课件生成配置（10 种媒体类型）
multimedia:
  # 1. 幻灯片：所有章节标配
  slides:
    enabled: true
    template: "physics_classic"
    slides_per_chapter: 12
  # 2. 交互仿真：力学/电学概念
  interactive_sim:
    enabled: true
    engine: "phet"  # phet / vpython / three.js
    prefer_for: ["速度", "加速度", "牛顿第二定律", "浮力"]
  # 3. 测验：每章 5 题
  quiz:
    enabled: true
    questions_per_chapter: 5
    types: [numeric, text, short_answer]
  # 4. PBL：每单元 1 个
  pbl:
    enabled: true
    project_duration_minutes: 20
    prefer_for: ["牛顿第二定律", "压强", "浮力"]
  # 5. 白板：解题演练
  whiteboard:
    enabled: true
    engine: "whiteboard+katex"
    prefer_for: ["匀变速直线运动", "牛顿第二定律", "浮力"]
  # 6. 3D 可视化：几何/空间
  viz3d:
    enabled: true
    engine: "three.js"
    scene_type: "physics"  # 物理仿真类 3D
    prefer_for: ["匀变速直线运动", "浮力"]
  # 7. 游戏：物理模拟器
  game:
    enabled: true
    engine: "phaser.js"
    game_type: "physics_sim"
    prefer_for: ["速度", "加速度", "牛顿第二定律"]
  # 8. TTS：所有概念
  tts:
    enabled: true
    voice: "male-qn-qingse"
    speed: 1.0
    auto_generate_for_concepts: true
  # 9. AI 配图：所有概念
  image:
    enabled: true
    style: "educational"
    prefer_for: ["牛顿第一定律", "牛顿第三定律", "液体压强"]
  # 10. 教学视频：重要概念
  video:
    enabled: true
    duration_sec: 60
    prefer_for: ["牛顿第二定律", "浮力"]
