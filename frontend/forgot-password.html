<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>找回密码 · DDW AI Hub | 锐果互动</title>
<link rel="icon" href="/company/assets/logo/logo-favicon.png">
<link rel="stylesheet" href="/company/assets/css/base.css">
<link rel="stylesheet" href="/company/assets/css/themes/standard.css">
<style>
  .page { min-height: calc(100vh - 140px); display: flex; align-items: center; justify-content: center; padding: 48px 20px; background: var(--bg-base); position: relative; overflow: hidden; }
  .page::before { content: ""; position: absolute; inset: 0; background: url('/company/assets/img/login-bg.jpg') center / cover no-repeat; opacity: 0.35; filter: brightness(1.6); pointer-events: none; }
  .page::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,0) 0%, var(--bg-base) 100%); pointer-events: none; }
  .card { width: 100%; max-width: 420px; background: var(--bg-card); border: 1.5px solid var(--border-strong); border-radius: 14px; padding: 36px 32px; box-shadow: 0 8px 32px var(--shadow); position: relative; z-index: 1; }
  .card .logo-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 8px; }
  .card .logo-row img { height: 40px; }
  .card h2 { text-align: center; font-size: 20px; margin: 0 0 6px; color: var(--text-primary); }
  .card .sub { text-align: center; font-size: 13.5px; color: var(--text-secondary); margin-bottom: 26px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13.5px; color: var(--text-primary); margin-bottom: 6px; font-weight: 600; }
  .form-group input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14.5px; background: var(--bg-page); color: var(--text-primary); transition: border-color .2s; }
  .form-group input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-glow); }
  .captcha-row { display: flex; gap: 8px; align-items: center; }
  .captcha-row input { flex: 1; }
  .captcha-img { height: 42px; border-radius: 6px; cursor: pointer; border: 1px solid var(--border); }
  .captcha-refresh { font-size: 12.5px; color: var(--brand); cursor: pointer; white-space: nowrap; }
  .captcha-refresh:hover { text-decoration: underline; }
  .btn { width: 100%; padding: 11px 0; background: var(--brand); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all .2s; }
  .btn:hover { background: var(--brand-hover); box-shadow: 0 4px 16px var(--brand-glow); }
  .btn:disabled { background: var(--text-muted); cursor: not-allowed; box-shadow: none; }
  .footer { text-align: center; margin-top: 22px; font-size: 13px; }
  .footer a { color: var(--text-muted); text-decoration: none; }
  .footer a:hover { color: var(--brand); }
  .error-msg { font-size: 13px; color: #ff4d4f; text-align: center; margin-bottom: 12px; min-height: 20px; }
  .success-msg { font-size: 13px; color: #52c41a; text-align: center; margin-bottom: 12px; min-height: 20px; }
  .step { display: none; }
  .step.active { display: block; }
  .strength-bar { height: 4px; border-radius: 2px; background: #e8e8e8; margin-top: 6px; overflow: hidden; }
  .strength-bar .fill { height: 100%; border-radius: 2px; transition: width .3s, background .3s; width: 0; }
  .strength-text { font-size: 12px; margin-top: 4px; color: var(--text-muted); }
  .code-input { letter-spacing: 8px; text-align: center; font-size: 22px; font-weight: 700; }
</style>
</head>
<body>

<div class="page">
  <div class="card">
    <div class="logo-row">
      <img src="/company/assets/logo/logo-200.png" alt="武汉锐果互动信息技术有限公司 Logo">
    </div>
    <h2>找回密码</h2>
    <p class="sub" id="stepSub">输入邮箱和验证码，重置您的密码</p>

    <div id="errorMsg" class="error-msg"></div>
    <div id="successMsg" class="success-msg"></div>

    <!-- Step 1: 邮箱 + 图形验证码 → 发送邮件验证码 -->
    <div id="step1" class="step active">
      <form id="sendForm">
        <div class="form-group">
          <label>邮箱</label>
          <input type="email" name="email" id="emailInput" placeholder="请输入注册邮箱" maxlength="255" required>
        </div>
        <div class="form-group">
          <label>图形验证码</label>
          <div class="captcha-row">
            <input type="text" name="captcha_code" id="captchaCode" placeholder="4 位验证码" maxlength="4" required>
            <img id="captchaImg" class="captcha-img" alt="验证码" title="点击换一张">
            <a id="captchaRefresh" class="captcha-refresh">换一张</a>
          </div>
        </div>
        <button type="submit" class="btn" id="sendBtn">发送验证码</button>
      </form>
    </div>

    <!-- Step 2: 邮件验证码 + 新密码 + 确认密码 → 重置 -->
    <div id="step2" class="step">
      <form id="resetForm">
        <div class="form-group">
          <label>邮箱验证码</label>
          <input type="text" name="code" id="codeInput" class="code-input" placeholder="6 位验证码" maxlength="6" required>
        </div>
        <div class="form-group">
          <label>新密码</label>
          <input type="password" name="new_password" id="newPwd" placeholder="至少 8 位，含字母和数字" maxlength="128" required>
          <div class="strength-bar"><div class="fill" id="strengthFill"></div></div>
          <div class="strength-text" id="strengthText"></div>
        </div>
        <div class="form-group">
          <label>确认新密码</label>
          <input type="password" name="confirm_password" id="confirmPwd" placeholder="再次输入新密码" maxlength="128" required>
        </div>
        <button type="submit" class="btn" id="resetBtn">重置密码</button>
      </form>
    </div>

    <!-- Step 3: 成功 -->
    <div id="step3" class="step">
      <div style="text-align:center;padding:24px 0;">
        <div style="font-size:48px;margin-bottom:16px;">&#10003;</div>
        <p style="font-size:16px;color:var(--text-primary);margin-bottom:8px;">密码重置成功！</p>
        <p style="font-size:13px;color:var(--text-secondary);">3 秒后自动跳转到登录页...</p>
      </div>
    </div>

    <div class="footer">
      <a href="/ui/login.html">← 返回登录</a>
    </div>
  </div>
</div>

<script src="./js/api.js"></script>
<script>
(function () {
  'use strict';

  var currentEmail = '';
  var currentCaptchaId = '';

  var step1 = document.getElementById('step1');
  var step2 = document.getElementById('step2');
  var step3 = document.getElementById('step3');
  var stepSub = document.getElementById('stepSub');
  var errorMsg = document.getElementById('errorMsg');
  var successMsg = document.getElementById('successMsg');
  var captchaImg = document.getElementById('captchaImg');
  var captchaRefresh = document.getElementById('captchaRefresh');

  function showStep(n) {
    step1.className = 'step' + (n === 1 ? ' active' : '');
    step2.className = 'step' + (n === 2 ? ' active' : '');
    step3.className = 'step' + (n === 3 ? ' active' : '');
    if (n === 1) stepSub.textContent = '输入邮箱和验证码，重置您的密码';
    if (n === 2) stepSub.textContent = '输入邮件中的 6 位验证码和新密码';
    if (n === 3) stepSub.textContent = '密码已重置';
  }

  function showError(msg) { errorMsg.textContent = msg; successMsg.textContent = ''; }
  function showSuccess(msg) { successMsg.textContent = msg; errorMsg.textContent = ''; }
  function clearMsg() { errorMsg.textContent = ''; successMsg.textContent = ''; }

  // 加载图形验证码
  async function loadCaptcha() {
    try {
      var resp = await DDW.api.get('/auth/captcha');
      if (resp.ok && resp.data) {
        currentCaptchaId = resp.data.captcha_id;
        captchaImg.src = resp.data.image_base64;
      }
    } catch (e) {}
  }
  loadCaptcha();
  captchaImg.addEventListener('click', loadCaptcha);
  captchaRefresh.addEventListener('click', function (e) { e.preventDefault(); loadCaptcha(); });

  // 密码强度检测
  var newPwd = document.getElementById('newPwd');
  var strengthFill = document.getElementById('strengthFill');
  var strengthText = document.getElementById('strengthText');

  newPwd.addEventListener('input', function () {
    var pwd = newPwd.value;
    var score = 0;
    if (pwd.length >= 8) score++;
    if (pwd.length >= 12) score++;
    if (/[a-zA-Z]/.test(pwd) && /\d/.test(pwd)) score++;
    if (/[^a-zA-Z0-9]/.test(pwd)) score++;
    if (pwd.length >= 16) score++;

    var labels = ['', '弱', '一般', '较强', '强', '极强'];
    var colors = ['', '#ff4d4f', '#faad14', '#52c41a', '#1890ff', '#722ed1'];
    var pct = [0, 20, 40, 60, 80, 100];

    strengthFill.style.width = pct[score] + '%';
    strengthFill.style.background = colors[score];
    strengthText.textContent = pwd.length > 0 ? '密码强度：' + labels[score] : '';
  });

  // Step 1: 发送验证码
  document.getElementById('sendForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    clearMsg();

    var email = document.getElementById('emailInput').value.trim();
    var captchaCode = document.getElementById('captchaCode').value.trim();

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showError('请输入正确的邮箱地址');
      return;
    }
    if (!captchaCode) {
      showError('请输入图形验证码');
      return;
    }

    var btn = document.getElementById('sendBtn');
    btn.disabled = true;
    btn.textContent = '发送中...';

    try {
      var resp = await DDW.api.post('/auth/forgot-password', {
        email: email,
        captcha_id: currentCaptchaId,
        captcha_code: captchaCode,
      });

      if (resp.ok && resp.data && resp.data.sent) {
        currentEmail = email;
        showSuccess('验证码已发送至 ' + email + '，请查收');
        showStep(2);
      } else if (resp.code === 429) {
        showError(resp.message || resp.data?.detail || '请求过于频繁，请稍后再试');
      } else {
        showError(resp.message || resp.data?.detail || '发送失败');
      }
    } catch (e) {
      showError('网络错误，请稍后重试');
    }

    btn.disabled = false;
    btn.textContent = '发送验证码';
    loadCaptcha();
  });

  // Step 2: 重置密码
  document.getElementById('resetForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    clearMsg();

    var code = document.getElementById('codeInput').value.trim();
    var new_password = newPwd.value;
    var confirm_password = document.getElementById('confirmPwd').value;

    if (!code || code.length !== 6) {
      showError('请输入 6 位验证码');
      return;
    }
    if (new_password.length < 8) {
      showError('密码长度不能少于 8 位');
      return;
    }
    if (new_password !== confirm_password) {
      showError('两次输入的密码不一致');
      return;
    }

    var btn = document.getElementById('resetBtn');
    btn.disabled = true;
    btn.textContent = '重置中...';

    try {
      var resp = await DDW.api.post('/auth/reset-password', {
        email: currentEmail,
        code: code,
        new_password: new_password,
      });

      if (resp.ok && resp.data && resp.data.reset) {
        showStep(3);
        setTimeout(function () { window.location.href = '/ui/login.html'; }, 3000);
      } else {
        showError(resp.message || resp.data?.detail || '重置失败');
      }
    } catch (e) {
      showError('网络错误，请稍后重试');
    }

    btn.disabled = false;
    btn.textContent = '重置密码';
  });
})();
</script>

</body>
</html>
