name: ddw_patient_crm
tier: beta
version: "0.1.0"
description: "口腔门诊患者档案 CRM（基本信息/过敏史/标签/就诊记录）"
author: "DDW Team"
license: commercial
type: plugin
entry: plugin:Plugin
dependencies:
  sdk: ">=2.0.0"
  plugins:
    ddw_dental_emr: ">=0.1.0"
endpoints:
  - path: /api/v1/plugins/ddw_patient_crm/health
    method: GET
  - path: /api/v1/plugins/ddw_patient_crm/patients
    method: POST
  - path: /api/v1/plugins/ddw_patient_crm/patients/{id}
    method: GET
  - path: /api/v1/plugins/ddw_patient_crm/patients
    method: GET
  - path: /api/v1/plugins/ddw_patient_crm/patients/{id}
    method: PATCH
  - path: /api/v1/plugins/ddw_patient_crm/patients/{id}/visits
    method: GET
  - path: /api/v1/plugins/ddw_patient_crm/stats
    method: GET
