name: ddw-training
license: commercial
tier: beta
version: 0.1.0
display_name: DDW 智能培训
description: 苏格拉底教学法 + 多媒体课件 + 自动评估
engine: plugin_base
isolation: inline
dependencies:
  plugins:
    ddw-llm-gateway: ">=1.0.0"
permissions:
  - llm.chat
  - event_bus.publish
  - event_bus.subscribe
config_schema:
  type: object
  properties:
    default_subject:
      type: string
      default: physics
      enum: [physics, chemistry]
    socratic_depth:
      type: integer
      default: 3
      minimum: 1
      maximum: 6
    llm_provider:
      type: string
      default: stub
    max_turns_per_session:
      type: integer
      default: 30
