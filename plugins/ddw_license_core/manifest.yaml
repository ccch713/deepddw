name: ddw-license-core
license: free
tier: core
version: 1.0.0
display_name: DDW 许可证管理
description: 销售端许可证（License）全生命周期管理。许可证单号自动生成、状态机（active/expired/suspended/revoked/renewed）、自动过期检查、续费、暂停/恢复/吊销、插件授权清单管理、统计概览。
engine: plugin_base
isolation: inline

permissions:
  - database.read
  - database.write

dependencies:
  plugins: []

config_schema:
  type: object
  properties:
    default_tenant_id:
      type: integer
      default: 1
    default_page_size:
      type: integer
      default: 20
    license_types:
      type: array
      default: [trial, formal, renewal]
      description: 许可证类型枚举
    statuses:
      type: array
      default: [active, expired, suspended, revoked, renewed]
      description: 许可证状态枚举

router_prefix: /api/v1/plugins/ddw-license-core
