name: ddw_dental_emr
tier: beta
version: "0.1.0"
description: "口腔病历主插件（基于 9 类模板的创建/查询/状态流转）"
author: "DDW Team"
license: commercial
type: plugin
entry: plugin:Plugin
dependencies:
  sdk: ">=2.0.0"
  plugins:
    ddw_clinical_asr: ">=0.1.0"
    ddw_dental_emr_template_kit: ">=0.1.0"
endpoints:
  - path: /api/v1/plugins/ddw_dental_emr/health
    method: GET
    summary: 健康检查
  - path: /api/v1/plugins/ddw_dental_emr/records
    method: POST
    summary: 创建病历
  - path: /api/v1/plugins/ddw_dental_emr/records/{id}
    method: GET
    summary: 获取单条病历
  - path: /api/v1/plugins/ddw_dental_emr/records
    method: GET
    summary: 病历列表（按 patient/doctor/treatment/status 过滤 + 分页）
  - path: /api/v1/plugins/ddw_dental_emr/records/{id}/status
    method: PATCH
    summary: 更新病历状态
  - path: /api/v1/plugins/ddw_dental_emr/from-transcript
    method: POST
    summary: 从转写 job_id 一键生成病历草稿
  - path: /api/v1/plugins/ddw_dental_emr/templates
    method: GET
    summary: 代理 T16 模板列表
