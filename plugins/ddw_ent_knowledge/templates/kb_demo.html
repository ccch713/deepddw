<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DDW 知识库演示</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f5;height:100vh;display:flex;flex-direction:column}
.header{background:#1a1a2e;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px}
.header h1{font-size:16px;font-weight:600}
.header .badge{background:#16213e;padding:2px 8px;border-radius:10px;font-size:12px}
.main{flex:1;display:flex;overflow:hidden}
.sidebar{width:280px;background:#fff;border-right:1px solid #e0e0e0;display:flex;flex-direction:column;padding:16px}
.sidebar h3{font-size:14px;color:#666;margin-bottom:12px}
.upload-zone{border:2px dashed #ccc;border-radius:8px;padding:20px;text-align:center;cursor:pointer;transition:border-color .2s}
.upload-zone:hover{border-color:#1a1a2e}
.upload-zone.dragover{border-color:#4CAF50;background:#f0fff0}
.upload-zone input{display:none}
.upload-zone p{font-size:13px;color:#888;margin-top:8px}
.doc-list{flex:1;overflow-y:auto;margin-top:16px}
.doc-item{padding:8px;border-bottom:1px solid #f0f0f0;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.doc-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-item .meta{color:#999;font-size:11px}
.doc-item .del{color:#e74c3c;cursor:pointer;font-size:11px;margin-left:8px}
.chat-area{flex:1;display:flex;flex-direction:column}
.messages{flex:1;overflow-y:auto;padding:20px}
.msg{margin-bottom:16px;max-width:80%}
.msg.user{margin-left:auto}
.msg.user .bubble{background:#1a1a2e;color:#fff}
.msg.bot .bubble{background:#fff}
.bubble{padding:12px 16px;border-radius:12px;font-size:14px;line-height:1.6;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.bubble .meta-info{font-size:11px;color:#999;margin-top:8px;padding-top:8px;border-top:1px solid #f0f0f0}
.input-area{padding:16px;background:#fff;border-top:1px solid #e0e0e0;display:flex;gap:8px}
.input-area input{flex:1;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none}
.input-area input:focus{border-color:#1a1a2e}
.input-area button{padding:10px 20px;background:#1a1a2e;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px}
.input-area button:hover{background:#16213e}
.input-area button:disabled{background:#ccc;cursor:not-allowed}
.typing{display:inline-block}
.typing span{display:inline-block;width:6px;height:6px;background:#999;border-radius:50%;margin:0 1px;animation:blink 1.4s infinite both}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
</style>
</head>
<body>
<div class="header">
  <h1>DDW 知识库演示</h1>
  <span class="badge">MVP</span>
</div>
<div class="main">
  <div class="sidebar">
    <h3>上传文档</h3>
    <div class="upload-zone" id="uploadZone">
      <input type="file" id="fileInput" accept=".md,.txt,.json,.yaml,.yml,.pdf" multiple>
      <p>点击或拖拽文件到这里</p>
      <p style="font-size:11px;color:#bbb">支持 md/txt/json/yaml/pdf</p>
    </div>
    <h3 style="margin-top:20px">已入库文档</h3>
    <div class="doc-list" id="docList"></div>
  </div>
  <div class="chat-area">
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <input type="text" id="queryInput" placeholder="输入问题..." autocomplete="off">
      <button id="sendBtn">发送</button>
    </div>
  </div>
</div>
<script>
const API = '/api/v1/plugins/ddw-ent-knowledge';
const messagesEl = document.getElementById('messages');
const queryInput = document.getElementById('queryInput');
const sendBtn = document.getElementById('sendBtn');
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
const docList = document.getElementById('docList');

// Upload
uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('dragover');
  uploadFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => uploadFiles(fileInput.files));

async function uploadFiles(files) {
  for (const file of files) {
    const fd = new FormData();
    fd.append('file', file);
    try {
      const resp = await fetch(`${API}/documents/upload`, { method: 'POST', body: fd });
      const data = await resp.json();
      if (data.error) {
        alert(`上传失败: ${data.error}`);
      } else {
        addSystemMsg(`文档「${file.name}」入库成功，${data.chunk_count} 个分块`);
      }
    } catch (e) {
      alert(`上传异常: ${e.message}`);
    }
  }
  fileInput.value = '';
  loadDocs();
}

// Doc list
async function loadDocs() {
  try {
    const resp = await fetch(`${API}/documents?page_size=50`);
    const data = await resp.json();
    docList.innerHTML = '';
    (data.items || []).forEach(d => {
      const el = document.createElement('div');
      el.className = 'doc-item';
      el.innerHTML = `<span class="name" title="${d.file_name}">${d.file_name}</span><span class="meta">${d.chunk_count}块</span><span class="del" data-id="${d.id}">删除</span>`;
      el.querySelector('.del').addEventListener('click', () => deleteDoc(d.id));
      docList.appendChild(el);
    });
  } catch (e) { console.error(e); }
}

async function deleteDoc(id) {
  if (!confirm('确认删除？')) return;
  await fetch(`${API}/documents/${id}`, { method: 'DELETE' });
  loadDocs();
}

// Chat
function addMsg(role, html) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `<div class="bubble">${html}</div>`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function addSystemMsg(text) {
  addMsg('bot', `<span style="color:#4CAF50">✓</span> ${text}`);
}

sendBtn.addEventListener('click', send);
queryInput.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

async function send() {
  const query = queryInput.value.trim();
  if (!query) return;
  queryInput.value = '';
  sendBtn.disabled = true;

  addMsg('user', query);
  const botDiv = addMsg('bot', '<div class="typing"><span></span><span></span><span></span></div>');

  try {
    const resp = await fetch(`${API}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, top_k: 5 }),
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let fullText = '';
    let kbTookMs = resp.headers.get('X-KB-Took-Ms') || '?';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const data = JSON.parse(line.slice(6));
          if (data.type === 'token') {
            fullText += data.token;
            botDiv.querySelector('.bubble').innerHTML = fullText.replace(/\n/g, '<br>');
          } else if (data.type === 'done') {
            botDiv.querySelector('.bubble').innerHTML = fullText.replace(/\n/g, '<br>') +
              `<div class="meta-info">检索 ${kbTookMs}ms · 总耗时 ${data.elapsed_ms}ms</div>`;
          }
        } catch (e) {}
      }
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  } catch (e) {
    botDiv.querySelector('.bubble').innerHTML = `<span style="color:red">请求失败: ${e.message}</span>`;
  }
  sendBtn.disabled = false;
  queryInput.focus();
}

loadDocs();
</script>
</body>
</html>
