# deepDDW 团队版（DSH for Teams）设置面板 — bundle 补丁层
# 注册为 dsh 社区插件：安装后在「设置 → 社区插件」下方出现「DDW团队版」分区。
# 参考「皮肤中心 / Web UI 插件 / 宠物」的注册方式（settings.section slot）。
# 安装：dsh plugin add @deepddw/dsh-teams-panel
- insert:
    - id: ddw-teams-panel
      name: '@deepddw/dsh-teams-panel'
      config:
        # deepDDW 网关地址（与 MCP 桥同源；供面板拉取状态/成员/文件库 API）
        gatewayUrl: http://127.0.0.1:8500
